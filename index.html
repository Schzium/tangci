 kepada Yehuwa seperti air. Angkatlah tanganmu untuk mendoakan nyawa anak-anakmu, Yang pingsan di jalan-jalan karena kelaparan. "]]},"r42":{"j":"p","jd":"Bantuan bagi Orang yang Dikeluarkan dari Sidang","sub":"w24.08 28 ¶7-9","isi":[["p","1-2. (a) Bagaimana pandangan Yehuwa terhadap orang yang melakukan dosa serius dan tidak bertobat? (b) Apa yang Yehuwa harapkan dari orang-orang yang berbuat dosa?"],["p","YEHUWA bukan Allah yang serba boleh. Dia membenci dosa. ( Mz. 5:​4-6 ) Karena itu, Dia ingin kita menaati standar-Nya yang benar, yang Dia berikan dalam Firman-Nya. Tentu saja, Yehuwa tidak mengharapkan kesempurnaan dari manusia yang tidak sempurna. ( Mz. 130:​3, 4 ) Meski begitu, Dia tidak senang dengan ’orang-orang yang tidak menghormati Dia, yang memakai kebaikan hati-Nya yang luar biasa sebagai alasan untuk kelakuan mereka yang tidak tahu malu’. ( Yud. 4 ) Malah, Alkitab mengatakan bahwa akan ada ”pemusnahan bagi orang-orang yang tidak menghormati Allah” dalam perang pada hari besar Allah, Armagedon.— 2 Ptr. 3:7; Why. 16:16 ."],["p","2 Tapi, Yehuwa tidak ingin seorang pun dimusnahkan . Seperti yang kita bahas sebelumnya dalam seri artikel ini, Alkitab dengan jelas mengatakan bahwa Dia ”ingin agar semuanya bertobat”. ( 2 Ptr. 3:9 ) Para penatua meniru Yehuwa sewaktu mereka dengan sabar berupaya membantu orang yang berbuat dosa untuk bertobat dan kembali kepada Yehuwa. Tapi, tidak semua orang yang berbuat dosa mau menyambut bantuan yang diberikan. ( Yes. 6:9 ) Ada yang terus melakukan dosanya meskipun para penatua sudah berulang kali berupaya membantu dia bertobat. Kalau begitu, apa yang harus dilakukan para penatua?"]]},"r43":{"j":"p","jd":"Bawa Yang Penting, Buang Sisanya","sub":"w23.08 29-30 ¶12-13","isi":[["p","1. Menurut Ibrani 12:1 , bagaimana kita bisa memenangkan perlombaan menuju kehidupan?"],["p","ALKITAB menyamakan kehidupan kita sebagai orang Kristen seperti sebuah perlombaan. Pelari yang berhasil mencapai garis finis akan mendapat kehidupan abadi. ( 2 Tim. 4:7, 8 ) Kita perlu berupaya sebisa-bisanya untuk terus berlari, terutama karena garis finis itu sudah di depan mata. Rasul Paulus, yang sudah berhasil menyelesaikan perlombaan ini, menyebutkan bagaimana kita bisa memenangkannya. Dia menasihati kita untuk ’membuang semua beban dan berlari dengan tekun dalam perlombaan yang ditetapkan bagi kita’.​— Baca Ibrani 12:1 ."],["p","2. Apa maksudnya ’membuang semua beban’?"]]},"r44":{"j":"a","jd":"Ratapan","sub":"Ratapan 2:1","isi":[[1,"2 Yehuwa menyelubungi putri Zion dengan awan kemarahan-Nya! Keindahan Israel telah Dia lemparkan dari langit ke bumi.  Saat murka, Dia tidak mengingat tumpuan kaki-Nya. "]]},"r45":{"j":"p","jd":"","sub":"w07 1/6 9 ¶1","isi":[["p","2:1 ​ —Bagaimana ’keindahan Israel telah dilemparkan dari langit ke bumi’? Karena ”langit lebih tinggi daripada bumi”, direndahkannya sesuatu yang tinggi kadang-kadang digambarkan seolah-olah ’dilemparkan dari langit ke bumi’. ”Keindahan Israel”—kemuliaan dan kekuasaan yang ia miliki sewaktu masih diberkati Yehuwa—dicampakkan dengan pembinasaan Yerusalem dan penelantaran Yehuda.— Yesaya 55:9 ."]]},"r46":{"j":"a","jd":"Ratapan","sub":"Ratapan 1:8-18","isi":[[8,"Yerusalem melakukan dosa besar.  Karena itulah dia memuakkan. Semua yang dulu menghormatinya sekarang menganggap dia murahan, karena mereka melihat dia telanjang.  Dia merintih dan berpaling karena malu."],[9,"Kenajisannya tampak pada bajunya. Dia tidak memikirkan masa depannya.  Kejatuhannya sangat parah. Tidak ada yang menghibur dia. Oh Yehuwa, lihatlah penderitaanku, karena musuhku menyombongkan diri. "],[10,"Lawannya telah mengambil semua hartanya.  Yerusalem telah melihat bangsa-bangsa lain masuk ke tempat sucinya,  Yaitu bangsa-bangsa yang menurut perintah-Mu tidak boleh ada bersama umat-Mu."],[11,"Semua penduduknya berkeluh kesah. Mereka mencari roti.  Mereka menukar barang berharga mereka dengan makanan, supaya bisa bertahan hidup. Oh Yehuwa, lihatlah. Aku menjadi seperti seorang wanita yang hina."],[12,"Apa hal itu biasa saja bagi kalian yang lewat di jalan? Coba lihat! Apa ada rasa sakit seperti rasa sakit yang aku derita, Yang Yehuwa timpakan kepadaku saat kemarahan-Nya berkobar? "],[13,"Dari atas Dia mengirimkan api untuk membakar setiap tulangku.  Dia memasang jaring untuk kakiku. Dia memaksaku untuk berputar balik. Dia membuatku menjadi wanita yang ditinggalkan. Aku sakit sepanjang hari."],[14,"Dosa-dosaku dipasang di leherku seperti kayu kuk. Dia memasangnya dengan tangan-Nya. Itu ditaruh di leherku, sehingga kekuatanku hilang. Yehuwa menyerahkan aku ke tangan orang-orang yang tidak sanggup kulawan. "],[15,"Yehuwa telah menyingkirkan orang-orang kuat yang ada di tengah-tengahku.  Dia mengumpulkan tentara untuk meremukkan pemuda-pemudaku.  Yehuwa menginjak-injak anak gadis Yehuda di tempat pemerasan anggur. "],[16,"Aku menangis karena hal-hal ini. Air mataku bercucuran. Orang-orang yang bisa menghiburku atau memberiku semangat sudah sangat jauh dariku. Anak-anak lelakiku telantar, karena musuh telah menang."],[17,"Zion menadahkan tangannya. Dia tidak punya siapa-siapa untuk menghiburnya. Yehuwa telah memerintahkan semua musuh di sekitar Yakub untuk melawannya.  Bagi mereka, Yerusalem memuakkan. "],[18,"Tindakan Yehuwa itu benar, karena aku telah melanggar perintah-Nya.  Semua bangsa, dengarlah. Lihatlah rasa sakitku. Para gadis dan pemudaku telah ditawan. "]]},"r47":{"j":"p","jd":"Variasi Suara","sub":"th pelajaran 10","isi":[["p","PELAJARAN 10"],["h","Amsal 8:4, 7"],["p","YANG PERLU DILAKUKAN: Supaya Saudara bisa menyampaikan gagasan dengan jelas dan menggugah perasaan pendengar, variasikan volume, tinggi rendah, dan kecepatan suara Saudara."],["h","CARA MELAKUKANNYA:"],["p","Variasikan volume suara. Besarkan volume suara untuk menandaskan gagasan utama, menggerakkan pendengar untuk bertindak, atau saat membacakan ayat yang berisi berita penghukuman. Kecilkan volume suara kalau Saudara ingin menunjukkan perasaan takut atau khawatir atau membuat pendengar penasaran dengan apa yang akan Saudara bahas."],["p","Jangan terlalu sering membesarkan volume suara supaya pendengar tidak merasa sedang dimarahi. Jangan menarik perhatian pada diri sendiri dengan berbicara terlalu berlebihan."],["p","Variasikan tinggi rendah nada. Naikkan nada suara untuk menunjukkan semangat atau untuk menunjukkan ukuran dan jarak. Turunkan nada suara untuk menunjukkan perasaan sedih atau khawatir."],["p","Variasikan kecepatan bicara. Berbicaralah dengan lebih cepat untuk menunjukkan semangat. Berbicaralah dengan lebih lambat saat menyampaikan gagasan-gagasan penting."],["p","Agar pendengar tidak kaget, jangan mengubah kecepatan bicara secara mendadak. Selain itu, jangan berbicara terlalu cepat agar kata-kata Saudara tetap jelas."]]},"r48":{"j":"p","jd":"Wajar","sub":"lmd pelajaran 2 nomor 4","isi":[["p","Kis. 8:​30, 31"],["p","PELAJARAN 2"],["p","Prinsip: ”Betapa baiknya sepatah kata yang diucapkan pada waktu yang tepat!”— Ams. 15:23 ."]]},"r49":{"j":"p","jd":"Peduli","sub":"lmd pelajaran 9 nomor 4","isi":[["p","Mrk. 6:​30-34"],["p","PELAJARAN 9"],["p","Prinsip: ”Bergembiralah bersama orang yang bergembira, dan menangislah bersama orang yang menangis.”— Rm. 12:15 ."]]},"r50":{"j":"p","jd":"Pikirkan Minat Mereka","sub":"lmd pelajaran 1 nomor 4b","isi":[["p","Yoh. 4:​6-9"],["p","PELAJARAN 1"],["p","Prinsip: ”Orang yang punya kasih . . . tidak mementingkan diri.”— 1 Kor. 13:​4, 5 ."]]},"r51":{"j":"a","jd":"Surat untuk Sidang Jemaat di Galatia","sub":"Surat untuk Sidang Jemaat di Galatia 6:10","isi":[[10,"Maka, selama masih ada kesempatan, mari kita berbuat baik kepada semua orang, terutama kepada saudara seiman kita."]]},"r52":{"j":"a","jd":"Surat Pertama Petrus","sub":"Surat Pertama Petrus 5:2","isi":[[2,"Gembalakan kawanan domba Allah yang dipercayakan kepada kalian. Kalian harus melayani sebagai pengawas, tidak dengan terpaksa, tapi dengan rela di hadapan Allah, dengan bersemangat, bukan demi mencari keuntungan yang tidak jujur, "]]},"r53":{"j":"p","jd":"”Diberkatilah Dia Melebihi Semua Wanita”","sub":"wcg bab 17","isi":[["p","17 YAEL"],["p","SISERA tidak habis pikir. Bagaimana mungkin pasukannya yang kuat, dengan 900 kereta perangnya yang menakutkan, bisa kalah melawan pasukan Israel, yang hanya berjalan kaki dan punya senjata ala kadarnya! Dia pun lari meninggalkan para prajuritnya dan membiarkan mereka tewas di Lembah Yizreel. Sekarang, yang dia pikirkan hanya di mana dia bisa bersembunyi. Jadi, dia pergi menuju kemah milik Heber orang Keni."],["p","Orang Keni sudah lama punya hubungan baik dengan orang Israel, bahkan sejak zaman Musa, yang istrinya adalah orang Keni. Sebelumnya, orang Keni hidup berpindah-pindah, tapi sekarang mereka tinggal di Israel. Meski begitu, Heber tidak seperti orang Keni lainnya. Dia berpihak pada Yabin raja Kanaan, bukan pada Israel. Jadi Sisera, sebagai panglima Yabin, berpikir bahwa dia akan aman di perkemahan Heber. Tapi, dia kelihatannya tidak menduga bahwa istri Heber, Yael, punya pandangan yang beda dengan suaminya."],["p","Saat itu, Heber sedang pergi, dan yang ada di kemah adalah Yael. Waktu Yael melihat Sisera datang, dia harus berpikir dengan cepat. Dia pasti tahu siapa Sisera dan seberapa berbahayanya pria itu. Memang, dia mungkin tidak tahu apa yang sudah Yehuwa katakan lewat Debora: Sisera akan mati di tangan seorang wanita, bukan seorang pria. Tapi, ada kemungkinan Yael tahu apa yang Yehuwa ingin dia lakukan. Dari mana kita bisa menyimpulkan hal itu?"],["p","Dalam lagu tentang kemenangan Barak, yang belakangan dibuat oleh Debora dengan bimbingan Yehuwa, ada kata-kata: ”Diberkatilah Yael, istri Heber, orang Keni; diberkatilah dia melebihi semua wanita yang tinggal di kemah.” Dia disebut sebagai orang yang diberkati, bukan orang yang licik atau sadis seperti pendapat beberapa kritikus. Dia adalah pejuang yang berani mendukung perang Yehuwa. Seperti Rahab, Yael memilih untuk berpihak kepada Yehuwa. Dia tahu bahwa Sisera itu musuh Yehuwa dan inilah kesempatan untuk melakukan apa yang Yehuwa inginkan. Tapi, bagaimana caranya?"],["p","Yael tahu bahwa dia tidak sanggup bertarung langsung dengan Sisera, karena Sisera adalah prajurit yang berpengalaman dan pasti sangat kuat. Jadi, Yael mengajak dia masuk ke kemahnya untuk beristirahat. Sisera pun berbaring, dan Yael menyelimutinya. Waktu Sisera meminta air, Yael memberinya susu. Sisera juga meminta Yael untuk berjaga di depan kemah dan berbohong kalau ada yang bertanya apakah ada orang di dalam kemah. Lalu, Sisera tertidur lelap."],["p","Seorang wanita dipilih oleh Allah untuk membunuh panglima yang kejam"],["p","Yael pun melihat bahwa sekaranglah saatnya untuk bertindak. Dia mengambil alat-alat yang kelihatannya sudah sering dia gunakan, yaitu sebuah palu yang berat dan patok tenda, yang dua-duanya mungkin terbuat dari kayu. Lalu sambil mengendap-endap, dia berjalan ke arah panglima yang sedang tidur itu. Dengan sangat hati-hati, dia membungkuk ke dekat kepala Sisera untuk menancapkan patok itu ke pelipis Sisera. Salah gerak sedikit saja, Yael bisa dibunuh dengan kejam. Tapi, itu tidak terjadi. Hanya dalam waktu singkat, Sisera mati tergeletak di kaki Yael!"],["p","Belakangan, datanglah Barak untuk mencari Sisera. Yael pun keluar dan berkata, ”Masuklah, mari saya tunjukkan orang yang Bapak cari.” Begitu masuk, Barak melihat bahwa nubuat Debora ini sudah menjadi kenyataan: ”Yehuwa akan menyerahkan Sisera ke tangan seorang wanita.”"],["p","Yael dipuji dalam lagu kemenangan yang dinyanyikan oleh Debora dan Barak dengan penuh rasa syukur. Setelah itu, nama Yael tidak disebut-sebut lagi di Alkitab. Tapi sampai sekarang, lebih dari 3.200 tahun kemudian, kisahnya masih menjadi pelajaran yang berharga. Meskipun umat Allah tidak lagi berperang menggunakan senjata, kita masih perlu berperang secara rohani. Jadi, kita pun harus berani seperti Yael!"],["h","Baca kisahnya di:"],["p","Hakim 4:​9, 11, 17-22; 5:​24-31"],["h","Untuk dibahas:"],["p","Bagaimana Yael bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Apa persamaan antara perang yang dimenangkan Barak dan perang Armagedon? Apa perbedaannya? ( w19.09 8-9 ¶3-6 )"],["p","2. Heber, suami Yael, berpihak pada orang Kanaan, musuh Israel. Tapi, bagaimana Heber sebenarnya berkerabat dengan orang Israel? ( it ”Heber” No. 2 )"],["p","3. Bagaimana kemenangan Israel atas Sisera dan Yabin menguatkan iman umat Allah ratusan tahun kemudian di zaman seorang pemazmur? ( w08 15/10 14-15 ¶12-15 )"],["p","4. Apa yang bisa kita pelajari dari pujian Debora untuk Yael? ( w15 1/8 15 ¶2 ) Gambar A"],["p","Gambar A"],["h","Pikirkan Pelajarannya"],["p","Dalam situasi apa saja seorang saudari yang suaminya tidak seiman mungkin butuh keberanian seperti Yael?"],["p","Meskipun Yael bukan nabiah seperti Debora ataupun prajurit seperti Barak, dia melakukan apa yang bisa dia lakukan. Apa yang bisa kita pelajari dari Yael kalau pelayanan kita terbatas karena situasi tertentu? Gambar B"],["p","Gambar B"],["p","Dengan cara apa lagi Saudara bisa meniru keberanian Yael?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Yael setelah dia dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Bagaimana teladan Yael membantu seorang saudari muda berani memberikan kesaksian?"],["p","Tirulah Mereka yang Berani, Bukan yang Penakut!—Yael, Bukan Penduduk Meroz (1:40)"],["p","Selain Yael, ada banyak wanita lainnya yang bisa menjadi teladan bagi kita. Bacalah tentang beberapa dari mereka."],["p","”Apa yang Bisa Kita Pelajari dari Para Wanita di Alkitab?” ( ijwbq artikel 161)"]]},"r54":{"j":"a","jd":"Ratapan","sub":"Ratapan 3:22","isi":[[22,"Karena kasih setia Yehuwa, kita tidak binasa.  Sebab belas kasihan-Nya tidak ada habisnya. "]]},"r55":{"j":"p","jd":"Yehuwa Sayang kepada Saudara","sub":"w24.01 30 ¶16","isi":[["p","1. Apa yang Saudara bayangkan sewaktu memikirkan tentang Yehuwa?"],["p","PERNAHKAH Saudara membayangkan seperti apa Yehuwa itu? Sewaktu Saudara berdoa kepada-Nya, apa yang ada di pikiran Saudara? Meskipun Yehuwa tidak kelihatan, Alkitab memberikan beberapa gambaran tentang Dia. Misalnya, Yehuwa disebut sebagai ”matahari dan perisai” serta ”api yang memusnahkan”. ( Mz. 84:11; Ibr. 12:29 ) Dalam sebuah penglihatan, Dia digambarkan seperti emas putih yang berkilauan, takhta-Nya seperti batu safir, dan di sekeliling-Nya ada pelangi yang bercahaya. ( Yeh. 1:​26-28 ) Beberapa gambaran ini mungkin membuat kita kagum kepada Yehuwa atau bahkan merasa rendah diri."],["p","2. Apa yang mungkin membuat kita sulit mendekat kepada Yehuwa?"]]},"r56":{"j":"a","jd":"Ratapan","sub":"Ratapan 3:23","isi":[[23,"Itu selalu ada lagi setiap pagi. Kesetiaan-Mu berlimpah. "]]},"r57":{"j":"a","jd":"Yang Ditulis Matius","sub":"Yang Ditulis Matius 6:34","isi":[[34,"Jadi jangan pernah khawatir soal besok, karena besok ada kekhawatiran lain lagi. Setiap hari punya masalahnya sendiri, dan itu sudah cukup."]]},"r58":{"j":"a","jd":"Ratapan","sub":"Ratapan 3:24","isi":[[24,"Aku berkata, ”Yehuwa adalah bagianku. Karena itulah aku akan sabar menunggu Dia.” "]]},"r59":{"j":"p","jd":"Maukah Saudara Menunggu Yehuwa dengan Sabar?","sub":"w21.08 13 ¶17-19","isi":[["p","1-2. Apa yang akan kita bahas di artikel ini?"],["p","BAGAIMANA perasaan Saudara kalau paket yang Saudara tunggu-tunggu tidak datang-datang, padahal Saudara sangat membutuhkannya? Apakah Saudara akan jadi kecewa? Memang wajar kalau Saudara merasa begitu, karena Amsal 13:12 (catatan kaki) berkata, ”Penantian yang tertunda membuat hati sakit.” Tapi, bagaimana kalau ternyata ada alasan yang kuat kenapa paket itu tidak datang secepat yang Saudara harapkan? Kalau seperti itu, mungkin Saudara akan rela menunggu dengan sabar."],["p","2 Di artikel ini, kita akan membahas beberapa prinsip Alkitab yang bisa membantu kita untuk sabar. ( Mi. 7:7 ) Lalu, kita akan melihat dua situasi yang mengharuskan kita untuk tetap sabar menunggu Yehuwa bertindak. Terakhir, kita akan membahas berkat-berkat yang Yehuwa janjikan kepada orang-orang yang mau menantikan Dia."]]},"r60":{"j":"a","jd":"Ratapan","sub":"Ratapan 3:27","isi":[[27,"Sungguh baik kalau seseorang menanggung beban berat pada masa mudanya. "]]},"r61":{"j":"p","jd":"","sub":"w07 1/6 11 ¶5","isi":[["p","3:27 . Menghadapi ujian iman semasa muda boleh jadi berarti menanggung kesukaran dan ejekan. Namun, ”adalah baik bagi laki-laki apabila ia memikul kuk pada masa mudanya”. Mengapa? Karena belajar memikul kuk penderitaan semasa muda mempersiapkan orang itu untuk menghadapi berbagai tantangan dalam kehidupannya di kemudian hari."]]},"r62":{"j":"a","jd":"Ratapan","sub":"Ratapan 3:19-42","isi":[[19,"Ingatlah bahwa aku menderita dan tidak punya tempat tinggal, bahwa aku makan tanaman pahit dan tanaman beracun. "],[20,"Engkau pasti ingat dan membungkuk untuk menolongku. "],[21,"Aku terus mengingat itu dalam hatiku. Karena itulah aku akan sabar menunggu-Mu. "],[22,"Karena kasih setia Yehuwa, kita tidak binasa.  Sebab belas kasihan-Nya tidak ada habisnya. "],[23,"Itu selalu ada lagi setiap pagi. Kesetiaan-Mu berlimpah. "],[24,"Aku berkata, ”Yehuwa adalah bagianku. Karena itulah aku akan sabar menunggu Dia.” "],[25,"Yehuwa baik kepada orang yang berharap kepada-Nya, kepada yang terus mencari-Nya. "],[26,"Sungguh baik kalau seseorang sabar menunggu keselamatan dari Yehuwa. "],[27,"Sungguh baik kalau seseorang menanggung beban berat pada masa mudanya. "],[28,"Biarlah orang itu duduk sendirian dan berdiam diri saat Dia menaruh beban itu padanya. "],[29,"Biarlah dia sujud sampai mulutnya menyentuh tanah. Mungkin masih ada harapan. "],[30,"Biarlah dia memberikan pipinya kepada orang yang memukulnya. Biarlah dia dihina sebanyak-banyaknya."],[31,"Sebab Yehuwa tidak akan selamanya menolak kita. "],[32,"Meskipun Dia membuat kita sedih, Dia juga pasti akan berbelaskasihan, karena kasih setia-Nya yang limpah. "],[33,"Sebab hati-Nya tidak ingin membuat anak-anak manusia menderita atau sedih. "],[34,"Orang yang menginjak-injak semua tahanan di negeri ini, "],[35,"Yang merenggut keadilan di hadapan Yang Mahatinggi, "],[36,"Dan yang menipu orang dalam kasus hukumnya Tidak akan Yehuwa biarkan."],[37,"Kalau Yehuwa tidak memerintahkannya, siapa yang bisa memerintahkan agar sesuatu terjadi?"],[38,"Yang Mahatinggi tidak akan mengatakan hal yang buruk bersama hal yang baik."],[39,"Kalau seseorang merasakan akibat dosanya, haruskah dia mengeluh? "],[40,"Mari kita memeriksa dan mencermati tingkah laku kita, dan mari kita kembali kepada Yehuwa. "],[41,"Mari kita memohon kepada Allah di surga dengan setulus hati dan mengangkat tangan dalam doa, "],[42,"”Kami telah berdosa dan memberontak, dan Engkau tidak mengampuni kami. "]]},"r63":{"j":"p","jd":"Ramah dan Bertimbang Rasa","sub":"th pelajaran 12","isi":[["p","PELAJARAN 12"],["h","1 Tesalonika 2:7, 8"],["p","YANG PERLU DILAKUKAN: Berbicaralah dengan tulus, dan tunjukkan bahwa Saudara peduli kepada pendengar Saudara."],["h","CARA MELAKUKANNYA:"],["p","Pikirkan pendengar Saudara. Supaya Saudara bisa berbicara dengan tulus, pikirkan masalah yang mereka hadapi dan bayangkan perasaan mereka."],["p","Pilih kata-kata Saudara dengan baik. Berbicaralah untuk menyegarkan, menghibur, dan menguatkan pendengar Saudara. Hindari kata-kata yang bisa menyinggung perasaan mereka. Jangan menjelek-jelekkan orang yang bukan penyembah Yehuwa atau ajaran yang mereka anggap benar."],["p","Tunjukkan kepedulian Saudara. Dengan nada suara yang ramah dan gerakan yang cocok, tunjukkan bahwa Saudara benar-benar peduli. Pastikan Saudara juga menunjukkannya dari ekspresi wajah Saudara; seringlah tersenyum."],["p","Jangan berbicara atau membaca dengan berlebihan agar Saudara tidak menarik perhatian kepada diri sendiri. Tunjukkan perasaan dengan wajar dan tulus. Cobalah panjangkan bunyi kata-kata Saudara supaya Saudara terdengar ramah."]]},"r64":{"j":"p","jd":"Bijak","sub":"lmd pelajaran 5 nomor 4","isi":[["p","Kis. 17:​22, 23"],["p","PELAJARAN 5"],["p","Prinsip: ”Kata-kata kalian hendaknya selalu menyenangkan.”— Kol. 4:6 ."]]},"r65":{"j":"p","jd":"Rendah Hati","sub":"lmd pelajaran 4 nomor 3","isi":[["p","Kis. 26:​2, 3"],["p","PELAJARAN 4"],["p","Prinsip: ”Dengan rendah hati, anggaplah orang lain lebih tinggi daripada kalian.”— Flp. 2:3 ."]]},"r66":{"j":"p","jd":"Para Lansia—Kalian Berharga bagi Sidang","sub":"w25.12 26-30","isi":[["p","”Waktu saya muda, ada banyak sekali yang bisa saya lakukan. Tapi sekarang, saya tidak bisa lagi seperti dulu.”—Connie, 83 tahun."],["p","Apakah Saudara merasa seperti Saudari Connie? Meskipun Saudara sudah melayani Yehuwa dengan setia selama bertahun-tahun, Saudara mungkin merasa kecil hati kalau membandingkan pelayanan Saudara sekarang dengan yang dulu. Kalau itu yang Saudara rasakan, apa yang bisa membantu Saudara tetap bersukacita?"],["h","YANG YEHUWA MINTA DARI SAUDARA"],["p","Coba pikirkan, ’Apa yang Yehuwa minta dari saya?’ Markus 12:30 menunjukkan apa yang Yehuwa harapkan dari setiap hamba-Nya: ”Kasihilah Yehuwa Allahmu dengan sepenuh hati, sepenuh jiwa, seluruh pikiran, dan seluruh kekuatanmu.” Kata-kata itu pasti menghibur Saudara."],["p","Menurut ayat itu, Yehuwa meminta Saudara untuk melayani Dia dengan sepenuh hati, sepenuh jiwa, seluruh pikiran, dan seluruh kekuatan Saudara . Itu berarti Saudara tidak perlu membandingkan diri Saudara dengan orang lain atau membandingkan apa yang bisa Saudara lakukan sekarang dengan yang dulu."],["p","Waktu masih muda, Saudara berupaya memberikan yang terbaik kepada Yehuwa, sesuai dengan keadaan Saudara pada waktu itu. Dan sekarang, Saudara juga pasti tetap memberikan yang terbaik, sesuai dengan keadaan Saudara sekarang. Jadi sebenarnya, di mata Yehuwa, pelayanan Saudara sekarang sama bernilainya dengan pelayanan Saudara dulu, karena Saudara selalu memberikan yang terbaik."],["p","Di mata Yehuwa, pelayanan Saudara sekarang sama bernilainya dengan pelayanan Saudara sewaktu muda, karena Saudara selalu memberikan yang terbaik"],["h","PENGALAMAN SAUDARA BISA MENGUATKAN ORANG LAIN"],["p","Ada hal lain lagi yang bisa membantu Saudara tetap positif: Pandanglah usia Saudara sebagai suatu kelebihan, bukan kekurangan. Ada beberapa hal yang tidak bisa Saudara lakukan waktu muda tapi bisa Saudara lakukan sekarang. Apa contohnya?"],["p","Saudara bisa menceritakan pengalaman Saudara yang memperkuat iman. Coba perhatikan beberapa contoh di Alkitab:"],["p","Raja Daud: ”Dulu aku muda, sekarang sudah tua, tapi aku tidak pernah melihat orang benar ditinggalkan, atau anak-anaknya minta-minta makanan.”— Mz. 37:25 ."],["p","Yosua: ”Sebentar lagi saya akan meninggal, dan kalian tahu betul dengan sepenuh hati dan sepenuh jiwa bahwa semua hal baik yang dijanjikan Yehuwa Allah kalian sudah ditepati. Semuanya sudah menjadi kenyataan. Tidak ada satu kata pun yang tidak ditepati.”— Yos. 23:14 ."],["p","Daud dan Yosua sudah melayani Yehuwa selama puluhan tahun dan sudah mengalami banyak hal dalam hidup mereka. Karena mereka berbicara berdasarkan pengalaman mereka sendiri, kata-kata mereka jadi lebih berbobot."],["p","Kalau Saudara sudah lama melayani Yehuwa, Saudara pasti punya banyak pengalaman yang menunjukkan bahwa Yehuwa memberkati Saudara dan orang-orang lain yang juga melayani Dia dengan setia. Nah, coba ceritakan pengalaman seperti itu kepada orang lain. Orang-orang yang mendengarkan pengalaman Saudara pasti akan sangat dikuatkan, dan Saudara pun juga akan dikuatkan.— Rm. 1:​11, 12 ."],["p","Saudara juga bisa saling menguatkan dengan rekan-rekan seiman kalau Saudara sebisa mungkin berhimpun secara fisik. Connie, yang disebutkan sebelumnya, mengatakan, ”Dengan berhimpun di Balai Kerajaan, saya bisa merasakan kasih yang ditunjukkan saudara-saudari. Saya jadi tidak gampang kecil hati. Untuk menunjukkan bahwa saya menghargai kebaikan hati mereka, saya suka memberi mereka hadiah sederhana. Saya berupaya untuk terus ikut melakukan kegiatan rohani bersama saudara-saudari.”"],["h","YEHUWA MENGHARGAI PELAYANAN SAUDARA"],["p","Di Alkitab, ada banyak contoh hamba-hamba Yehuwa yang tetap dikasihi oleh-Nya meski mereka sudah tidak bisa berbuat banyak dalam pelayanan. Contohnya adalah Simeon, seorang pria Israel yang sudah lansia. Setiap kali dia datang ke bait, dia mungkin melihat pria-pria muda melakukan berbagai tugas penting di sana. Simeon sudah tidak sanggup menjalankan tugas-tugas seperti itu. Jadi, dia mungkin merasa sudah tidak berguna bagi Yehuwa. Tapi di mata Yehuwa, Simeon adalah ”orang yang benar dan saleh”, dan Dia memberi Simeon kehormatan untuk melihat Yesus yang masih bayi. Dia bahkan menggunakan Simeon untuk menubuatkan bahwa Yesus akan menjadi Mesias! ( Luk. 2:​25-35 ) Jelaslah, Yehuwa tidak berfokus pada usia Simeon. Sebaliknya, Dia berfokus pada iman Simeon yang kuat, dan Dia membimbing Simeon dengan kuasa kudus-Nya."],["p","Yehuwa memberi Simeon kehormatan untuk melihat Yesus yang masih bayi dan untuk menubuatkan bahwa Yesus akan menjadi Mesias"],["p","Yakinlah bahwa Yehuwa menghargai pelayanan Saudara meskipun keadaan Saudara terbatas. ”Kalau seseorang memberi dengan tulus, Allah akan senang, karena Allah ingin agar orang memberi sesuai dengan kemampuannya, bukan di luar kemampuannya.”— 2 Kor. 8:12 ."],["p","Jadi, berfokuslah pada apa yang bisa Saudara lakukan. Misalnya, coba pikirkan, ’Apakah ada jenis dinas tertentu yang masih bisa saya lakukan meski hanya sebentar?’ Atau, Saudara mungkin bisa menguatkan rekan seiman dengan menelepon mereka atau menulis surat. Hal-hal sederhana seperti itu bisa sangat menguatkan dan menyentuh hati saudara-saudari, apalagi karena itu dilakukan oleh orang seperti Saudara, yang sudah lama melayani Yehuwa."],["p","Meskipun keadaan fisik Saudara terbatas, Saudara masih bisa memberikan yang terbaik kepada Yehuwa dan menikmati pelayanan Saudara. Di kotak ” Ayat Alkitab Menyelamatkan Hidupnya ”, bacalah sebuah pengalaman bagus dari Afrika Timur."],["p","Iman dan kesetiaan Saudara bisa sangat menguatkan saudara-saudari lain. Dan ingatlah bahwa ”Allah itu adil, sehingga Dia tidak akan melupakan perbuatan kalian dan kasih yang kalian tunjukkan untuk nama-Nya dengan melayani dan terus melayani orang-orang suci”.— Ibr. 6:10 ."],["h","TERUSLAH BANTU ORANG LAIN"],["p","Menurut banyak penelitian, para lansia yang suka membantu orang lain biasanya lebih sehat secara fisik dan mental serta lebih panjang umur."],["p","Memang, meskipun berbuat baik bisa bermanfaat, itu tidak bisa menghilangkan dampak usia tua. Hanya Kerajaan Allah yang bisa mewujudkannya, karena saat Kerajaan itu memerintah, Allah akan melenyapkan dosa, yang adalah penyebab utama dari usia tua dan kematian.— Rm. 5:12 ."],["p","Meski begitu, pelayanan Saudara kepada Yehuwa, termasuk membantu orang lain mengenal Dia, bisa membuat harapan Saudara tetap kuat dan bahkan bisa berpengaruh positif pada kesehatan Saudara. Jadi yakinlah, pelayanan Saudara berharga bagi Yehuwa dan kesetiaan Saudara juga berharga bagi saudara-saudari."],["h","Ayat Alkitab Menyelamatkan Hidupnya"],["p","Sewaktu sedang menjaga rak beroda, seorang saudari lansia menyapa seorang wanita muda yang berjalan melewati rak itu. Saudari itu lalu bertanya apakah dia bisa menunjukkan satu ayat yang bagus. Dia membacakan Yeremia 29:​11 , yang mengatakan bahwa Yehuwa ingin memberi kita kedamaian, bukan bencana. Saudari itu kemudian bertanya, ”Menurut ayat ini, Allah ingin kita punya masa depan yang seperti apa?”"],["p","Wanita muda itu sangat tersentuh. Dengan mata berkaca-kaca, dia menjawab, ”Allah ingin saya punya masa depan yang cerah. Terima kasih banyak sudah bacakan ayat ini. Saya yakin ini jawaban doa saya. Belakangan ini, saya punya banyak sekali masalah. Saya sampai berpikir untuk bunuh diri. Tadi pagi saya berdoa supaya Allah memberi saya pertanda bahwa Dia masih peduli kepada saya. Tahu-tahu, Ibu menyapa saya dan membacakan ayat yang menunjukkan perasaan Allah kepada saya. Padahal, Ibu sama sekali tidak kenal saya. Ini pasti bukan kebetulan.”"],["p","Saudari itu lalu menunjukkan beberapa artikel di jw.org yang berisi bantuan dari Alkitab untuk orang yang berpikir untuk bunuh diri. Saudari itu lalu menjelaskan bagaimana pelajaran Alkitab kita dilakukan dan mengundang wanita itu ke perhimpunan. Minggu berikutnya, wanita itu hadir di perhimpunan akhir pekan, dan dia sekarang sudah belajar dengan brosur Hidup Bahagia Selamanya!"],["p","Tidak soal usia Saudara, apakah Saudara bisa ikut mendukung kesaksian dengan rak beroda?"]]},"r67":{"j":"p","jd":"Menguatkan dan Positif","sub":"th pelajaran 16","isi":[["p","PELAJARAN 16"],["h","Ayub 16:5"],["p","YANG PERLU DILAKUKAN: Berfokuslah pada cara menyelesaikan masalah, bukan pada masalahnya. Pikirkan caranya menguatkan pendengar Saudara."],["h","CARA MELAKUKANNYA:"],["p","Miliki pandangan yang positif tentang pendengar Saudara. Yakinlah bahwa rekan seiman Saudara mau menyenangkan Yehuwa. Bahkan kalau Saudara perlu memberikan nasihat, berikan pujian yang tulus terlebih dulu kalau itu cocok."],["p","Sampaikan bahan Saudara karena Saudara mengasihi mereka, bukan karena kesal kepada mereka. Tersenyumlah dengan hangat supaya mereka tahu bahwa Saudara peduli kepada mereka."],["p","Jangan terlalu banyak membahas hal negatif. Bahas hal negatif hanya kalau benar-benar diperlukan. Secara keseluruhan, apa yang Saudara sampaikan hendaknya positif."],["p","Gunakan Firman Allah dengan sebaik-baiknya. Bahaslah tentang apa yang Yehuwa lakukan bagi manusia dulu, sekarang, dan di masa depan. Berbicaralah untuk menguatkan pendengar Saudara."],["h","DALAM PELAYANAN"],["p","Pandanglah setiap orang sebagai calon rekan seiman Saudara."]]},"r68":{"j":"a","jd":"Amsal","sub":"Amsal 20:18","isi":[[18,"Rencana-rencana akan berhasil kalau dibicarakan dulu, + Dan ikutilah petunjuk yang bijaksana sewaktu berperang. "]]},"r69":{"j":"a","jd":"Surat untuk Sidang Jemaat di Filipi","sub":"Surat untuk Sidang Jemaat di Filipi 2:4","isi":[[4,"dan perhatikanlah kepentingan orang lain, bukan kepentingan diri sendiri saja. "]]},"r70":{"j":"p","jd":"Tetap Bersukacita Sewaktu Merawat Orang Lain","sub":"Tetap Bersukacita Sewaktu Merawat Orang Lain","isi":[["p","ARTIKEL PELAJARAN 45"],["p","NYANYIAN 111 Alasan Sukacita Kita"],["p","”Orang yang menabur benih sambil menangis akan menuai sambil bersorak gembira.” — MZ. 126:5 ."],["p","INTI"],["p","Kesulitan yang dihadapi orang-orang yang merawat orang lain dan caranya mereka bisa tetap bersukacita."],["p","1-2. Bagaimana Yehuwa memandang mereka yang sedang merawat orang-orang yang mereka sayangi? ( Amsal 19:17 ; lihat juga gambar.)"],["p","”KAMI sudah menikah lebih dari 32 tahun,” kata seorang saudara dari Korea bernama Jin-yeol. ”Selama lima tahun ini, saya harus merawat istri saya karena dia terkena penyakit Parkinson dan sulit bergerak. Kami punya ranjang rumah sakit di rumah, dan dia tidur di sana. Tiap malam, saya tidur di sampingnya sambil pegang tangannya. Saya sangat sayang sama istri saya, dan saya senang bisa merawat dia.”"],["p","2 Apakah Saudara sedang merawat orang yang Saudara sayangi, misalnya orang tua, teman hidup, anak, atau sahabat Saudara? Kalau iya, Saudara pasti senang melakukannya karena Saudara menyayangi dia. Dan dengan melakukan hal itu, Saudara menunjukkan bahwa Saudara mengabdi kepada Yehuwa. ( 1 Tim. 5:​4, 8; Yak. 1:27 ) Tapi, merawat seseorang itu tidak selalu mudah. Sering kali, Saudara menghadapi kesulitan yang tidak diketahui orang lain. Bahkan, Saudara mungkin merasa tidak ada yang mengerti kesulitan Saudara. Sewaktu bersama orang lain, Saudara mungkin tersenyum. Tapi sewaktu sendirian, Saudara tidak bisa menahan air mata Saudara. ( Mz. 6:6 ) Kalau itu yang Saudara rasakan, ingatlah: Meskipun orang lain tidak selalu tahu kesulitan Saudara, Yehuwa selalu tahu. (Bandingkan Keluaran 3:7 .) Air mata dan pengorbanan Saudara berharga bagi Dia. ( Mz. 56:8; 126:5 ) Dia memperhatikan semua hal yang Saudara lakukan untuk merawat orang yang Saudara sayangi. Malah, Dia menganggap diri-Nya berutang kepada Saudara, dan Dia berjanji untuk membayarnya.— Baca Amsal 19:17 ."],["p","Apakah Saudara sedang merawat orang yang Saudara sayangi? (Lihat paragraf 2)"],["p","3. Kesulitan apa saja yang mungkin Abraham dan Sara hadapi sewaktu merawat Terah?"],["p","3 Di Alkitab, ada banyak kisah hamba Yehuwa yang merawat orang lain, misalnya Abraham dan Sara. Sewaktu mereka pindah dari Ur ke Haran, ayah Abraham, Terah, ikut bersama mereka, padahal umurnya sudah sekitar 200 tahun. Mereka harus menempuh perjalanan berminggu-minggu. ( Kej. 11:​31, 32 ) Meskipun Abraham dan Sara menyayangi Terah, pasti tidak mudah bagi mereka untuk merawat dia, terutama selama perjalanan. Mereka mungkin harus menunggangi unta atau keledai, dan itu pasti sangat sulit buat Terah yang sudah tua. Jadi, wajar saja kalau kadang Abraham dan Sara merasa sangat kelelahan. Meski begitu, Yehuwa memberi mereka kekuatan yang mereka butuhkan. Begitu juga, Dia akan mendukung dan menguatkan Saudara.— Mz. 55:22 ."],["p","4. Apa yang akan kita bahas di artikel ini?"],["p","4 Sukacita bisa membantu seseorang bertekun sewaktu merawat orang lain. ( Ams. 15:13 ) Mengapa? Karena orang yang bersukacita bisa tetap bahagia meskipun keadaannya sulit. ( Yak. 1:​2, 3 ) Salah satu cara Saudara bisa bersukacita adalah dengan berdoa meminta bantuan Yehuwa untuk tetap bersikap positif. Tapi, ada cara-cara lain yang bisa membantu Saudara tetap bersukacita. Kita akan membahasnya di artikel ini. Kita juga akan membahas bagaimana orang lain bisa membantu Saudara. Tapi pertama-tama, mari kita bahas mengapa Saudara perlu tetap bersukacita dan apa saja yang bisa membuat Saudara tidak bersukacita."],["h","YANG BISA MEMBUAT SAUDARA TIDAK BERSUKACITA"],["p","5. Mengapa mereka yang merawat orang lain perlu tetap bersukacita?"],["p","5 Kalau Saudara tidak lagi bersukacita sewaktu merawat orang lain, Saudara bisa dengan mudah menjadi lelah. ( Ams. 24:10 ) Dan sewaktu Saudara lelah, Saudara mungkin jadi kurang ramah dan kurang memperhatikan kebutuhannya. Nah, apa saja yang bisa membuat Saudara tidak lagi bersukacita?"],["p","6. Mengapa mereka yang merawat orang lain mungkin merasa terlalu capek?"],["p","6 Terlalu capek. Seorang saudari bernama Leah berkata, ”Meskipun satu hari berjalan dengan lancar, saya tetap saja capek setelah merawat orang seharian. Kadang, saya bahkan tidak punya tenaga lagi untuk membalas pesan.” Yang lain tidak punya cukup waktu untuk tidur atau istirahat. Seorang saudari bernama Inés berkata, ”Saya sering kurang tidur. Di malam hari, saya sering kali harus bangun setiap dua jam untuk mengurus mama mertua saya. Saya dan suami juga sudah lama tidak pergi liburan.” Beberapa orang bahkan harus menolak tugas-tugas dari organisasi dan tidak bisa bergaul bersama teman mereka karena harus merawat orang yang mereka sayangi seharian. Akibatnya, mereka mungkin merasa kesepian dan merasa terjebak dengan keadaan mereka."],["p","7. Mengapa mereka yang merawat orang lain mungkin merasa bersalah atau sedih?"],["p","7 Merasa bersalah atau sedih. Seorang saudari bernama Jessica berkata, ”Saya sering merasa bahwa apa yang saya lakukan untuk Papa belum cukup. Dan kalau saya pakai waktu untuk diri sendiri, saya jadi merasa egois dan merasa bersalah.” Yang lain juga merasa bersalah karena mereka kesal dengan keadaan mereka atau karena sewaktu mereka stres, mereka mengatakan hal-hal yang menyakitkan kepada orang yang mereka rawat. ( Yak. 3:2 ) Selain itu, ada yang merasa sedih sewaktu melihat orang yang mereka rawat tidak lagi bersemangat dan sehat seperti dulu. Seorang saudari bernama Barbara mengatakan, ”Sedih sekali rasanya waktu melihat sahabat yang saya sayangi makin hari makin lemah.”"],["p","8. Kalau orang yang dirawat menunjukkan penghargaan, apa pengaruhnya? Berikan contoh."],["p","8 Merasa tidak dihargai. Beberapa merasa seperti itu karena orang yang mereka rawat jarang memuji mereka atau berterima kasih atas kerja keras dan pengorbanan mereka. Kata-kata yang menunjukkan penghargaan, meskipun singkat, bisa punya pengaruh yang besar. ( 1 Tes. 5:18 ) Saudari Melissa, yang bekerja sebagai perawat, berkata, ”Saya kadang nangis karena sangat capek dan stres. Tapi waktu orang yang saya rawat bilang, ’Makasih ya bantuannya,’ saya jadi semangat lagi. Besoknya, saya jadi lebih siap dan semangat untuk merawat mereka.” Saudara Ahmadu dan istrinya merawat keponakan mereka yang menderita penyakit epilepsi. Dia menceritakan bagaimana perasaannya sewaktu keponakannya berterima kasih kepada mereka. Ahmadu mengatakan, ”Dia mungkin tidak benar-benar mengerti seberapa besar pengorbanan kami untuk merawat dia. Tapi, saya sangat senang dan tersentuh waktu dia menunjukkan rasa terima kasihnya atau waktu dia berupaya menulis, ’Aku sayang kalian.’”"],["h","CARANYA UNTUK TETAP BERSUKACITA"],["p","9. Bagaimana mereka yang merawat orang lain bisa bersikap sadar diri?"],["p","9 Berupayalah untuk sadar diri. ( Ams. 11:2 ) Kita tidak selalu bisa melakukan semua yang kita inginkan karena waktu dan tenaga kita terbatas. Jadi, tentukan apa yang bisa dan tidak bisa Saudara lakukan. Dan, Saudara tidak perlu merasa bersalah kalau Saudara kadang harus menolak untuk melakukan sesuatu. Itu tandanya Saudara sadar diri. Dan kalau ada yang menawarkan bantuan, terima dan hargai bantuannya. Seorang saudara bernama Jay mengatakan, ”Kita tidak bisa melakukan semuanya dalam sehari. Kalau kita menyadari hal itu dan tidak memaksa diri, kita bisa tetap bersukacita.”"],["p","10. Mengapa mereka yang merawat orang lain perlu punya pengertian? ( Amsal 19:11 )"],["p","10 Milikilah pengertian. (Baca Amsal 19:11 .) Orang yang punya pengertian berupaya memahami alasan di balik tindakan tertentu. Jadi kalau Saudara punya pengertian, Saudara bisa tetap tenang sewaktu diperlakukan dengan tidak baik. Nah, seseorang yang menderita penyakit tertentu bisa melakukan hal-hal yang tidak masuk akal, misalnya orang yang tadinya baik dan sabar mungkin jadi suka bertengkar, sering menuntut, kritis, atau sulit disenangkan. ( Pkh. 7:​7 , catatan kaki) Jadi kalau Saudara sedang merawat orang yang menderita penyakit yang parah, cobalah cari tahu tentang penyakitnya. Semakin Saudara memahami penyakitnya, Saudara akan semakin mengerti bahwa sifatnya menjadi kurang baik karena penyakitnya, bukan karena orangnya memang seperti itu.— Ams. 14:29 ."],["p","11. Apa yang setiap hari harus diutamakan oleh mereka yang merawat orang lain? ( Mazmur 132:​4, 5 )"],["p","11 Perkuat persahabatan Saudara dengan Yehuwa. Saudara kadang perlu mengurangi kegiatan Saudara supaya bisa melakukan hal-hal yang ”lebih penting”, seperti memperkuat persahabatan Saudara dengan Yehuwa. ( Flp. 1:10 ) Dulu, meskipun Raja Daud sangat sibuk, dia tetap mengutamakan ibadahnya kepada Yehuwa. (Baca Mazmur 132:​4, 5 .) Begitu juga, meskipun Saudara sangat sibuk, Saudara tetap perlu membaca Alkitab dan berdoa setiap hari. Seorang saudari bernama Elisha berkata, ”Saya bisa tetap bersukacita karena merenungkan ayat-ayat yang menghibur di buku Mazmur. Doa juga sangat membantu saya. Tiap hari, saya doa berkali-kali supaya bisa tetap tenang.”"],["p","12. Mengapa mereka yang merawat orang lain perlu menjaga kesehatan mereka sendiri?"],["p","12 Jagalah kesehatan. Karena sibuk merawat orang lain, Saudara mungkin sulit menjaga kesehatan Saudara sendiri. Saudara mungkin tidak punya banyak waktu untuk menyiapkan makanan yang sehat. Tapi ingatlah, makan makanan yang bergizi dan berolahraga dengan teratur sangat penting untuk kesehatan jasmani dan mental. Jadi, meskipun sibuk, Saudara tetap perlu mencari waktu untuk melakukannya. ( Ef. 5:​15, 16 ) Saudara juga perlu berupaya untuk cukup tidur. ( Pkh. 4:6 ) Menurut para ahli, tidur bisa membantu tubuh membuang racun dari otak. Dan menurut sebuah artikel medis, kalau kita cukup tidur, kita jadi tidak terlalu khawatir dan bisa tetap tenang sewaktu keadaannya sulit. Selain itu, Saudara perlu mencari waktu untuk melakukan hal yang Saudara sukai. ( Pkh. 8:15 ) Seorang saudari memberi tahu apa yang membantu dia bersukacita. Dia berkata, ”Waktu cuacanya bagus, saya berupaya untuk keluar dan menikmati sinar matahari. Saya juga pergi main dengan teman saya minimal sebulan sekali.”"],["p","13. Mengapa tertawa itu bagus? ( Amsal 17:22 )"],["p","13 Jangan lupa untuk tertawa. (Baca Amsal 17:22; Pkh. 3:​1, 4 ) Tertawa itu bagus untuk kesehatan jasmani dan mental Saudara. Sewaktu Saudara merawat seseorang, apa yang terjadi sering kali tidak sesuai dengan yang direncanakan. Tapi, kalau Saudara bisa mencari hal-hal lucu dari keadaan itu, Saudara mungkin jadi tidak terlalu kesal. Dan kalau Saudara tertawa bersama orang yang Saudara rawat, kalian bisa menjadi lebih akrab."],["p","14. Kalau Saudara menceritakan perasaan Saudara kepada seorang sahabat, apa manfaatnya?"],["p","14 Ceritakan perasaan Saudara kepada teman yang Saudara percayai. Meskipun Saudara sudah berupaya untuk bersukacita, akan ada saatnya Saudara merasa kewalahan. Saat itu terjadi, ceritakanlah perasaan Saudara kepada seorang sahabat yang tidak akan menghakimi Saudara atau bereaksi berlebihan. ( Ams. 17:17 ) Dia akan mendengarkan dan menguatkan Saudara, dan mungkin itulah yang Saudara butuhkan untuk tetap bersukacita.— Ams. 12:25 ."],["p","15. Kalau Saudara sering membicarakan tentang Firdaus, apa manfaatnya?"],["p","15 Bayangkan kehidupan di Firdaus. Ingatlah, pekerjaan untuk merawat orang lain itu hanya sementara, dan memang Yehuwa tidak menciptakan kita untuk melakukannya. ( 2 Kor. 4:​16-18 ) Kehidupan kita sekarang bukanlah ”kehidupan yang sebenarnya”. ( 1 Tim. 6:19 ) Jadi, cobalah mengobrol dengan orang yang Saudara rawat tentang hal-hal yang bisa kalian lakukan bersama di Firdaus. Dengan begitu, kalian bisa lebih bersukacita. ( Yes. 33:24; 65:21 ) Seorang saudari bernama Heather berkata, ”Waktu bicara dengan orang-orang yang saya rawat, saya sering bilang, ’Sebentar lagi kita bisa sama-sama naik sepeda, jahit baju, dan lari. Kita juga bisa memanggang roti dan memasak untuk keluarga dan sahabat kita yang dibangkitkan.’ Setelah membicarakan hal itu, kami bersyukur kepada Yehuwa karena punya harapan ini.”"],["h","CARA MEMBANTU MEREKA YANG MERAWAT ORANG LAIN"],["p","16. Bagaimana kita bisa membantu saudara-saudari di sidang yang sedang merawat orang lain? (Lihat juga gambar.)"],["p","16 Bantu mereka supaya bisa istirahat. Kita bisa menawarkan bantuan untuk mengurus orang yang dirawat. Dengan begitu, orang yang merawatnya bisa istirahat dan punya waktu untuk mengurus kebutuhannya sendiri. ( Gal. 6:2 ) Beberapa penyiar mengatur jadwal setiap minggu untuk membantu mereka yang merawat orang lain. Saudari Natalya, yang harus mengurus suaminya yang lumpuh, berkata, ”Seorang saudara di sidang menemani suami saya sekali atau dua kali seminggu. Mereka berdinas, mengobrol, dan bahkan menonton film bersama. Suami saya sangat senang. Saya juga jadi punya waktu untuk istirahat dan melakukan hal-hal yang saya sukai, seperti jalan-jalan sebentar di luar.” Kalau cocok, Saudara bahkan bisa menawarkan diri untuk menginap dan menjaga orang yang dirawat supaya orang yang merawatnya bisa tidur nyenyak."],["p","Bagaimana Saudara bisa membantu rekan seiman di sidang yang sedang merawat orang lain? (Lihat paragraf 16) a"],["p","17. Apa yang bisa kita lakukan supaya mereka yang merawat orang lain bisa menikmati perhimpunan?"],["p","17 Bantu mereka supaya bisa menikmati perhimpunan. Mereka yang merawat orang lain mungkin tidak bisa benar-benar menikmati perhimpunan, pertemuan wilayah, dan pertemuan regional. Jadi untuk membantu mereka, Saudara bisa menawarkan diri untuk duduk menemani orang yang dirawat selama beberapa waktu atau bahkan sepanjang acara itu. Kalau orang yang dirawat tidak bisa keluar rumah, Saudara bisa menemani dia berhimpun secara online supaya orang yang merawatnya bisa berhimpun secara fisik."],["p","18. Apa lagi yang bisa kita lakukan untuk membantu mereka yang merawat orang lain?"],["p","18 Puji dan doakan mereka. Para penatua perlu mengadakan kunjungan penggembalaan secara rutin kepada mereka yang sedang merawat orang lain. ( Ams. 27:23 ) Tapi selain para penatua, kita semua juga perlu terus memuji dan menguatkan mereka. Kita juga bisa berdoa meminta Yehuwa untuk terus menguatkan mereka dan membantu mereka tetap bersukacita.— 2 Kor. 1:11 ."],["p","19. Masa depan seperti apa yang kita nantikan?"],["p","19 Sebentar lagi, Yehuwa akan menghapus semua air mata penderitaan. Penyakit dan kematian tidak akan ada lagi. ( Why. 21:​3, 4 ) ”Orang lumpuh akan melompat seperti rusa.” ( Yes. 35:​5, 6 ) Tidak akan ada lagi orang yang mengalami kesulitan karena usia tua atau karena merawat yang sakit. ”Hal-hal [itu] tidak akan diingat lagi.” ( Yes. 65:17 ) Sambil menunggu Yehuwa menepati janji-Nya yang luar biasa itu, yakinlah Dia tidak akan meninggalkan kita. Kalau kita terus mengandalkan-Nya, Dia akan memberi kita kekuatan untuk ”bertekun menghadapi segala sesuatu dengan sabar dan sukacita”.— Kol. 1:11 ."],["h","APA JAWABAN SAUDARA?"],["p","Apa yang bisa membuat seseorang tidak bersukacita sewaktu merawat orang lain?"],["p","Bagaimana seseorang bisa tetap bersukacita sewaktu merawat orang lain?"],["p","Bagaimana Saudara bisa membantu mereka yang merawat orang lain?"],["p","NYANYIAN 155 Sukacita Kami Selamanya"],["p","a PENJELASAN GAMBAR: Dua saudari muda menemani seorang saudari lansia supaya saudari yang merawatnya bisa punya waktu untuk jalan-jalan sebentar."]]},"r71":{"j":"p","jd":"Dia Berani Tapi Juga Berhati-hati","sub":"wcg bab 18","isi":[["p","18 GIDEON"],["p","ORANG yang berani juga perlu berhati-hati. Kalau tidak, dia bukan orang yang berani, tapi nekat. Nah, Gideon tidak hanya berani, tapi dia juga berhati-hati. Di zamannya, Israel lagi-lagi sudah meninggalkan Yehuwa. Jadi, Yehuwa membiarkan orang Midian menguasai negeri itu, menindas umat Allah, dan merusak hasil tanah mereka. Meski begitu, Gideon dengan berani menyediakan makanan untuk orang-orang sebangsanya. Dia melakukannya dengan hati-hati. Supaya tidak terlihat orang Midian, dia memukul-mukul gandum di tempat pemerasan anggur, yang bentuknya mungkin seperti bak besar yang terbuat dari batu."],["p","Akhirnya, orang Israel bertobat dan memohon pertolongan Yehuwa. Dia pun mengutus seorang nabi untuk mengingatkan mereka kenapa Dia meninggalkan mereka. Lalu, melalui seorang malaikat, Yehuwa menugasi Gideon untuk menyelamatkan umat-Nya. Tapi, Gideon meminta sebuah tanda. Jadi, malaikat itu secara mukjizat membuat api menyambar makanan yang Gideon hidangkan. Lalu, malaikat itu lenyap dari pandangannya. Malamnya, Yehuwa memerintahkan Gideon untuk merobohkan sebuah mezbah Baal dan sebuah tiang suci, membangun mezbah untuk Yehuwa, dan mempersembahkan korban bagi-Nya. Gideon pun menaatinya. Tapi, dia melakukannya pada malam hari karena takut kepada ayahnya dan penduduk kota itu."],["p","Tidak lama setelah Gideon dengan berani melakukan itu semua, orang Midian membentuk pasukan besar bersama orang Amalek dan orang-orang dari Timur. Lalu, mereka datang ke Lembah Yizreel untuk melawan bangsa Israel. Seperti kawanan belalang yang jumlahnya sangat besar, mereka menutupi lembah itu. Dengan bimbingan kuasa kudus, Gideon pun mengirim para utusan untuk mengumpulkan pasukan dari beberapa suku Israel. Tapi karena berhati-hati, Gideon meminta dua mukjizat dari Yehuwa sebagai tanda bahwa Yehuwa memang mendukungnya. Yehuwa pun dengan sabar memenuhi permintaannya. Malam itu, Yehuwa membuat bulu domba yang Gideon taruh di tempat pengirikan dibasahi embun, sedangkan tanah di sekitarnya tetap kering. Malam berikutnya, Yehuwa membuat bulu domba itu tetap kering, sedangkan tanah di sekitarnya dibasahi embun."],["p","Meski pasukan Gideon sudah kalah jumlah, Yehuwa masih meminta Gideon mengurangi pasukannya lagi"],["p","Setelah diyakinkan oleh Yehuwa, Gideon pun memimpin pasukannya yang hanya berjumlah 32.000 orang untuk menghadapi pasukan musuh, yang jumlahnya sekitar 135.000 orang. Tapi, waktu pasukan Gideon berkemah di dekat Mata Air Harod, Yehuwa memberi tahu dia bahwa pasukannya terlalu besar! Gideon pun harus memulangkan semua prajuritnya yang merasa takut sehingga sisanya hanya 10.000 orang. Tapi bagi Yehuwa, itu masih terlalu banyak. Dia meminta Gideon mengamati pasukannya waktu mereka minum di sungai. Banyak dari mereka berlutut dan minum langsung dari sungai sehingga mereka harus dipulangkan. Tapi, sisanya hanya membungkuk sedikit dan minum dari tangan mereka sambil melihat sekeliling dengan waspada. Merekalah yang dipilih untuk berperang. Akhirnya, Gideon hanya punya 300 prajurit!"],["p","Gideon tetap berani, dan dia pun bersiap-siap untuk menyerang. Yehuwa meyakinkan Gideon sekali lagi. Dia menyuruh Gideon menyelinap ke perkemahan musuh di malam hari. Di sana, Gideon mendengar seorang prajurit menceritakan mimpinya yang menunjukkan bahwa Israel akan menang perang. Itu benar-benar menguatkan Gideon. Dia pun kembali dan memberikan petunjuk ini kepada pasukannya: ”Perhatikan saya, dan lakukan persis seperti yang saya lakukan.” Di tengah gelapnya malam, Gideon dan pasukannya menyebar di sekeliling perkemahan musuh. Saat Gideon memberi aba-aba, para prajuritnya meniup trompet tanduk, menghancurkan kendi besar, dan mengangkat obor. Mereka juga berteriak, ”Pedang Yehuwa dan pedang Gideon!” Strategi ini sangat cerdik. Musuh benar-benar kaget karena tiba-tiba ada cahaya, suara berisik, dan teriakan di sekeliling mereka. Mereka panik karena berpikir bahwa mereka sudah terkepung dan sedang diserang. Yehuwa pun membuat mereka saling menyerang. Hanya ada sekitar 15.000 prajurit musuh yang selamat dan melarikan diri."],["p","Gideon mengejar mereka. Akhirnya, dia mengalahkan pasukan musuh itu dan membunuh pemimpin mereka. Dia juga menghukum orang Israel yang tidak mau mendukung dia berperang demi Yehuwa. Setelah kemenangan itu, orang-orang mau menjadikan Gideon raja mereka. Tapi, dia bersikap sadar diri dan berkata, ”Yehuwa yang akan memimpin kalian.” Pria yang berani dan berhati-hati itu diberkati Allah. Selama dia menjadi hakim Israel, tidak ada perang di negeri itu. Dia juga hidup sampai usia yang sangat lanjut. Belakangan, nama Gideon bahkan dicatat oleh Rasul Paulus sebagai salah satu orang yang sangat beriman.— Ibr. 11:32 ."],["h","Baca kisahnya di:"],["p","Hakim 6:1–7:22; 8:​4-23, 28"],["h","Untuk dibahas:"],["p","Bagaimana Gideon bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Kenapa ”roti barli bundar” dalam mimpi seorang prajurit Midian cocok menggambarkan pasukan Gideon? ( Hak. 7:13 ; it ”Barli” ¶7 )"],["p","2. Kenapa bunyi 300 trompet tanduk membuat orang Midian panik dan ketakutan? ( it ”Tanduk” ¶3 ) Gambar A"],["p","Gambar A : Tanduk domba jantan digunakan sebagai trompet untuk memberi tanda"],["p","3. Apa yang harus dilakukan Gideon dan pasukannya untuk mengalahkan orang Midian? ( w04 15/10 16 ¶9-10 ) Gambar B"],["p","Gambar B : Gideon mengejar orang Midian sejauh kira-kira 80 kilometer sampai ke Yogbeha (jalur pastinya tidak diketahui)"],["p","4. Perincian apa saja yang meneguhkan bahwa kisah Alkitab ini akurat? ( w05 15/4 32 )"],["h","Pikirkan Pelajarannya"],["p","Gideon memimpin umat Allah untuk memenangkan pertempuran. Tapi waktu ada yang tersinggung dengannya, dia tetap rendah hati dan berbicara baik-baik demi menjaga perdamaian. ( Hak. 8:​1-3 ) Bagaimana kepala keluarga dan penatua bisa meniru teladan Gideon waktu ada yang kesal dengan keputusan mereka?"],["p","Dalam situasi apa saja kita perlu berani tapi juga berhati-hati? Gambar C"],["p","Gambar C"],["p","Bagaimana Saudara bisa meniru keberanian Gideon dalam kehidupan Saudara?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Gideon setelah dia dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Kalau Saudara mendapat tugas tambahan di organisasi Yehuwa, bagaimana Saudara bisa meniru Gideon?"],["p","”Hikmat Ada pada Orang-Orang yang Bersahaja” ( w00 1/8 16-18 ¶11-15)"],["p","Gunakan komik Alkitab ini untuk membantu anak Saudara percaya bahwa Allah akan mendukung mereka."],["p","”Yehuwa Buat Gideon Berani” ( ijwis artikel 13)"]]},"r72":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 1:16-18","isi":[[16,"Roda-roda itu seluruhnya tampak berkilau seperti batu krisolit. Keempatnya kelihatan sama. Bentuk dan rupanya seperti dua roda yang dipasang bersilang. "],[17,"Sewaktu bergerak, mereka bisa pergi ke arah mana pun tanpa perlu berbelok."],[18,"Roda-roda itu begitu tinggi sehingga tampak menakjubkan. Pinggiran keempat roda itu penuh dengan mata. "]]},"r73":{"j":"p","jd":"”Saya Mulai Mendapat Penglihatan dari Allah”","sub":"rr 37 ¶18-19","isi":[["p","1-3. (a) Ceritakan apa yang Yehezkiel lihat dan dengar. (Lihat gambar di awal bab.) (b) Kekuatan apa yang dirasakan Yehezkiel, dan apa pengaruhnya atas dia?"],["p","YEHEZKIEL memandang jauh ke depan, dan dia melihat sesuatu bergerak menghampirinya di gurun pasir yang luas. Matanya pun terbelalak. Tampaklah suatu badai di kejauhan. Badai ini tidak seperti biasanya. Angin kencang dari utara menerpa rambut dan pakaian Yehezkiel, lalu sebuah awan yang sangat tebal mendekat ke arahnya dengan cepat. Awan itu menyala karena ada kilatan api di dalamnya, dan warnanya seperti campuran emas dan perak. Lalu, terdengarlah gemuruh yang semakin keras bagaikan derap langkah pasukan yang besar.​— Yeh. 1:4, 24 ."],["p","2 Ini adalah penglihatan pertama dari serangkaian penglihatan tak terlupakan yang diterima Yehezkiel. Waktu itu, dia masih berumur sekitar 30 tahun. Dia ”merasakan kekuatan Yehuwa”, yaitu kuasa kudus Yehuwa yang luar biasa. Kuasa itu membuat dia melihat dan mendengar hal-hal spektakuler, yang jauh lebih hebat daripada film tercanggih yang dihasilkan teknologi manusia. Setelah mendapat penglihatan ini, dia pun sujud karena begitu takjub.​— Yeh. 1:3, 28 ."]]},"r74":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 1:20","isi":[[20,"Mereka pergi ke mana pun kuasa kudus menggerakkan mereka. Kalau mereka terangkat, roda-roda itu ikut terangkat bersama mereka, karena kuasa kudus yang menggerakkan makhluk-makhluk hidup itu juga ada dalam roda-roda itu."]]},"r75":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 1:26","isi":[[26,"Di atas lantai yang ada di atas kepala mereka itu ada sesuatu seperti batu safir, dan bentuknya seperti takhta. Di atas sana, ada seseorang yang tampak seperti manusia duduk di takhta itu. "]]},"r76":{"j":"p","jd":"”Saya Mulai Mendapat Penglihatan dari Allah”","sub":"rr 38-39 ¶21-24","isi":[["p","1-3. (a) Ceritakan apa yang Yehezkiel lihat dan dengar. (Lihat gambar di awal bab.) (b) Kekuatan apa yang dirasakan Yehezkiel, dan apa pengaruhnya atas dia?"],["p","YEHEZKIEL memandang jauh ke depan, dan dia melihat sesuatu bergerak menghampirinya di gurun pasir yang luas. Matanya pun terbelalak. Tampaklah suatu badai di kejauhan. Badai ini tidak seperti biasanya. Angin kencang dari utara menerpa rambut dan pakaian Yehezkiel, lalu sebuah awan yang sangat tebal mendekat ke arahnya dengan cepat. Awan itu menyala karena ada kilatan api di dalamnya, dan warnanya seperti campuran emas dan perak. Lalu, terdengarlah gemuruh yang semakin keras bagaikan derap langkah pasukan yang besar.​— Yeh. 1:4, 24 ."],["p","2 Ini adalah penglihatan pertama dari serangkaian penglihatan tak terlupakan yang diterima Yehezkiel. Waktu itu, dia masih berumur sekitar 30 tahun. Dia ”merasakan kekuatan Yehuwa”, yaitu kuasa kudus Yehuwa yang luar biasa. Kuasa itu membuat dia melihat dan mendengar hal-hal spektakuler, yang jauh lebih hebat daripada film tercanggih yang dihasilkan teknologi manusia. Setelah mendapat penglihatan ini, dia pun sujud karena begitu takjub.​— Yeh. 1:3, 28 ."]]},"r77":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 1:6","isi":[[6,"Masing-masing punya empat muka dan empat sayap. "]]},"r78":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 1:10","isi":[[10,"Begini rupa muka mereka: Masing-masing punya muka manusia. Di sisi kanannya ada muka singa dan di sisi kirinya ada muka sapi jantan. Masing-masing juga punya muka elang. "]]},"r79":{"j":"p","jd":"Apa Artinya ”Makhluk Hidup yang Punya Empat Muka”?","sub":"rr 43 ¶5;","isi":[["p","1, 2. Mengapa Yehuwa kadang memberikan penglihatan untuk mengajar hamba-Nya di bumi?"],["p","BAYANGKAN sebuah keluarga sedang duduk di meja makan untuk belajar Alkitab. Agar anak-anaknya yang masih kecil mengerti ajaran Alkitab, sang ayah menunjukkan gambar-gambar sederhana. Senyuman anak-anak itu dan tanggapan mereka yang bersemangat menunjukkan bahwa ayah mereka berhasil. Gambar-gambar itu membantu anak-anaknya mengerti kebenaran tentang Yehuwa, yang mungkin sangat sulit dipahami anak kecil."],["p","2 Seperti ayah itu, Yehuwa ingin agar manusia, yang bagaikan anak-anak-Nya, tahu tentang hal-hal yang tidak kelihatan. Jadi, Dia memberi mereka penglihatan. Misalnya, untuk mengajarkan kebenaran yang mendalam tentang diri-Nya, Dia memberi Yehezkiel penglihatan yang menakjubkan. Kita sudah membahas salah satunya di Bab 3. Sekarang, mari kita bahas satu bagian dari penglihatan yang luar biasa itu. Dengan memahami artinya, kita bisa semakin dekat dengan Yehuwa."]]},"r80":{"j":"p","jd":"Apa Artinya ”Makhluk Hidup yang Punya Empat Muka”?","sub":"45 ¶13;","isi":[["p","1, 2. Mengapa Yehuwa kadang memberikan penglihatan untuk mengajar hamba-Nya di bumi?"],["p","BAYANGKAN sebuah keluarga sedang duduk di meja makan untuk belajar Alkitab. Agar anak-anaknya yang masih kecil mengerti ajaran Alkitab, sang ayah menunjukkan gambar-gambar sederhana. Senyuman anak-anak itu dan tanggapan mereka yang bersemangat menunjukkan bahwa ayah mereka berhasil. Gambar-gambar itu membantu anak-anaknya mengerti kebenaran tentang Yehuwa, yang mungkin sangat sulit dipahami anak kecil."],["p","2 Seperti ayah itu, Yehuwa ingin agar manusia, yang bagaikan anak-anak-Nya, tahu tentang hal-hal yang tidak kelihatan. Jadi, Dia memberi mereka penglihatan. Misalnya, untuk mengajarkan kebenaran yang mendalam tentang diri-Nya, Dia memberi Yehezkiel penglihatan yang menakjubkan. Kita sudah membahas salah satunya di Bab 3. Sekarang, mari kita bahas satu bagian dari penglihatan yang luar biasa itu. Dengan memahami artinya, kita bisa semakin dekat dengan Yehuwa."]]},"r81":{"j":"p","jd":"Apa Artinya ”Makhluk Hidup yang Punya Empat Muka”?","sub":"48 ¶14","isi":[["p","1, 2. Mengapa Yehuwa kadang memberikan penglihatan untuk mengajar hamba-Nya di bumi?"],["p","BAYANGKAN sebuah keluarga sedang duduk di meja makan untuk belajar Alkitab. Agar anak-anaknya yang masih kecil mengerti ajaran Alkitab, sang ayah menunjukkan gambar-gambar sederhana. Senyuman anak-anak itu dan tanggapan mereka yang bersemangat menunjukkan bahwa ayah mereka berhasil. Gambar-gambar itu membantu anak-anaknya mengerti kebenaran tentang Yehuwa, yang mungkin sangat sulit dipahami anak kecil."],["p","2 Seperti ayah itu, Yehuwa ingin agar manusia, yang bagaikan anak-anak-Nya, tahu tentang hal-hal yang tidak kelihatan. Jadi, Dia memberi mereka penglihatan. Misalnya, untuk mengajarkan kebenaran yang mendalam tentang diri-Nya, Dia memberi Yehezkiel penglihatan yang menakjubkan. Kita sudah membahas salah satunya di Bab 3. Sekarang, mari kita bahas satu bagian dari penglihatan yang luar biasa itu. Dengan memahami artinya, kita bisa semakin dekat dengan Yehuwa."]]},"r82":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 2:1-10","isi":[[1,"2 Lalu Dia berkata kepada saya, ”Putra manusia, berdirilah supaya Aku bisa bicara denganmu.” "],[2,"Saat Dia berbicara kepada saya, kuasa kudus masuk ke dalam diri saya dan membuat saya berdiri, supaya saya bisa mendengar Dia yang berbicara kepada saya itu."],[3,"Selanjutnya Dia berkata, ”Putra manusia, Aku mengutusmu kepada orang Israel, kepada bangsa-bangsa pemberontak yang memberontak terhadap-Ku. Mereka dan leluhur mereka melanggar hukum-Ku sampai hari ini. "],[4,"Aku mengutusmu kepada keturunan yang kurang ajar dan keras kepala. Beri tahu mereka, ’Inilah yang dikatakan Tuan Yang Mahatinggi Yehuwa.’"],[5,"Tidak soal bangsa itu mau mendengarkan, atau tidak mau mendengarkan karena mereka bangsa pemberontak, mereka pasti akan tahu bahwa ada seorang nabi di tengah-tengah mereka. "],[6,"”Tapi kamu, putra manusia, jangan takut kepada mereka. Jangan takut pada kata-kata mereka, meskipun kamu dikelilingi semak berduri dan tinggal di antara kalajengking. Jangan takut pada kata-kata mereka, dan jangan gentar melihat muka mereka, karena mereka adalah bangsa pemberontak."],[7,"Kamu harus menyampaikan kata-kata-Ku kepada mereka tidak soal didengarkan atau tidak, karena mereka itu pemberontak. "],[8,"”Tapi kamu, putra manusia, dengarlah apa yang Kukatakan kepadamu. Jangan memberontak seperti bangsa pemberontak itu. Buka mulutmu dan makanlah apa yang akan Kuberikan kepadamu.” "],[9,"Lalu saya melihat ada tangan yang terulur kepada saya, dan di tangan itu ada sebuah gulungan. +"],[10,"Dia membuka gulungan itu di depan saya. Pada sisi depan dan belakang gulungan itu tertulis lagu perkabungan, juga kesedihan dan tangisan. "]]},"r83":{"j":"p","jd":"Berbicara dengan Wajar","sub":"th pelajaran 2","isi":[["p","PELAJARAN 2"],["h","2 Korintus 2:17"],["p","YANG PERLU DILAKUKAN: Berbicaralah dengan wajar dan tulus, supaya pendengar tahu bahwa Saudara peduli kepada mereka dan bahwa Saudara yakin berita Saudara itu penting."],["h","CARA MELAKUKANNYA:"],["p","Buat persiapan dengan sungguh-sungguh dan berdoalah. Berdoalah agar Saudara tidak terlalu memikirkan perasaan gugup Saudara tapi berfokus pada berita Saudara. Saudara harus tahu gagasan-gagasan utama yang ingin Saudara sampaikan. Ungkapkan gagasan itu dengan kata-kata sendiri. Jangan hanya membaca kata per kata dari apa yang tertulis."],["p","Kalau Saudara membaca dari Alkitab atau publikasi lain, pastikan Saudara benar-benar paham isinya supaya Saudara bisa membacanya dengan lancar. Kalau Saudara mengutip kata-kata seseorang, bacalah dengan perasaan, tapi jangan berlebihan."],["p","Berbicaralah dengan tulus. Pikirkan mengapa pendengar Saudara perlu mendengarkan berita Saudara. Tunjukkan ketulusan dan keramahan lewat ekspresi wajah, gerakan, dan cara berdiri Saudara."],["p","Berbicara dengan wajar bukan berarti berbicara dengan terlalu santai. Supaya apa yang Saudara sampaikan tetap bermartabat, ucapkan kata-kata dengan jelas dan gunakan tata bahasa yang benar."],["p","Lihatlah pendengar Saudara. Lihat mata pendengar Saudara. Sewaktu berkhotbah, lihat hadirin secara perorangan. Jangan hanya melihat seluruh hadirin secara sambil lalu."]]},"r84":{"j":"p","jd":"Sederhana","sub":"lmd pelajaran 11 nomor 5","isi":[["p","Mat. 6:​25-27"],["p","PELAJARAN 11"],["p","Prinsip: ”Kalau kata-kata kalian tidak mudah dimengerti, bagaimana orang akan tahu apa yang kalian bicarakan?”— 1 Kor. 14:9 ."]]},"r85":{"j":"p","jd":"Kebenaran yang Senang Kita Ajarkan","sub":"lmd lampiran A nomor 22","isi":[["p","NASA , ESA and the Hubble Heritage Team ( STScI / AURA )-ESA/ Hubble Collaboration. Licensed under CC BY 4.0 . Source ."],["h","ALLAH"],["p","10. Allah punya nama.— Mz. 83:18; Yer. 10:10 ."]]},"r86":{"j":"p","jd":"Menjelaskan Ayat dengan Baik","sub":"th pelajaran 6","isi":[["p","PELAJARAN 6"],["h","Yohanes 10:33-36"],["p","YANG PERLU DILAKUKAN: Setelah membacakan sebuah ayat, jangan langsung membahas topik berikutnya. Pastikan pendengar Saudara memahami hubungan ayat itu dengan topik yang sedang dibahas."],["h","CARA MELAKUKANNYA:"],["p","Tekankan kata-kata kuncinya. Setelah membaca sebuah ayat, tunjukkan kata-kata mana yang berhubungan dengan gagasan utama. Caranya, ulangi kata-kata itu atau ajukan pertanyaan yang membuat pendengar mencari kata-kata itu."],["p","Saat mengulangi inti sebuah ayat, Saudara mungkin memakai kata-kata yang berbeda. Tapi, pastikan pendengar Saudara bisa memahami bahwa gagasan utama Saudara berhubungan dengan ayat itu."],["p","Tunjukkan intinya. Sebelum membaca sebuah ayat, Saudara mungkin memberitahukan alasan Saudara ingin membacakannya. Setelah membaca ayat itu, jelaskan bagaimana kata-kata kunci di ayat itu berhubungan dengan alasan tadi."],["p","Saat membahas ayat itu, biarkan Alkitab Saudara tetap terbuka. Dengan begitu, pendengar Saudara bisa melihat bahwa kata-kata Saudara berhubungan dengan ayat yang baru Saudara baca."],["p","Bahas ayat dengan sederhana. Jangan sampaikan perincian yang tidak berhubungan dengan gagasan utama. Pikirkan apa yang sudah dipahami pendengar Saudara tentang topik itu. Lalu, tentukan berapa banyak keterangan yang perlu Saudara berikan agar pendengar Saudara benar-benar memahaminya."]]},"r87":{"j":"p","jd":"Mereka Menepati Ikrar Meski Sulit","sub":"wcg bab 19","isi":[["p","19 YEFTA DAN ANAK PEREMPUANNYA"],["p","UNTUK kesekian kalinya, orang Israel meninggalkan Yehuwa sehingga mereka menderita. Yehuwa membiarkan orang Ammon menindas mereka selama kira-kira 18 tahun. ( Hak. 10:8 ) Akhirnya, umat Allah mengakui dosa mereka, membuang berhala mereka, dan kembali kepada Yehuwa. Tapi tidak lama setelahnya, orang Ammon berkumpul di Gilead untuk menyerang mereka."],["p","Para pemimpin Gilead meminta seorang pria bernama Yefta untuk datang dan memimpin mereka berperang. Kelihatannya, beberapa dari mereka adalah adik-adik tiri Yefta, yang pernah memperlakukan dia dengan buruk dan mengusirnya dari Gilead. Apakah Yefta menyimpan dendam atau bersikap masa bodoh? Tidak. Dia mau kembali ke Gilead untuk membantu orang-orang di sana. Pertama-tama, dia berupaya berdamai dengan raja Ammon. Yefta mengirim utusan untuk menjelaskan dengan terperinci kenapa orang Ammon tidak berhak merebut tanah yang mereka inginkan dari Israel. Dari penjelasan itu, jelas bahwa Yefta tahu banyak tentang bagaimana Yehuwa membantu umat-Nya menaklukkan Negeri Perjanjian. Tapi, raja Ammon tidak mau mendengarkan. Dia tetap mau berperang!"],["p","Yefta pun bersiap-siap untuk melawan orang Ammon. Dia berikrar kepada Yehuwa, ”Kalau Engkau menyerahkan orang Ammon ke tanganku, siapa pun yang pertama keluar dari pintu rumahku untuk menemui aku, ketika aku pulang dengan selamat dari perang melawan orang Ammon, akan menjadi milik Yehuwa. Aku akan mempersembahkan dia sebagai persembahan bakaran.” Itu pasti bukan ikrar yang dibuat dengan sembarangan atau terburu-buru, karena Alkitab mencatat bahwa sebelum dia berikrar, kuasa kudus Yehuwa turun ke atasnya."],["p","Apakah Yefta bermaksud untuk mengorbankan manusia sebagai persembahan bakaran? Tentu tidak. Itu sangat menjijikkan bagi Yehuwa, dan Dia melarang umat-Nya membakar manusia sebagai korban. ( Ul. 18:​10, 12 ) Sebaliknya, Yefta memaksudkan bahwa orang pertama yang keluar dari rumahnya akan ”menjadi milik Yehuwa”. Artinya, orang itu akan dibaktikan sepenuhnya untuk melayani Yehuwa, kemungkinan di tabernakel di Syilo. Yefta tahu bahwa ikrarnya mungkin akan sulit dipenuhi. Dia hanya punya satu anak perempuan dan tidak punya anak lain. Bisa jadi, anak itu yang akan menyambutnya waktu dia kembali."],["p","Segera setelah berikrar, Yefta maju memimpin pasukannya dengan berani. Yehuwa pun memberkati mereka dengan kemenangan besar! Mereka membantai musuh mereka lalu menaklukkan 20 kota orang Ammon."],["p","Yefta pun pulang ke rumah dengan sangat gembira. Dia mungkin berharap bahwa yang pertama keluar untuk menyambutnya adalah salah satu hambanya. Kalau itu yang dia harapkan, dia pasti sangat kecewa. Orang pertama yang keluar adalah anak perempuannya! Anak itu menyambut dia sambil memainkan rebana dan menari. Yefta pun merobek pakaiannya dan berkata, ”Aduh, anakku! Kamu membuat hatiku hancur, karena kamulah yang kusingkirkan. Aku sudah berjanji kepada Yehuwa, dan aku tidak bisa membatalkannya.”"],["p","Yefta dan anaknya harus membuat pengorbanan besar untuk menepati sebuah ikrar"],["p","Anak Yefta tahu bahwa hidupnya akan berubah total karena ikrar ayahnya. Dia akan dibaktikan sepenuhnya untuk melayani Yehuwa. Jadi, dia tidak akan bisa menikah atau punya anak. Ini sangat menyedihkan bagi seorang wanita Israel. Meski begitu, tanpa ragu gadis itu meyakinkan ayahnya, ”Kalau Ayah sudah berjanji kepada Yehuwa, lakukanlah kepadaku seperti yang Ayah janjikan.” Dia hanya meminta waktu untuk menangis bersama teman-temannya karena dia tidak akan menjadi seorang istri ataupun ibu."],["p","Benar-benar gadis yang berani, tabah, dan tidak egois! Setiap tahun, para gadis Israel pergi mengunjungi anak Yefta selama empat hari untuk memuji dan menguatkan dia. Selain itu, melayani di tabernakel pasti membawa banyak berkat. Kemungkinan, Samuel yang masih kecil juga tinggal di sana saat itu. Apakah anak Yefta ikut mendidik dan menyemangati Samuel untuk terus melayani Yehuwa? Kalau memang begitu, dia mungkin sangat senang, apalagi karena dia sendiri tidak punya anak. Memang, kita tidak tahu pasti. Yang kita tahu, saat itu ada masalah perbuatan cabul di tabernakel, dan anak Yefta tidak ikut-ikutan. ( 1 Sam. 2:22 ) Apa buktinya? Alkitab mencatat, ”[Dia] tidak pernah melakukan hubungan dengan seorang pria.”"],["p","Nama Yefta dicatat oleh Rasul Paulus di antara orang-orang yang sangat beriman. ( Ibr. 11:32 ) Baik Yefta maupun anak perempuannya menjadi teladan yang luar biasa dalam bersikap berani dan tabah. Yefta berperang demi umat Allah, dan anaknya mendukung dia sepenuhnya. Bersama-sama, mereka menepati sebuah ikrar kepada Yehuwa meski itu sulit dipenuhi!"],["h","Baca kisahnya di:"],["p","Hakim 10:​15, 16; 11:​1-40"],["h","Untuk dibahas:"],["p","Bagaimana Yefta dan anak perempuannya bersikap berani dan tabah?"],["h","Gali Lebih Dalam"],["p","1. Apa yang menunjukkan bahwa orang Ammon tidak hanya menyerang orang Israel tapi juga ibadah sejati? ( it ”Yefta” ¶6 ) Gambar A"],["p","Gambar A : ”Mereka membuang patung allah-allah lain dari antara mereka dan melayani Yehuwa.”— Hak. 10:16"],["p","2. Bagaimana sikap Yefta mirip dengan Yakub waktu berikrar kepada Yehuwa? ( it ”Yefta” ¶11 )"],["p","3. Kenapa bisa dibilang Yefta membuat pengorbanan besar untuk memenuhi ikrarnya? ( w17.04 4 ¶6 )"],["p","4. Nabi Samuel lahir sekitar tahun 1180 SM. Dari mana kita tahu bahwa dia dan anak perempuan Yefta kemungkinan melayani di tabernakel di saat yang sama? ( it ”Yefta” ¶2; lihat garis waktu ”Zaman Henokh Sampai Hakim-Hakim”. )"],["h","Pikirkan Pelajarannya"],["p","Kalau orang tua punya keberanian seperti Yefta, apa pengaruhnya terhadap anak mereka?"],["p","Bagaimana kita bisa meniru para gadis Israel yang memuji dan menguatkan anak perempuan Yefta? Gambar B"],["p","Gambar B"],["p","Dengan cara apa lagi Saudara bisa meniru Yefta dan anak perempuannya yang berani dan tabah?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Yefta dan anak perempuannya setelah mereka dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Bagaimana teladan anak Yefta bisa membantu orang Kristen yang belum menikah?"],["p","Manfaatkan Kelajangan Saudara (5:14)"],["p","Bagaimana teladan Yefta dan anaknya bisa mengajar kita untuk selalu beriman kepada Yehuwa?"],["p","”Allah Senang kepada Orang yang Beriman” ( w16.04 5-9)"]]},"r88":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 3:8","isi":[[8,"Aku telah membuatmu tegar untuk menghadapi orang-orang yang keras kepala itu. +"]]},"r89":{"j":"p","jd":"Yehuwa Membantu Kita untuk Terus Mengabar","sub":"w22.11 5 ¶10-11","isi":[["p","1. Apa yang akan kita hadapi dalam pengabaran, dan kita bisa yakin akan hal apa?"],["p","KITA tahu ada orang-orang yang akan menentang pengabaran kita, dan tentangan itu mungkin akan terus meningkat. ( Dan. 11:44; 2 Tim. 3:12; Why. 16:21 ) Tapi, kita bisa yakin bahwa Yehuwa akan membantu kita. Mengapa? Karena Yehuwa selalu membantu hamba-hamba-Nya untuk menjalankan tugas mereka, tidak soal seberapa sulit tugas itu. Contohnya, Dia membantu Nabi Yehezkiel yang ditugasi untuk mengabar kepada orang-orang Yahudi yang ditawan di Babilon. Mari kita belajar dari pengalamannya."],["p","2. Bagaimana Yehuwa menggambarkan orang-orang yang harus Yehezkiel kabari, dan apa yang akan kita bahas di artikel ini? ( Yehezkiel 2:3-6 )"]]},"r90":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 3:10","isi":[[10,"Selanjutnya Dia berkata, ”Putra manusia, dengarkan semua yang Aku katakan kepadamu dan simpan itu dalam hatimu."]]},"r91":{"j":"p","jd":"”Dia Bertukar Pikiran dengan Mereka Berdasarkan Kitab Suci”","sub":"bt 134 ¶7","isi":[["p","1, 2. Siapa yang mengadakan perjalanan dari Filipi ke Tesalonika, dan apa yang mungkin ada dalam benak mereka?"],["p","JALAN yang ramai itu, buatan para ahli teknik Romawi, melintas di pegunungan. Sesekali, berbagai suara bercampur jadi satu—ringkikan keledai, derak roda-roda kereta yang beradu dengan jalan berlapis batu, dan suara gaduh dari beragam orang, antara lain para prajurit, saudagar, dan perajin. Ketiga sekawan—Paulus, Silas, dan Timotius—sedang melintasi jalan dari Filipi ke Tesalonika yang jaraknya lebih dari 130 kilometer. Itu bukan perjalanan yang mudah, khususnya bagi Paulus dan Silas. Mereka masih merasakan sakitnya luka-luka akibat pukulan tongkat di Filipi.​— Kis. 16:22, 23 ."],["p","2 Bagaimana agar perjalanan jauh itu tidak terasa meletihkan? Percakapan pasti membantu. Masih segar dalam ingatan mereka pengalaman menggembirakan tentang penjaga penjara dan keluarganya yang menjadi orang percaya di Filipi. Pengalaman itu semakin memperkuat tekad mereka untuk terus memberitakan firman Allah. Akan tetapi, ketika sudah hampir tiba di kota pesisir Tesalonika, mereka mungkin bertanya-tanya bagaimana mereka akan diperlakukan oleh orang Yahudi di kota itu. Apakah mereka akan diserang, bahkan dipukuli, seperti di Filipi?"]]},"r92":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 3:18","isi":[[18,"Kalau Aku berkata kepada orang jahat, ’Kamu pasti mati,’ tapi kamu tidak berbicara untuk memperingatkan dia supaya berbalik dari tingkah lakunya yang jahat agar dia tetap hidup, dia akan mati karena kesalahannya karena dia jahat. Tapi Aku akan memintamu bertanggung jawab atas nyawanya. +"]]},"r93":{"j":"a","jd":"Surat Pertama untuk Timotius","sub":"Surat Pertama untuk Timotius 4:16","isi":[[16,"Teruslah perhatikan dirimu dan pengajaranmu. Tekunlah melakukan hal-hal ini, karena dengan begitu, kamu akan menyelamatkan dirimu dan orang-orang yang mendengarkan kamu. "]]},"r94":{"j":"p","jd":"Alasan Kita ”Terus Menghasilkan Banyak Buah”","sub":"w18.05 19 ¶8-9","isi":[["p","1, 2. (a) Pada malam terakhirnya, apa yang Yesus bicarakan dengan para muridnya? (Lihat gambar di awal artikel.) (b) Mengapa kita perlu ingat alasan kita mengabar? (c) Apa yang akan kita bahas?"],["p","PADA malam sebelum Yesus meninggal, dia berbicara cukup lama dengan para rasulnya. Dia meyakinkan mereka bahwa dia sangat menyayangi mereka. Dia juga menceritakan perumpamaan tentang tanaman anggur, yang kita bahas di artikel sebelumnya. Yesus ingin agar para muridnya ”terus menghasilkan banyak buah”, yaitu terus memberitakan kabar baik Kerajaan.​— Yoh. 15:8 ."],["p","2 Yesus tidak hanya memberi tahu muridnya apa yang perlu mereka lakukan, tapi juga mengapa mereka perlu melakukannya. Dia memberi mereka alasan untuk terus mengabar. Kita juga perlu ingat alasan-alasan itu, supaya kita bisa terus memberi ”kesaksian bagi semua bangsa”. ( Mat. 24:13, 14 ) Di artikel ini, kita akan membahas empat alasan dari Alkitab mengapa kita perlu mengabar. Kita juga akan membahas empat hal yang Yehuwa berikan agar kita bisa terus menghasilkan buah."]]},"r95":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 4:12-15","isi":[[12,"”Makan itu seperti kamu biasa memakan roti barli bundar. Di depan mata mereka, kamu harus memanggangnya di atas kotoran manusia yang sudah kering.”"],[13,"Yehuwa melanjutkan, ”Orang Israel akan makan roti yang najis seperti itu di antara bangsa-bangsa tempat Aku akan memencarkan mereka.” "],[14,"Lalu saya berkata, ”Aduh jangan, Tuan Yang Mahatinggi Yehuwa! Dari muda sampai sekarang, aku belum pernah tercemar karena makan daging dari bangkai atau binatang yang tercabik. Aku tidak pernah memasukkan daging yang najis ke mulutku.” "],[15,"Jadi Dia berkata, ”Baiklah, Aku izinkan kamu memakai pupuk kandang sebagai ganti kotoran manusia. Kamu harus memanggang rotimu di atasnya.”"]]},"r96":{"j":"p","jd":"","sub":"w94 1/8 13 ¶14-15","isi":[["p","1. Bagaimana beberapa orang telah menggambarkan bahwa Allah tidak bersikap masuk akal, dan bagaimana perasaan saudara mengenai pandangan demikian terhadap Allah?"],["p","ALLAH yang bagaimana yang saudara sembah? Apakah saudara percaya bahwa Dia adalah Allah yang menjalankan keadilan dengan tidak lentuk dan keras, berwatak dingin dan kaku? Bagi reformis Protestan John Calvin, Allah pastilah tampak demikian. Calvin menyatakan bahwa Allah memiliki ”rencana yang abadi dan tak dapat diubah” bagi setiap insan, menakdirkan apakah seseorang akan hidup kekal dalam kebahagiaan atau disiksa selama-lamanya dalam api neraka. Bayangkan: Jika hal itu benar, tidak ada yang bisa saudara lakukan, tidak soal seberapa keras upaya saudara, yang dapat mengubah rencana Allah yang kekal dan kaku berkenaan diri saudara dan masa depan saudara. Apakah saudara akan tertarik kepada Allah yang tidak bersikap masuk akal seperti itu?​—Bandingkan Yakobus 4:8 ."],["p","2, 3. (a) Bagaimana kita dapat mengilustrasikan sikap yang tidak masuk akal dari berbagai lembaga dan organisasi manusia? (b) Bagaimana penglihatan Yehezkiel tentang kereta surgawi menyingkapkan kesanggupan Allah untuk menyesuaikan diri?"]]},"r97":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 3:16-27","isi":[[16,"Setelah tujuh hari, Yehuwa berfirman kepada saya,"],[17,"”Putra manusia, Aku menunjuk kamu menjadi penjaga bagi orang Israel. Kalau kamu mendengar Aku berbicara, kamu harus menyampaikan peringatan-Ku kepada mereka. "],[18,"Kalau Aku berkata kepada orang jahat, ’Kamu pasti mati,’ tapi kamu tidak berbicara untuk memperingatkan dia supaya berbalik dari tingkah lakunya yang jahat agar dia tetap hidup, dia akan mati karena kesalahannya karena dia jahat. Tapi Aku akan memintamu bertanggung jawab atas nyawanya. +"],[19,"Tapi kalau kamu memperingatkan orang jahat dan dia tidak berbalik dari kejahatannya dan tingkah lakunya yang jahat, dia akan mati karena kesalahannya. Tapi kamu akan menyelamatkan nyawamu. "],[20,"Kalau ada orang benar yang tidak lagi berbuat benar lalu berbuat salah, Aku akan menaruh rintangan di jalannya dan dia akan mati. Kalau kamu tidak memperingatkan dia, dia akan mati karena dosanya, dan perbuatan benarnya tidak akan diingat. Tapi Aku akan memintamu bertanggung jawab atas nyawanya. +"],[21,"Kalau kamu sudah memperingatkan orang benar untuk tidak berbuat dosa, dan dia tidak berbuat dosa, dia akan tetap hidup karena dia sudah diperingatkan. Kamu juga akan menyelamatkan nyawamu sendiri.”"],[22,"Di sana, saya merasakan kekuatan Yehuwa, dan Dia berkata kepada saya, ”Pergilah ke lembah, dan Aku akan berbicara denganmu di sana.”"],[23,"Maka saya pergi ke lembah, dan di sana saya melihat kemuliaan Yehuwa, seperti kemuliaan yang saya lihat di dekat Sungai Khebar, dan saya pun sujud."],[24,"Lalu kuasa kudus masuk ke dalam diri saya dan membuat saya berdiri. Kemudian Allah berkata kepada saya, ”Pulanglah dan jangan keluar rumah."],[25,"Putra manusia, mereka akan mengikatmu dengan tali sehingga kamu tidak bisa pergi ke antara mereka."],[26,"Aku akan membuat lidahmu menempel ke langit-langit mulutmu, dan kamu pun akan bisu, tidak bisa memberi mereka teguran, karena mereka itu bangsa pemberontak."],[27,"Tapi saat Aku berbicara kepadamu, Aku akan membuka mulutmu, dan kamu harus berkata kepada mereka, ’Inilah yang dikatakan Tuan Yang Mahatinggi Yehuwa.’ Orang yang mendengarkan, biarlah dia mendengarkan, dan orang yang tidak mau mendengarkan, biarlah dia tidak mendengarkan, karena mereka itu bangsa pemberontak. "]]},"r98":{"j":"p","jd":"Rendah Hati","sub":"lmd pelajaran 4 nomor 4","isi":[["p","Kis. 26:​2, 3"],["p","PELAJARAN 4"],["p","Prinsip: ”Dengan rendah hati, anggaplah orang lain lebih tinggi daripada kalian.”— Flp. 2:3 ."]]},"r99":{"j":"p","jd":"Terus Terang","sub":"lmd pelajara
