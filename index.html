<style>
  /* ============================================================
     Jadwal Perhimpunan Tengah Pekan
     Desain mengikuti contoh: kertas Letter (612 x 792 pt),
     judul Cambria Bold 18 pt, isi Calibri 11 pt,
     bar bagian: abu #575A5D, emas #BE8900, marun #7E0024
     ============================================================ */

  :root{
    --abu:      #575A5D;   /* HARTA DALAM FIRMAN ALLAH + garis + label */
    --emas:     #BE8900;   /* BERSEMANGATLAH DALAM PELAYANAN */
    --marun:    #7E0024;   /* KEHIDUPAN KRISTEN */
    --label:    #575A5D;
    --teks:     #000000;

    --font-isi: Calibri, Carlito, "Segoe UI", Arial, sans-serif;
    --font-judul: Cambria, Caladea, Georgia, "Times New Roman", serif;

    /* kolom (pt) — mengikuti posisi pada contoh */
    --kiri: 34.4pt;      /* tepi kiri teks */
    --kanan: 20pt;       /* tepi kanan teks */
    --c-waktu: 36pt;     /* 34.4 → 70.4 */
    --c-isi: 325.6pt;    /* 70.4 → 396 */
    --c-siswa: 58pt;     /* 396 → 454 */
    --c-label: 28pt;     /* 454 → 482 */
  }

  *{ box-sizing: border-box; }

  html, body{ margin:0; padding:0; }

  body{
    background:#ececec;
    font-family: var(--font-isi);
    color: var(--teks);
    -webkit-text-size-adjust:100%;
  }

  /* ---------- pemilih pekan (tampil di layar, disembunyikan saat cetak) ---------- */
  .pilih-pekan{
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4pt;
    padding: 6pt 10pt;
    background: #ffffff;
    border-bottom: 1pt solid #cfcfcf;
    font-size: 9pt;
  }
  .pilih-pekan .judul-pilih{
    font-weight: 700;
    color: var(--label);
    margin-right: 4pt;
    letter-spacing: .02em;
  }
  .pilih-pekan a, .pilih-pekan button{
    display: inline-block;
    font: inherit;
    font-size: 9pt;
    cursor: pointer;
    padding: 3pt 7pt;
    border: 1pt solid #d4d4d4;
    border-radius: 2pt;
    color: #333;
    text-decoration: none;
    line-height: 1.2;
  }
  .pilih-pekan a:hover, .pilih-pekan button:hover{ background:#f2f2f2; }
  .pilih-pekan a.aktif, .pilih-pekan button.aktif{
    background: var(--abu); border-color: var(--abu); color:#fff;
  }

  /* ---------- halaman ---------- */
  .halaman{
    position: relative;
    width: 612pt;
    min-height: 792pt;
    margin: 14pt auto;
    padding: 0 var(--kanan) 0 var(--kiri);
    background: #fff;
    box-shadow: 0 1pt 6pt rgba(0,0,0,.18);
    overflow: visible;
    font-size: 11pt;
    line-height: 1;
  }

  /* kepala halaman */
  .kepala{
    position: relative;
    height: 90pt;
  }
  .sidang{
    position: absolute;
    left: 0;
    top: 73.7pt;
    font-size: 11pt;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
  .judul{
    position: absolute;
    right: 0;
    top: 66.4pt;
    margin: 0;
    font-family: var(--font-judul);
    font-size: 18pt;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
  }
  .garis{
    position: relative;
    left: -6.4pt;
    width: 564pt;
    height: 2pt;
    background: var(--abu);
  }

  /* baris atas: tanggal | kitab .... Ketua */
  .baris-atas{
    display: grid;
    grid-template-columns: var(--c-waktu) var(--c-isi) var(--c-siswa) var(--c-label) 1fr;
    align-items: start;
    padding-top: 7.5pt;
    margin-bottom: 9pt;
    line-height: 1.14;
  }
  .baris-atas .label{ padding-top: .8pt; }
  .baris-atas .pekan{ grid-column: 1 / 4; }
  .pekan{
    font-size: 11pt;
    font-weight: 700;
    line-height: 1.15;
    padding-right: 12pt;
  }
  .pekan .catatan{
    font-style: italic;
    font-weight: 700;
  }

  /* ---------- baris isi ---------- */
  .baris{
    display: grid;
    padding-bottom: 3pt;
    grid-template-columns: var(--c-waktu) var(--c-isi) var(--c-siswa) var(--c-label) 1fr;
    align-items: start;
    line-height: 1.14;
  }
  .waktu{
    grid-column: 1;
    font-size: 9pt;
    font-weight: 700;
    color: var(--label);
    padding-top: 2.3pt;
    white-space: nowrap;
  }
  .isi{ grid-column: 2; display: flex; gap: 0; align-items: flex-start; }
  /* isi dibatasi sampai kolomnya sendiri: 70,4 → 396 pt */
  .baris .isi{ width: 325.6pt; padding-right: 6pt; }
  .isi .peluru{
    display: block;
    width: 7.5pt;
    flex: 0 0 7.5pt;
  }
  .isi .peluru::before{
    content: "";
    display: block;
    width: 4pt;
    height: 4pt;
    margin-top: 3.1pt;
    border-radius: 50%;
    background: var(--label);
  }
  .isi .teks{ flex: 1 1 auto; min-width: 0; overflow-wrap: break-word; }
  /* nomor tetap di kiri, baris lanjutan rata dengan teks (bukan dengan nomor) */
  .teks.bagian{
    padding-left: 10.8pt;
    text-indent: -10.8pt;
  }
  .durasi{ font-size: 10pt; white-space: nowrap; }
  .durasi11{ white-space: nowrap; }
  .sub{ font-weight:400; }
  .tengah{
    grid-column: 3;
    font-size: 8pt;
    font-weight: 700;
    color: var(--label);
    text-align: left;
    padding-top: 2.2pt;
    white-space: nowrap;
  }
  .label{
    grid-column: 4;
    font-size: 8pt;
    font-weight: 700;
    color: var(--label);
    text-align: right;
    padding-top: 2.2pt;
    white-space: nowrap;
  }
  .nilai{
    grid-column: 5; text-align: left; padding-left: 4pt;
    white-space: normal; overflow-wrap: break-word; line-height: 1.14;
  }

  /* tinggi baris per jenis bagian (mengikuti jarak pada contoh) */
  .baris.lagu   { min-height: 14.8pt; }
  .baris.harta  { min-height: 19.5pt; padding-top: 0; }
  .baris.pelayanan { min-height: 13.6pt; }
  .baris.kehidupan { min-height: 14.7pt; }
  .baris.terakhir  { min-height: 19.1pt; }

  /* bar judul bagian */
  .seksi{ position: relative; margin-top: 13.5pt; }
  .seksi.emas{ margin-top: 7.6pt; }
  .seksi.pertama{ margin-top: 2.9pt; }
  .seksi + .baris{ margin-top: .4pt; }
  .bar-bagian{
    margin-left: -6.4pt;
    width: 361.6pt;
    height: 14.3pt;
    padding-left: 6pt;
    font-size: 10pt;
    font-weight: 700;
    line-height: 14.3pt;
    letter-spacing: .02em;
    color: #fff;
    white-space: nowrap;
  }
  .bar-bagian.abu{ background: var(--abu); }
  .bar-bagian.emas{ background: var(--emas); }
  .bar-bagian.marun{ background: var(--marun); }
  .ruang{
    position: absolute;
    left: 456.7pt;
    top: 4.7pt;
    font-size: 8pt;
    font-weight: 700;
    color: var(--label);
    white-space: nowrap;
  }

  /* ---------- tema sesi & isi link (show/hide) ---------- */
  .tema-tombol{
    display: inline;
    border: 0;
    background: none;
    margin: 0;
    padding: 1pt 2pt 2pt;
    font: inherit;
    font-size: 13pt;
    font-weight: 700;
    line-height: .9;
    vertical-align: -.5pt;
    color: #5f666b;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .tema-tombol::before{ content: "\00A0\25B8"; }
  .tema-tombol:hover{ color: #0d5c7a; }
  .tema-tombol[aria-expanded="true"]{ color: #0d5c7a; }
  .tema-tombol[aria-expanded="true"]::before{ content: "\00A0\25BE"; }

  .tema{
    width: 306pt;
    max-width: 306pt;
    overflow-wrap: break-word;
    margin: 1pt 0 9pt 46.8pt;
    padding: 2pt 0 0 9pt;
    border-left: 2pt solid #e4e6e8;
    font-size: 9.5pt;
    line-height: 1.42;
    color: #262626;
  }
  .tema[hidden]{ display: none; }
  .tema p{ margin: 0 0 5pt; }
  .tema p.butir{ position: relative; padding-left: 10pt; }
  .tema p.butir::before{ content: "\2022"; position: absolute; left: 0; color: #7a7f83; }
  .tema .jawaban{
    display: inline-block;
    margin: 1pt 0 6pt;
    padding: 2pt 7pt;
    font-size: 8.5pt;
    color: #6d7175;
    background: #f1f3f4;
    border-radius: 2pt;
  }

  /* teks biru bergaris bawah seperti di wol.jw.org */
  .tautan-wol{
    color: #0d5c7a;
    text-decoration: underline;
    text-decoration-thickness: .5px;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  /* nomor nyanyian jadi link ke lirik */
  .tautan-lagu{
    color: #0d5c7a;
    text-decoration: underline;
    text-decoration-thickness: .5px;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .tautan-lagu[aria-expanded="true"]{ background: #eef4f7; }
  .spoiler .lagu-bait{ margin: 0 0 7pt; }
  .spoiler .lagu-bait:last-child{ margin-bottom: 0; }
  .spoiler .lr{ margin: 0; }
  .spoiler .lr.sz{ margin-left: 14pt; }
  .spoiler .lr.se{ font-style: italic; color: #0d5c7a; margin: 3pt 0 0; }
  .spoiler .lagu-ayat-alkitab{ color: #6b6b6b; font-style: italic; margin: 0 0 6pt; }
  .lagu-sp{ margin-top: 4pt; margin-bottom: 6pt; }
  .lagu-sp .spoiler{ margin: 0; }

  /* isi link dibuka sebagai spoiler */
  .spoiler{
    margin: 4pt 0 8pt;
    padding: 6pt 9pt;
    background: #f5f7f8;
    border-left: 2pt solid #cfe0e6;
    border-radius: 2pt;
    font-size: 9pt;
    line-height: 1.42;
    color: #262626;
  }
  .spoiler[hidden]{ display: none; }
  .spoiler .judul-spoiler{
    margin-bottom: 4pt;
    font-size: 9pt;
    font-weight: 700;
    color: #0d5c7a;
  }
  .spoiler p{ margin: 0 0 5pt; }
  .spoiler p:last-child{ margin-bottom: 0; }
  .spoiler .ayat b{
    font-size: 7.5pt;
    color: #0d5c7a;
    vertical-align: super;
    margin-right: 2pt;
  }

  /* nama siswa/asisten: teks biasa, bisa diklik untuk pilih dari daftar */
  .pilih-nama{
    display: inline;
    padding: 0 1pt;
    border-radius: 2pt;
    cursor: pointer;
    border-bottom: .5pt dotted transparent;
  }
  .pilih-nama:hover{
    background: #eef4f7;
    border-bottom-color: #9fb6c0;
  }
  .pilih-nama:focus-visible{ outline: 1pt solid #0d5c7a; outline-offset: 1pt; }
  .pilih-nama .pn-caret{
    margin-left: 2pt;
    font-size: 7pt;
    color: #9aa1a6;
    opacity: .35;
  }
  .pilih-nama:hover .pn-caret,
  .pilih-nama[aria-expanded="true"] .pn-caret{ opacity: 1; color: #0d5c7a; }
  .pilih-nama[aria-expanded="true"]{ background: #eef4f7; }
  /* dua kolom nama: siswa | / | asisten (posisi rata antarbaris) */
  .nilai.dua{
    display: grid;
    grid-template-columns: 54pt 8pt 1fr;
    align-items: baseline;
  }
  .nilai.dua .pn-pisah{ text-align: center; margin: 0; }
  /* Pemandu/Pembaca Pem. Alkitab Sidang: selalu inisial, jadi kedua kolom
     dibuat berdekatan (bukan melebar seperti Siswa/Asisten) */
  .nilai.dua.rapat{ grid-template-columns: max-content 9pt 1fr; }
  .nilai.dua .pilih-nama{ display: inline-block; max-width: 100%; }
  .pn-pisah{ color: #8a9095; margin: 0 1.5pt; }
  .pn-teks.pn-kosong{ color: #b3b8bc; }

  /* daftar pilihan nama */
  .pn-pop{
    position: fixed;
    z-index: 60;
    width: min(300pt, calc(100vw - 14pt));
    background: #fff;
    border: .75pt solid #ccd2d6;
    border-radius: 4pt;
    box-shadow: 0 6pt 18pt rgba(0,0,0,.22), 0 1pt 3pt rgba(0,0,0,.08);
    font-family: var(--font-isi);
    font-size: 10pt;
    color: #1a1a1a;
    overflow: hidden;
    outline: none;
  }
  .pn-pop .pn-kepala{
    padding: 5pt 8pt;
    font-size: 7.5pt;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: #7b8287;
    background: #f7f8f9;
    border-bottom: .75pt solid #e6e9eb;
  }
  .pn-pop .pn-daftar{ max-height: 210pt; overflow-y: auto; padding: 0 0 2pt; }
  .pn-pop .pn-th,
  .pn-pop .pn-opsi{
    display: grid;
    grid-template-columns: 18pt minmax(0, 1fr) 30pt 92pt 12pt;
    align-items: center;
    gap: 4pt;
    width: 100%;
    text-align: left;
  }
  .pn-pop .pn-th{
    position: sticky; top: 0; z-index: 2;
    padding: 4pt 7pt;
    background: #f5f7f8;
    border-bottom: .75pt solid #e2e6e9;
    font-size: 7pt; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: #8a9095;
  }
  .pn-pop .pn-opsi{
    margin: 0;
    padding: 3.5pt 7pt;
    border: 0;
    border-bottom: .5pt solid #eef1f3;
    background: none;
    font: inherit;
    color: inherit;
    cursor: pointer;
  }
  .pn-pop .pn-opsi:hover,
  .pn-pop .pn-opsi.sorot{ background: #eaf2f6; }
  .pn-pop .pn-no{ font-size: 8pt; color: #a3a9ad; }
  .pn-pop .pn-opsi .pn-nama{ overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pn-pop .pn-kepala{
    display: flex; align-items: center; gap: 4pt;
  }
  .pn-pop .pn-judul{ flex: 1 1 auto; }
  .pn-pop .pn-saring{ display: flex; gap: 2pt; flex: 0 0 auto; }
  .pn-pop .pn-sbtn{
    padding: 1pt 5pt; border: .5pt solid #d5dade; border-radius: 2pt;
    background: #fff; color: #667; font: inherit; font-size: 7.5pt; cursor: pointer;
  }
  .pn-pop .pn-sbtn.on{ background: #0d5c7a; border-color: #0d5c7a; color: #fff; font-weight: 700; }
  .pn-pop .pn-opsi .pn-nama.gL{ color: #14526e; }
  .pn-pop .pn-opsi .pn-nama.gP{ color: #8a2b52; }
  .pn-pop .pn-opsi .pn-nama.gx{ color: #7a8085; }
  .pn-pop .pn-opsi .pn-st{
    justify-self: start; margin: 0;
    padding: .5pt 4pt; border-radius: 6pt;
    font-size: 7pt; font-weight: 700; white-space: nowrap;
  }
  .pn-pop .pn-opsi .pn-st.siap{ background: #e6f4ec; color: #1f6b45; }
  .pn-pop .pn-opsi .pn-st.tunggu{ background: #fdf1e3; color: #8a5a12; }
  .pn-pop .pn-kosong2{ padding: 10pt 8pt; font-size: 9pt; color: #8a9095; text-align: center; }
  .pn-pop .pn-opsi .pn-ini{
    margin: 0;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: .04em;
    color: #8a9095;
  }
  .pn-pop .pn-cek{ font-size: 9pt; color: #0d5c7a; text-align: right; }
  .pn-pop .pn-opsi.terpilih{ background: #f2f8fa; font-weight: 700; }
  .pn-pop .pn-opsi.terpilih .pn-ini{ color: #0d5c7a; }
  .pn-pop .pn-opsi.terpilih .pn-cek::before{ content: "\2713"; }
  .pn-pop .pn-kaki{ border-top: .75pt solid #e6e9eb; background: #fafbfb; }
  .pn-pop .pn-tambah,
  .pn-pop .pn-batal{
    display: block; width: 100%;
    padding: 5.5pt 8pt;
    border: 0; background: none;
    font: inherit; font-size: 9pt;
    color: #0d5c7a; text-align: left; cursor: pointer;
  }
  .pn-pop .pn-tambah:hover,
  .pn-pop .pn-batal:hover{ background: #eaf2f6; }
  .pn-pop .pn-baru{ display: flex; gap: 4pt; padding: 7pt; }
  .pn-pop .pn-baru input{
    flex: 1 1 auto; min-width: 0;
    padding: 3.5pt 5pt;
    border: .75pt solid #ccd2d6; border-radius: 2pt;
    font: inherit; font-size: 9.5pt; outline: none;
  }
  .pn-pop .pn-baru input:focus{ border-color: #0d5c7a; }
  .pn-pop .pn-baru button{
    padding: 3.5pt 9pt;
    border: .75pt solid #0d5c7a; border-radius: 2pt;
    background: #0d5c7a; color: #fff;
    font: inherit; font-size: 9pt; cursor: pointer;
  }

  /* tombol + jendela kelola daftar nama */
  .tombol-kanan{ margin-left: auto; display: flex; gap: 4pt; align-items: center; }
  .tombol-kanan .btn-daftar{ margin-left: 0; }
  .btn-keluar{ color: #8a5a12; border-color: #e6d6a4; background: #fffaf0; }
  .btn-tugas{ margin-left: 4pt; }
  .btn-daftar{
    margin-left: auto;
    font: inherit;
    font-size: 9pt;
    padding: 3pt 8pt;
    border: 1pt solid #d4d4d4;
    border-radius: 2pt;
    background: #fff;
    color: #333;
    cursor: pointer;
  }
  .btn-daftar:hover{ background: #f2f2f2; }

  .modal-tirai{
    position: fixed; inset: 0; z-index: 80;
    display: flex; align-items: center; justify-content: center;
    padding: 12pt;
    background: rgba(0,0,0,.35);
    font-family: var(--font-isi);
  }
  .modal-kotak{
    display: flex; flex-direction: column;
    width: 366pt; max-width: 100%;
    max-height: 82vh;
    background: #fff;
    border-radius: 4pt;
    box-shadow: 0 10pt 28pt rgba(0,0,0,.3);
    overflow: hidden;
  }
  .modal-kepala{
    display: flex; align-items: center; justify-content: space-between;
    padding: 8pt 10pt;
    font-size: 10pt; font-weight: 700;
    border-bottom: .75pt solid #e6e9eb;
    background: #f7f8f9;
  }
  .modal-x{
    border: 0; background: none; font-size: 13pt; line-height: 1;
    color: #7b8287; cursor: pointer; padding: 0 2pt;
  }
  .modal-x:hover{ color: #7e0024; }
  .modal-isi{ padding: 8pt 10pt; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .ed-tambah{
    display: grid;
    grid-template-columns: 1fr 44pt auto;
    gap: 4pt;
    margin-bottom: 6pt;
  }
  .ed-kepala-kolom{
    display: grid;
    grid-template-columns: 1fr 40pt 22pt 20pt 15pt;
    gap: 4pt;
    padding: 0 2pt 3pt;
    font-size: 7.5pt; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: #8a9095;
    border-bottom: .75pt solid #e6e9eb;
    margin-bottom: 4pt;
  }
  .ed-input{
    flex: 1 1 auto; min-width: 0;
    padding: 3.5pt 5pt;
    border: .75pt solid #ccd2d6; border-radius: 2pt;
    font: inherit; font-size: 9.5pt;
  }
  .ed-input:focus{ border-color: #0d5c7a; outline: none; }
  .ed-tambah-btn{
    padding: 3.5pt 9pt;
    border: .75pt solid #0d5c7a; border-radius: 2pt;
    background: #0d5c7a; color: #fff;
    font: inherit; font-size: 9pt; cursor: pointer;
  }
  .ed-daftar{ overflow-y: auto; min-height: 0; padding-right: 2pt; }
  .ed-baris.baru{ background: #fff6e0; border-radius: 3pt; }
  .ed-legenda{
    font: 8pt Calibri, "Segoe UI", sans-serif;
    color: #6b4e00; background: #fff9ea;
    border: 0.5pt solid #e6d6a4; border-radius: 3pt;
    padding: 4pt 5pt; margin-bottom: 5pt;
  }

<style>

const KUNCI_DAFTAR = "jhtp-daftar-siswa";

function bikinInisial(nama){
  const kata = String(nama || "").replace(/\s+/g, " ").trim().split(" ").filter(Boolean);
  if (!kata.length) return "";
  if (kata.length === 1) return kata[0].slice(0, 2).toUpperCase();
  return (kata[0][0] + kata[kata.length - 1][0]).toUpperCase();
}

function daftarSiswa(){
  try {
    const v = JSON.parse(localStorage.getItem(KUNCI_DAFTAR));
    if (Array.isArray(v)){
      return v.map((x) => {
        if (x && typeof x === "object"){
          return {
            n: String(x.n || ""),
            i: String(x.i || bikinInisial(x.n)),
            g: (x.g === "L" || x.g === "P") ? x.g : "",
            r: x.r === 0 ? 0 : 1
          };
        }
        return { n: String(x), i: bikinInisial(x), g: "", r: 1 };
      }).filter((o) => o.n).map(perbaruiOrang);
    }
  } catch (e) {}
  return DAFTAR_SISWA_BAWAAN.map((o) => ({ n: o.n, i: o.i, g: o.g || "", r: o.r === 0 ? 0 : 1 }));
}
/* penyesuaian data orang yang namanya dilengkapi belakangan */
const PERBARUI_ORANG = [
  { lama: "yakobus", baru: { n: "Yakobus Timop", i: "YT" } },
  { lama: "sumanto", baru: { n: "Sumanto", i: "SM" } }
];
function perbaruiOrang(o){
  const k = normNama(o.n);
  const p = PERBARUI_ORANG.find((x) => x.lama === k);
  const g = (x) => (x && (x.g === "L" || x.g === "P")) ? x.g : "";
  return p ? { n: p.baru.n, i: p.baru.i, g: g(p.baru) || g(o), r: o.r === 0 ? 0 : 1 } : o;
}
function simpanDaftarSiswa(arr){
  try { localStorage.setItem(KUNCI_DAFTAR, JSON.stringify(arr)); } catch (e) {}
}

/* "Kelvin Sutoto" -> "Kelvin S" */
function namaSemi(org){
  const kata = org.n.replace(/\s+/g, " ").trim().split(" ");
  if (kata.length === 1) return kata[0];
  return kata[0] + " " + kata[kata.length - 1][0].toUpperCase();
}
/* cari orang dari teks tersimpan (nama lengkap / semi / inisial) */
function normNama(t){
  return String(t == null ? "" : t)
    .toLowerCase()
    .replace(/\./g, "")
    .replace(/\s+/g, " ")
    .trim();
}
/* beda maksimal 1 huruf (toleransi salah ketik, mis. Anchilla / Ancilla) */
function jarak1(a, b){
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, d = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++d > 1) return false;
    if (a.length > b.length) i++;
    else if (a.length < b.length) j++;
    else { i++; j++; }
  }
  return true;
}
function cariOrang(teks){
  const t = normNama(teks);
  if (!t) return null;
  const arr = daftarSiswa();
  const satu = (fn) => { const h = arr.filter(fn); return h.length === 1 ? h[0] : null; };
  const persis = arr.find((o) => normNama(o.n) === t);
  if (persis) return persis;
  const inis = satu((o) => normNama(o.i) === t);
  if (inis) return inis;
  const semi = satu((o) => normNama(namaSemi(o)) === t);
  if (semi) return semi;
  /* nama depan saja, mis. "Debby" untuk "Debby Meha" (harus tunggal) */
  const depan = satu((o) => normNama(o.n.split(" ")[0]) === t.split(" ")[0]);
  if (depan) return depan;
  /* alias yang sudah dipastikan (nama panggilan di jadwal -> nama di daftar) */
  const alias = (typeof ALIAS_NAMA !== "undefined") ? ALIAS_NAMA[t] : null;
  if (alias){
    const o = arr.find((x) => normNama(x.n) === normNama(alias));
    if (o) return o;
  }
  return null;
}
/* tampilan: siswa/asisten pakai nama semi, kolom lain pakai inisial */
function tampilNama(isi, semi){
  const org = cariOrang(isi);
  if (org) return semi ? namaSemi(org) : (org.i || bikinInisial(org.n));
  /* nama yang belum ada di daftar: tampilkan apa adanya, tapi gaya semi
     diseragamkan ("Rita S." -> "Rita S", "Melly P." -> "Melly P") */
  const t = String(isi == null ? "" : isi).trim();
  if (semi){
    const m = t.match(/^(\S+)\s+([A-Z])\.$/);
    if (m) return m[1] + " " + m[2];
  }
  return t;
}

/* nama di slot siswa/asisten yang belum punya pasangan di daftar */
function namaBelumCocok(){
  const hasil = new Map();
  const tambah = (v) => {
    const t = String(v == null ? "" : v).trim();
    if (!t || t === "\u2014" || /^menyusul$/i.test(t)) return;
    if (cariOrang(t)) return;
    hasil.set(normNama(t), t);
  };
  JADWAL.forEach((d, wi) => {
    const w = "w" + (wi + 1);
    d.baris.forEach((b) => {
      if (!b.siswa || !/siswa/i.test(b.siswa)) return;
      const no = String(parseInt(b.nomor, 10));
      const pisah = String(b.nilai || "").split("/").map((x) => x.trim());
      const jml = pisah.length > 1 ? 2 : 1;
      for (let i = 0; i < jml; i++){
        const simpan = namaTersimpan(w, no, "s" + i);
        tambah(simpan != null ? simpan : pisah[i]);
      }
    });
  });
  return Array.from(hasil.values());
}

function daftarNama(){
  const arr = daftarSiswa().slice();
  const sudah = new Set(arr.map((o) => o.n.toLowerCase()));
  const tambahan = [];
  JADWAL.forEach((p) => p.baris.forEach((b) => {
    [b.nilai, b.doa, b.ketua].forEach((v) => {
      if (!v) return;
      String(v).split("/").forEach((n) => {
        n = n.trim();
        if (!n || n === "/") return;
        if (sudah.has(normNama(n))) return;
        if (cariOrang(n)) return;   // sudah terwakili nama lengkap/semi/inisial
        if (tambahan.some((o) => o.n.toLowerCase() === n.toLowerCase())) return;
        tambahan.push({ n: n, i: "", luar: true });
      });
    });
  }));
  return arr.concat(tambahan);
}

const KUNCI_NAMA = "jhtp-nama:";
function namaTersimpan(w, no, slot){
  try { return localStorage.getItem(KUNCI_NAMA + w + ":" + no + ":" + slot); } catch (e) { return null; }
}
function simpanNama(w, no, slot, nilai){
  try { localStorage.setItem(KUNCI_NAMA + w + ":" + no + ":" + slot, nilai); } catch (e) {}
}

"],["sz","Maka teruslah b’ritakan, b’ritakan!"],["se","(BRIDGE)"],["sp","Segera peringatkan:"],["sz","Akhir itu hampir tiba."],["sp","Ajarkan kebenaran,"],["sz","Selamatkan kehidupan."],["se","(REFREIN)"],["sp","Hidup kekal bagi m’reka"],["sz","Juga kita sendiri."],["sp","Hidup kekal jika taat,"],["sz","Maka teruslah b’ritakan, b’ritakan!"]]]},"63":{"jd":"Kita Saksi Yehuwa!","ay":"Yesaya 43:10-12","isi":[[["sl","1. Orang sembah yang palsu,"],["sz","Patung kayu dan batu,"],["sp","Tanpa kenal Allah"],["sz","Yang Mahakuasa."],["sp","Allah lain tak bisa"],["sz","Singkapkan masa depan,"],["sp","Kemampuannya tak terbukti,"],["sz","Tak punya saksi sejati."],["se","(REFREIN)"],["sp","Kita Saksi Yehuwa,"],["sz","Dengan lantang nyatakan,"],["sp","Allah kita Allah sejati."],["sz","Nubuat-Nya terjadi."]],[["sl","2. Kita merasa bangga"],["sz","Bersaksi tentang Allah."],["sp","Kita beritakan"],["sz","Kabar K’rajaan,"],["sp","Ajarkan kebenaran"],["sz","Yang bawa kebebasan,"],["sp","Agar banyak orang beriman,"],["sz","Ikut nyanyikan pujian."],["se","(REFREIN)"],["sp","Kita Saksi Yehuwa,"],["sz","Dengan lantang nyatakan,"],["sp","Allah kita Allah sejati."],["sz","Nubuat-Nya terjadi."]],[["sl","3. Kita turut bersihkan"],["sz","Nama baik Yehuwa,"],["sp","Serta peringatkan"],["sz","Yang mencela-Nya."],["sp","Bantu orang bertobat,"],["sz","Mendapatkan ampun-Nya."],["sp","Bahagia bila mengabdi,"],["sz","Kita ’kan hidup abadi."],["se","(REFREIN)"],["sp","Kita Saksi Yehuwa,"],["sz","Dengan lantang nyatakan,"],["sp","Allah kita Allah sejati."],["sz","Nubuat-Nya terjadi."]]]},"65":{"jd":"Majulah!","ay":"Ibrani 6:1","isi":[[["sl","1. Majulah, majulah, semakin matang!"],["sz","Pancarkan terangmu pada semua orang."],["sp","Tingkatkan upaya dalam p’layanan,"],["sz","Berkatnya kau rasakan."],["sp","Siapa pun dapat ikut serta,"],["sz","Yesus pun dahulu mengabar."],["sp","Andalkan Yehuwa agar tak jatuh,"],["sz","Agar kau tetap teguh."]],[["sl","2. Majulah, majulah, terus bersaksi!"],["sz","Kepada s n Allah."],["sz","Bernyanyilah, muliakan nama-Nya."]],[["sl","2. Kita nyanyi tentang kabar K’rajaan:"],["sz","Kristus Yesus Raja atas bumi."],["sp","Telah lahir bangsa yang dijanjikan,"],["sz","Yang warisi pem’rintahan ini."],["se","(REFREIN)"],["sp","Sembah Allah, Puji Dia."],["sz","Serukanlah, Kristus Raja!"],["sp","Pelajari lagu K’rajaan Allah."],["sz","Bernyanyilah, muliakan nama-Nya."]],[["sl","3. Lagu ini sungguh menyentuh hati,"],["sz","Dipahami orang rendah hati."],["sp","Banyak orang telah memp’lajarinya"],["sz","Dan sekarang undang yang lainnya:"],["se","(REFREIN)"],["sp","Sembah Allah, Puji Dia."],["sz","Serukanlah, Kristus Raja!"],["sp","Pelajari lagu K’rajaan Allah."],["sz","Bernyanyilah, muliakan nama-Nya."]]]},"75":{"jd":"”Utuslah Aku!”","ay":"Yesaya 6:8","isi":[[["sl","1. Kini orang hina Allah,"],["sz","Nodai nama suci-Nya,"],["sp","”Allah lemah, Allah kejam,”"],["sz","Anggap Allah tidak ada."],["sp","Siapa ’kan bela Yehuwa?"],["sz","Siapa ’kan puji nama-Nya?"],["se","(REFREIN 1)"],["sp","’Oh Tuan, utuslah aku!"],["sz","’Kan kuagungkan nama-Mu."],["sp","Sungguh kehormatan yang besar,"],["sz","Tuan, utuslah aku!’"]],[["sl","2. Orang sebut Allah lambat."],["sz","Pada-Nya tak beri hormat."],["sp","Ada yang sembah berhala,"],["sz","Ada yang puja penguasa."],["sp","Siapa ’kan p’ringatkan m’reka"],["sz","Tentang hari besar Allah?"],["se","(REFREIN 2)"],["sp","’Oh Tuan, utuslah aku!"],["sz","’Kan kup’ringatkan semua."],["sp","Sungguh kehormatan yang besar,"],["sz","Tuan, utuslah aku!’"]],[["sl","3. Yang lembut hati kecewa,"],["sz","Kar’na yang jahat bertambah."],["sp","Orang dengan tulus cari"],["sz","Di mana damai sejati."],["sp","Siapa ’kan hibur yang sedih?"],["sz","Siapa ’kan bantu yang resah?"],["se","(REFREIN 3)"],["sp","’Oh Tuan, utuslah aku!"],["sz","’Kan kuajarkan Firman-Mu."],["sp","Sungguh kehormatan yang besar,"],["sz","Tuan, utuslah aku!’"]]]},"90":{"jd":"Mari Saling Menguatkan","ay":"Ibrani 10:24, 25","isi":[[["sl","1. Kita saling beri semanga si":[{"t":"p","s":[{"t":"Bantu pelajar Alkitab Saudara mempersiapkan diri untuk memberikan kesaksian kepada keluarganya. ("},{"l":"lmd pelajaran 12 nomor 3","r":"r121"},{"t":")"}]}]},"7":{"jd":"Pikirkan Hasil Akhirnya","m":"15","isi":[{"t":"p","s":[{"t":"Pembahasan."}]},{"t":"p","s":[{"t":"Yehuwa memberi tahu bangsa Israel yang tidak setia, ”Aku akan membalasmu sesuai dengan tingkah lakumu, dan kamu akan mengalami akibat perbuatanmu yang memuakkan.” ("},{"l":"Yeh 7:4","r":"r114"},{"t":") Apa pelajarannya untuk kita?"}]},{"t":"p","s":[{"t":"Sebelum melakukan sesuatu, kita perlu memikirkan apa yang akan terjadi kalau kita melakukan hal itu. ("},{"l":"Ul 32:29","r":"r122"},{"t":") Misalnya, kalau kita tergoda untuk melakukan suatu dosa serius, kita harus berhenti sejenak dan pikirkan apa saja berkatnya kalau kita tetap setia dan apa saja akibatnya kalau kita menyerah pada godaan itu.—"},{"l":"Yes 59:2","r":"r123"},{"t":"."}]},{"t":"p","s":[{"t":"Baca "},{"l":"Amsal 27:11","r":"r124"},{"t":" "},{"t":"dan "},{"l":"Filipi 4:7","r":"r125"},{"t":". Lalu ajukan pertanyaan:"}]},{"t":"li","s":[{"t":"Berkat apa saja yang akan kita nikmati kalau kita tetap setia?"}]},{"t":"jwb"},{"t":"p","s":[{"t":"Baca "},{"l":"Mazmur 38:3-8","r":"r126"},{"t":". Lalu ajukan pertanyaan:"}]},{"t":"li","s":[{"t":"Akibat buruk apa saja yang mungkin kita alami kalau kita menyerah pada godaan dan berbuat dosa?"}]},{"t":"jwb"},{"t":"p","s":[{"t":"Putar VIDEO"},{"t":" "},{"t":"Bayangkan Saatnya. Lalu ajukan pertanyaan:"}]},{"t":"li","s":[{"t":"Berkat apa saja yang sangat Saudara nantikan di dunia baru?"}]},{"t":"jwb"}]},"8":{"jd":"Pelajaran Alkitab Sidang","m":"30","isi":[{"t":"p","s":[{"l":"wcg pengantar bagian 2,","r":"r127"},{"l":" garis waktu","r":"r128"},{"t":", dan "},{"l":"bab 22","r":"r129"}]}]}}},"w9":{"pekan":"28 Desember 2026–3 Januari 2027","alkitab":"Yehezkiel 9-10","bagian":{"1":{"jd":"Bantulah Orang Lain Selamat Melewati Armagedon","m":"10","isi":[{"t":"p","s":[{"t":"Orang Israel yang muak terhadap kejahatan seolah-olah diberi tanda agar bisa selamat dari kehancuran ("},{"l":"Yeh 9:4","r":"r130"},{"t":"; "},{"l":"rr 173 ¶6","r":"r131"},{"t":")"}]},{"t":"p","s":[{"t":"Mereka yang tidak mendapat tanda itu kehilangan nyawa saat Yerusalem dihancurkan ("},{"l":"Yeh 9:5, 6","r":"r132"},{"t":")"}]},{"t":"p","s":[{"t":"Kita masih bisa membantu orang-orang berpihak kepada Yehuwa bahkan di saat-saat terakhir sebelum Armagedon tiba ("},{"l":"w25.08 31 ¶1-2,","r":"r133"},{"l":" 6","r":"r134"},{"t":")"}]}]},"2":{"jd":"Permata Rohani","m":"10","isi":[{"t":"li","s":[{"l":"Yeh 9:9","r":"r135"},{"t":"—Kenapa berita penghukuman Yehuwa ini juga ditujukan kepada orang Israel? ("},{"l":"it ”Kronologi” ¶104","r":"r136"},{"t":")"}]},{"t":"jwb"},{"t":"li","s":[{"t":"Dari pembacaan Alkitab minggu ini, permata rohani apa yang mau Saudara bagikan?"}]},{"t":"jwb"}]},"3":{"jd":"Pembacaan Alkitab","m":"4","isi":[{"t":"p","s":[{"l":"Yeh 9:1-11","r":"r137"},{"t":" ("},{"l":"th pelajaran 5","r":"r30"},{"t":")"}]}]},"4":{"jd":"Memulai Percakapan","m":"3","isi":[{"t":"p","s":[{"t":"RUMAH KE RUMAH. Tunjukkan (tapi jangan putar) sebuah video dari Alat Bantu Pengajaran. ("},{"l":"lmd pelajaran 3 nomor 5","r":"r138"},{"t":")"}]}]},"5":{"jd":"Melakukan Kunjungan Kembali","m":"4","isi":[{"t":"p","s":[{"t":"RUMAH KE RUMAH. Tunjukkan dan bahas sebuah video yang menjawab pertanyaan penghuni rumah. ("},{"l":"lmd pelajaran 9 nomor 5","r":"r139"},{"t":")"}]}]},"6":{"jd":"Menjelaskan Kepercayaan Saudara","m":"5","isi":[{"t":"p","s":[{"t":"Pertunjukan. Tunjukkan dan bahas sebuah video dari seri "},{"t":"Apakah Ini Dirancang?"},{"t":" untuk membantu seorang guru mengerti kenapa kita percaya Pencipta itu ada. ("},{"l":"th pelajaran 2","r":"r83"},{"t":")"}]}]},"7":{"jd":"’Selamatkan Dirimu dan Orang-Orang yang Mendengarkan Kamu’","m":"15","isi":[{"t":"p","s":[{"t":"Pembahasan."}]},{"t":"p","s":[{"t":"Bagaimana kita bisa menyelamatkan diri sendiri dan orang-orang yang mau mendengarkan? Dengan terus memperhatikan diri kita dan pengajaran kita. ("},{"l":"1Tim 4:16","r":"r93"},{"t":") Kita memperhatikan diri kita dengan menjaga persahabatan kita dengan Yehuwa tetap kuat agar tidak terpengaruh hal-hal buruk di dunia ini. Kita memperhatikan pengajaran kita dengan terus meningkatkan keterampilan mengajar kita. Nah, video-video dari organisasi bisa membantu kita melakukan kedua hal itu."}]},{"t":"p","s":[{"t":"Putar VIDEO"},{"t":" "},{"t":"Perjalanan Sejarah Organisasi Kita—Mengajar Melalui Film dan Video. Lalu ajukan pertanyaan:"}]},{"t":"li","s":[{"t":"Selama ini, bagaimana organisasi kita menggunakan film dan video untuk mengajar?"}]},{"t":"jwb"},{"t":"li","s":[{"t":"Film atau video mana yang pernah menyentuh hati Saudara atau membantu keluarga Saudara?"}]},{"t":"jwb"},{"t":"li","s":[{"t":"Dalam kesempatan apa saja kita bisa menggunakan video dalam pelayanan, dan bagaimana kita bisa membuat persiapan untuk itu?"}]},{"t":"jwb"}]},"8":{"jd":"Pelajaran Alkitab Sidang","m":"30","isi":[{"t":"p","s":[{"l":"wcg bab 23","r":"r140"}]}]}}}},"ref":{"r1":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:14","isi":[[14,"Kalian semua yang melengkungkan busur panah, Seranglah Babilon dari segala sisi dalam barisan tempur. Panah dia, jangan ada anak panah yang tersisa,  Karena dia telah berdosa terhadap Yehuwa. "]]},"r2":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:29","isi":[[29,"Kumpulkan pemanah untuk menyerang Babilon, Semua yang melengkungkan busur panah.  Berkemahlah di sekelilingnya; jangan sampai ada yang lolos. Balaslah dia sesuai dengan perbuatannya.  Perlakukan dia seperti dia memperlakukan yang lain.  Sebab dia bertindak sombong terhadap Yehuwa, Terhadap Yang Kudus Allah Israel. "]]},"r3":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:31","isi":[[31,"”Babilon yang kurang ajar, Akulah lawanmu,” kata Tuan Yang Mahatinggi, Yehuwa yang berbala tentara, ”Waktumu akan tiba, yaitu waktunya Aku menghukum kamu."]]},"r4":{"j":"p","jd":"LANCANG, KELANCANGAN","sub":"it ”Lancang, Kelancangan” ¶10","isi":[["p","Kelancangan Akan Berakhir. Babilon kuno adalah contoh khas tentang kelancangan terhadap Allah, dan karena itu permusuhan Allah dengannya bersifat abadi. Nabi Yeremia berkata kepadanya, ”’Lihat! Aku melawan engkau, hai, Kelancangan,’ demikian ucapan Tuan Yang Berdaulat. . . . Kelancangan akan tersandung dan jatuh.” ( Yer 50:29, 31, 32 ) Babilon Besar simbolis terbukti menjadi musuh Allah yang sengit dan paling lancang di bumi; ia membuat penduduk bumi mabuk ”oleh anggur percabulannya” dan ia bertanggung jawab atas ”darah nabi-nabi dan orang-orang kudus dan semua orang yang telah dibantai di bumi”. Untuk itu, ia akan mengalami kebinasaan abadi. ( Pny 17:2, 5; 18:7, 8, 20, 24 ) Hal ini selaras dengan janji Yehuwa untuk mengakhiri segala kelancangan yang bersifat Babilon, ”Aku akan benar-benar menghentikan kesombongan orang yang lancang, dan keangkuhan orang lalim akan aku rendahkan.”— Yes 13:11 ."]]},"r5":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:20","isi":[[20,"Yehuwa berkata, ”Pada saat itu, Kesalahan Israel akan dicari, Tapi ternyata tidak ada. Dosa-dosa Yehuda tidak akan ditemukan, Karena Aku akan mengampuni orang-orang yang Kubiarkan hidup.” "]]},"r6":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:2","isi":[[2,"”Beritakanlah di antara bangsa-bangsa dan umumkan. Pasanglah tanda dan umumkan. Jangan sembunyikan apa pun! Katakan, ’Babilon telah direbut.  Bel telah dipermalukan.  Merodakh ketakutan. Patung-patungnya dipermalukan. Berhala-berhalanya yang menjijikkan ketakutan.’"]]},"r7":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:8","isi":[[8,"”Larilah dari tengah-tengah Babilon, Keluarlah dari negeri orang Khaldea,  Dan jadilah seperti binatang jantan yang memimpin kawanannya."]]},"r8":{"j":"p","jd":"","sub":"w08 15/6 8-9 ¶8-11","isi":[["p","1. Sebutkan beberapa contoh Alkitab tentang orang yang melarikan diri."],["p","APA yang terlintas dalam benak Saudara saat mendengar kata ”lari” atau ”melarikan diri”? Ada yang mungkin membayangkan Yusuf, pemuda tampan yang lari dari rayuan amoral istri Potifar. ( Kej. 39:7-12 ) Yang lain mungkin teringat akan orang-orang Kristen yang melarikan diri dari Yerusalem pada tahun 66 M, karena menaati peringatan Yesus, ”Apabila kamu melihat Yerusalem dikepung oleh bala tentara yang berkemah, kemudian . . . hendaklah orang-orang yang di Yudea mulai melarikan diri ke pegunungan, dan hendaklah orang-orang yang berada di tengah-tengah kota itu mengundurkan diri.”​— Luk. 21:20, 21 ."],["p","2, 3. (a) Apa makna kecaman Yohanes Pembaptis terhadap para pemimpin agama? (b) Bagaimana Yesus meneguhkan peringatan yang Yohanes berikan?"]]},"r9":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:24","isi":[[24,"Babilon, Aku telah memasang jerat untukmu dan kamu telah tertangkap, Dan kamu tidak menyadarinya. Kamu telah ditemukan dan ditangkap,  Karena yang kamu lawan adalah Yehuwa."]]},"r10":{"j":"p","jd":"PERANGKAP","sub":"it ”Perangkap” ¶3","isi":[["p","Ciri lain dari perangkap yang disinggung secara kiasan adalah cepatnya alat ini bekerja, secara tiba-tiba menyergap mangsanya. Kejatuhan Babilon ke tangan orang Media dan Persia, contohnya, datang dengan begitu tiba-tiba dan tidak disangka-sangka sehingga dapat dikatakan bahwa Yehuwa memasang suatu jerat atau perangkap atas Babilon.— Yer 50:24 ; bdk. Luk 21:34, 35 ."]]},"r11":{"j":"a","jd":"Yeremia","sub":"Yeremia 50:24-40","isi":[[24,"Babilon, Aku telah memasang jerat untukmu dan kamu telah tertangkap, Dan kamu tidak menyadarinya. Kamu telah ditemukan dan ditangkap,  Karena yang kamu lawan adalah Yehuwa."],[25,"Yehuwa telah membuka gudang-Nya, Dan mengeluarkan senjata-senjata kemarahan-Nya.  Sebab ada pekerjaan yang akan dilakukan Tuan Yang Mahatinggi, Yehuwa yang berbala tentara, Di negeri orang Khaldea."],[26,"Datanglah melawannya dari tempat-tempat yang jauh.  Buka lumbung-lumbungnya.  Tumpukkan jarahan seperti gandum yang ditumpuk, Dan binasakan dia.  Biarlah tidak ada satu pun orangnya yang tersisa."],[27,"Bunuh semua sapi jantan mudanya.  Biarlah mereka pergi ke pembantaian. Sungguh celaka mereka, karena harinya telah tiba, Hari penghukuman mereka!"],[28,"Ada seruan dari orang-orang yang melarikan diri, Yang meloloskan diri dari negeri Babilon, Untuk memberitahukan di Zion tentang pembalasan Yehuwa, Allah kita, Pembalasan untuk bait-Nya. "],[29,"Kumpulkan pemanah untuk menyerang Babilon, Semua yang melengkungkan busur panah.  Berkemahlah di sekelilingnya; jangan sampai ada yang lolos. Balaslah dia sesuai dengan perbuatannya.  Perlakukan dia seperti dia memperlakukan yang lain.  Sebab dia bertindak sombong terhadap Yehuwa, Terhadap Yang Kudus Allah Israel. "],[30,"Karena itu, para pemudanya akan tewas di lapangan-lapangannya,  Dan semua tentaranya akan musnah pada hari itu,” kata Yehuwa."],[31,"”Babilon yang kurang ajar, Akulah lawanmu,” kata Tuan Yang Mahatinggi, Yehuwa yang berbala tentara, ”Waktumu akan tiba, yaitu waktunya Aku menghukum kamu."],[32,"Babilon yang kurang ajar, kamu akan tersandung dan jatuh. Tidak ada yang akan membangunkan kamu.  Aku akan membakar kota-kotamu, Dan apinya akan melalap semua yang ada di sekitarmu.”"],[33,"Inilah yang dikatakan Yehuwa yang berbala tentara: ”Orang Israel dan orang Yehuda ditindas. Semua yang menawan mereka telah menahan mereka,  Tidak mau melepaskan mereka. "],[34,"Tapi Penebus mereka itu kuat.  Nama-Nya Yehuwa yang berbala tentara.  Dia pasti akan menangani kasus hukum mereka,  Untuk membuat negeri mereka tenteram,  Dan membuat penduduk Babilon resah.” "],[35,"Yehuwa berkata, ”Ada pedang yang melawan orang Khaldea, Melawan penduduk Babilon, dan melawan para pemimpin dan orang-orangnya yang bijaksana. "],[36,"Ada pedang yang melawan orang-orang yang suka omong kosong, dan mereka akan bertindak bodoh. Ada pedang yang melawan para pejuangnya, dan mereka akan ketakutan. "],[37,"Ada pedang yang melawan kuda dan kereta perang mereka, Melawan orang-orang dari berbagai bangsa yang tinggal di dalamnya. Mereka akan menjadi seperti perempuan.  Ada pedang yang melawan hartanya, dan itu akan dijarah. "],[38,"Ada kehancuran di sekitar sungainya, dan itu akan menjadi kering.  Sebab negeri itu penuh patung ukiran,  Dan mereka bertindak gila karena mendapat penglihatan yang menyeramkan."],[39,"Karena itu, binatang gurun akan tinggal bersama binatang yang melolong, Dan burung unta akan tinggal di sana.  Tidak akan ada lagi orang yang tinggal di sana, Ataupun menghuni tempat itu lagi dari zaman ke zaman.” "],[40,"”Tidak ada yang akan tinggal ataupun menetap di sana, seperti Sodom dan Gomora serta kota-kota tetangganya yang Allah hancurkan,” kata Yehuwa."]]},"r12":{"j":"p","jd":"Berbicara dengan Bersemangat","sub":"th pelajaran 11","isi":[["p","PELAJARAN 11"],["h","Roma 12:11"],["p","YANG PERLU DILAKUKAN: Berbicaralah dengan bersemangat agar pendengar Saudara tergerak untuk bertindak."],["h","CARA MELAKUKANNYA:"],["p","Pastikan bahan itu menyentuh hati Saudara. Saat mempersiapkan suatu bahan, renungkan mengapa bahan itu penting. Pelajari bahan itu dengan baik sehingga Saudara bisa menyampaikannya dari hati."],["p","Pikirkan pendengar Saudara. Sebelum membacakan atau mengajarkan suatu bahan, pikirkan apa manfaat bahan itu bagi orang lain. Pikirkan dengan cara apa saja Saudara bisa menyampaikan bahan itu supaya pendengar bisa melihat dengan jelas manfaatnya bagi mereka."],["p","Sampaikan dengan cara yang hidup. Berbicaralah dengan bersemangat. Gunakan ekspresi wajah dan gerakan yang wajar untuk menunjukkan perasaan Saudara."],["p","Supaya pendengar bisa berfokus pada bahan yang Saudara sampaikan, jangan terus gunakan gerakan yang sama. Pastikan gerakan Saudara sesuai dengan apa yang Saudara katakan. Saudara perlu berbicara dengan bersemangat khususnya saat mengajarkan gagasan utama dan saat ingin menggerakkan pendengar untuk bertindak. Jangan terus-menerus berbicara dengan bersemangat supaya pendengar Saudara tidak lelah mendengarnya."]]},"r13":{"j":"p","jd":"Kebenaran yang Senang Kita Ajarkan","sub":"lampiran A","isi":[["p","LAMPIRAN A"],["p","Yesus berkata bahwa orang yang tulus bisa mengenali kebenaran saat dia mendengarnya. ( Yoh. 10:​4, 27 ) Jadi, setiap kali Saudara berbicara kepada seseorang, cobalah bagikan satu hal yang sederhana dari Alkitab. Saudara bisa bertanya, ”Apa Bapak/Ibu tahu kalau . . . ?” atau ”Apa Bapak/Ibu pernah dengar kalau . . . ?” Lalu, gunakan satu atau beberapa ayat untuk menjelaskannya. Dengan membagikan sesuatu dari Alkitab, kita seperti menanam benih dalam hati seseorang, dan Allah bisa membuat benih itu bertumbuh.— 1 Kor. 3:​6, 7 ."],["p","Masa Depan"],["p","Keluarga"],["p","Allah"],["p","Doa"],["p","Yesus"],["p","Kerajaan Allah"],["p","Penderitaan"],["p","Kematian"],["p","Agama"],["h","MASA DEPAN"],["p","1. Peristiwa dunia dan sikap orang-orang menunjukkan bahwa sekarang sudah akhir zaman.— Mat. 24:​3, 7, 8; Luk. 21:​10, 11; 2 Tim. 3:​1-5 ."],["p","2. Bumi tidak akan pernah hancur.— Mz. 104:5; Pkh. 1:4 ."],["p","3. Keadaan bumi yang rusak akan dipulihkan.— Yes. 35:​1, 2; Why. 11:18 ."],["p","4. Semua orang akan punya kesehatan yang sempurna.— Yes. 33:24; 35:​5, 6 ."],["p","5. Kita bisa hidup selamanya di bumi.— Mz. 37:29; Mat. 5:5 ."],["h","KELUARGA"],["p","6. Suami harus ’mengasihi istri seperti diri sendiri’.— Ef. 5:33; Kol. 3:19 ."],["p","7. Istri harus benar-benar menghormati suaminya.— Ef. 5:33; Kol. 3:18 ."],["p","8. Suami istri harus setia.— Mal. 2:16; Mat. 19:​4-6, 9; Ibr. 13:4 ."],["p","9. Anak-anak harus menghormati dan menaati orang tua supaya hidup mereka berhasil.— Ams. 1:​8, 9; Ef. 6:​1-3 ."],["p","NASA , ESA and the Hubble Heritage Team ( STScI / AURA )-ESA/ Hubble Collaboration. Licensed under CC BY 4.0 . Source ."],["h","ALLAH"],["p","10. Allah punya nama.— Mz. 83:18; Yer. 10:10 ."],["p","11. Allah berbicara kepada kita melalui Kitab Suci.— 2 Tim. 3:​16, 17; 2 Ptr. 1:​20, 21 ."],["p","12. Allah itu adil dan tidak berat sebelah.— Ul. 10:17; Kis. 10:​34, 35 ."],["p","13. Allah mau menolong kita.— Mz. 46:1; 145:​18, 19 ."],["h","DOA"],["p","14. Allah mau kita berdoa kepada-Nya.— Mz. 62:8; 65:2; 1 Ptr. 5:7 ."],["p","15. Kita bisa belajar caranya berdoa dari Alkitab.— Mat. 6:​7-13; Luk. 11:​1-4 ."],["p","16. Kita perlu sering berdoa.— Mat. 7:​7, 8; 1 Tes. 5:17 ."],["h","YESUS"],["p","17. Yesus itu guru yang luar biasa, dan nasihatnya bermanfaat untuk kita.— Mat. 6:​14, 15, 34; 7:12 ."],["p","18. Berbagai peristiwa yang sekarang terjadi sudah dinubuatkan Yesus.— Mat. 24:​3, 7, 8, 14; Luk. 21:​10, 11 ."],["p","19. Yesus itu Putra Allah.— Mat. 16:16; Yoh. 3:16; 1 Yoh. 4:15 ."],["p","20. Yesus bukan Allah Yang Mahakuasa.— Yoh. 14:28; 1 Kor. 11:3 ."],["p","Based on NASA/Visible Earth imagery"],["h","KERAJAAN ALLAH"],["p","21. Kerajaan Allah adalah pemerintahan yang ada di surga.— Dan. 2:44; 7:​13, 14; Mat. 6:​9, 10; Why. 11:15 ."],["p","22. Kerajaan Allah akan menggantikan semua pemerintahan manusia.— Mz. 2:​7-9; Dan. 2:44 ."],["p","23. Hanya Kerajaan Allah yang bisa menyelesaikan semua masalah manusia.— Mz. 37:​10, 11; 46:9; Yes. 65:​21-23 ."],["h","PENDERITAAN"],["p","24. Bukan Allah yang membuat kita menderita.— Ul. 32:4; Yak. 1:13 ."],["p","25. Dunia ini dikuasai Setan.— Luk. 4:​5, 6; 1 Yoh. 5:19 ."],["p","26. Allah tahu penderitaan kita dan mau menolong kita.— Mz. 34:​17-19; Yes. 41:​10, 13 ."],["p","27. Sebentar lagi Allah akan mengakhiri penderitaan.— Yes. 65:17; Why. 21:​3, 4 ."],["h","KEMATIAN"],["p","28. Orang mati tidak tahu apa-apa dan tidak menderita.— Pkh. 9:5; Yoh. 11:​11-14 ."],["p","29. Orang mati tidak bisa membantu atau mencelakai kita.— Mz. 146:4; Pkh. 9:​6, 10 ."],["p","30. Keluarga dan sahabat kita yang sudah meninggal akan dibangkitkan.— Ayb. 14:​13-15; Yoh. 5:​28, 29; Kis. 24:15 ."],["p","31. ”Kematian tidak akan ada lagi”.— Why. 21:​3, 4; Yes. 25:8 ."],["h","AGAMA"],["p","32. Tidak semua agama diterima Allah.— Yer. 7:11; Mat. 7:​13, 14, 21-23 ."],["p","33. Allah membenci orang yang munafik.— Yes. 29:13; Mi. 3:11; Mrk. 7:​6-8 ."],["p","34. Ciri agama yang benar adalah kasih yang tulus.— Mi. 4:3; Yoh. 13:​34, 35 ."]]},"r14":{"j":"p","jd":"Pikirkan Minat Mereka","sub":"lmd pelajaran 1 nomor 5","isi":[["p","Yoh. 4:​6-9"],["p","PELAJARAN 1"],["p","Prinsip: ”Orang yang punya kasih . . . tidak mementingkan diri.”— 1 Kor. 13:​4, 5 ."]]},"r15":{"j":"p","jd":"Peduli","sub":"lmd pelajaran 9 nomor 3","isi":[["p","Mrk. 6:​30-34"],["p","PELAJARAN 9"],["p","Prinsip: ”Bergembiralah bersama orang yang bergembira, dan menangislah bersama orang yang menangis.”— Rm. 12:15 ."]]},"r16":{"j":"p","jd":"Bagaimana Sidang Kristen Diorganisasi?","sub":"lff pelajaran 20 nomor 4","isi":[["h","4. Yesus adalah pemimpin yang baik hati"],["p","Yesus dengan hangat mengundang kita untuk menerima dia sebagai pemimpin kita. Bacalah Matius 11:28-30 , dan bahas pertanyaan-pertanyaan ini:"],["p","Pemimpin seperti apakah Yesus itu? Bagaimana perasaan orang-orang yang dipimpin oleh Yesus?"],["p","Bagaimana para penatua meniru teladan Yesus? Putar VIDEO ."],["p","VIDEO: Bantuan Para Penatua Setelah Gempa Bumi di Nepal (4:56)"],["p","Alkitab dengan jelas memberitahukan bagaimana para penatua seharusnya menjalankan tugas mereka."],["p","Bacalah Yesaya 32:2 dan 1 Petrus 5:1-3 , dan bahas pertanyaan-pertanyaan ini:"],["p","Seperti Yesus, para penatua berupaya untuk memperlakukan semua orang di sidang dengan baik hati. Bagaimana perasaan Anda ketika mengetahui hal itu?"],["p","Hal-hal apa lagi yang para penatua tiru dari Yesus?"]]},"r17":{"j":"p","jd":"Sederhana","sub":"lmd pelajaran 11 nomor 4","isi":[["p","Mat. 6:​25-27"],["p","PELAJARAN 11"],["p","Prinsip: ”Kalau kata-kata kalian tidak mudah dimengerti, bagaimana orang akan tahu apa yang kalian bicarakan?”— 1 Kor. 14:9 ."]]},"r18":{"j":"p","jd":"Mereka Menghadapi Musibah Bersama-sama","sub":"wcg bab 15","isi":[["p","15 NAOMI DAN RUT"],["p","NAOMI mengalami musibah demi musibah. Waktu Israel dilanda kelaparan, suami Naomi memutuskan agar keluarga mereka pindah dari Betlehem ke negeri Moab. Suatu hari, suami Naomi meninggal sehingga Naomi hanya tinggal bersama kedua putranya di negeri asing itu. Belakangan, kedua putranya menikahi wanita Moab yang tidak menyembah Yehuwa. Kira-kira sepuluh tahun kemudian, terjadilah musibah lain: Kedua putra Naomi juga meninggal! Mereka belum punya anak. Jadi sekarang, Naomi kehilangan suami, anak, dan kesempatan untuk punya cucu."],["p","Karena merasa tidak punya apa-apa lagi, Naomi memutuskan untuk pulang ke Betlehem, yang jauhnya kira-kira satu minggu perjalanan. Wanita yang sudah berumur itu ditemani kedua menantunya, yaitu Rut dan Orpa. Tapi, Naomi tidak tega kalau mereka harus meninggalkan keluarga dan kampung halaman mereka. Lagi pula, di Israel nanti, mereka belum tentu bisa menikah lagi dan punya anak. Jadi, janda yang tidak egois ini menyuruh Rut dan Orpa pulang ke rumah ibu mereka masing-masing. Naomi dengan berani memutuskan untuk melanjutkan perjalanannya sendirian. Orpa dan Rut menangis tersedu-sedu. Akhirnya, Orpa memutuskan untuk kembali, tapi Rut tetap bersama Naomi."],["p","Rut berkata kepada Naomi, ”Jangan minta aku meninggalkan Ibu . . . Ke mana Ibu pergi, aku akan pergi. Di mana Ibu bermalam, aku akan bermalam. Bangsa Ibu akan menjadi bangsaku, dan Allah Ibu akan menjadi Allahku. Di mana Ibu meninggal, aku akan meninggal, dan di sanalah aku akan dikuburkan.” Wanita muda yang setia dan berani ini sudah memutuskan untuk menyembah Allah Yehuwa, seperti Naomi."],["p","Rut dan Naomi dilanda dukacita tapi mendapat penghiburan dari umat Yehuwa"],["p","Rut melanjutkan perjalanannya ke Israel bersama Naomi. Dia meninggalkan keluarganya, kebudayaannya, dan dewa-dewi Moab yang dulu dia sembah. Saat mereka akhirnya tiba di Betlehem, beberapa wanita kaget melihat Naomi yang sudah jauh berbeda. Naomi pun dengan sedih memberi tahu mereka bahwa Yehuwa sudah mengambil segalanya, sehingga dia pulang dengan tangan kosong dan hidupnya pahit. Mendengar itu, Rut bisa saja merasa bahwa semua pengorbanannya demi ibu mertuanya tidak dihargai. Tapi, tidak ada catatan bahwa Rut sakit hati. Malah, Alkitab berkata bahwa dia mulai bekerja dengan memungut sisa panen di ladang-ladang sekitar untuk memenuhi kebutuhan dirinya dan Naomi."],["p","Kerja keras Rut tidak luput dari perhatian seorang pemilik ladang yang kaya, yaitu Boaz anak Rahab. Pria yang beriman ini mencari tahu tentang Rut dan mendengar pengorbanan Rut demi Naomi. Dia pun memuji Rut karena Rut memilih untuk mengandalkan perlindungan dari Allah Yehuwa. Bahkan, Boaz memastikan para pemuda yang bekerja di ladangnya tidak mengganggu Rut."],["p","Malamnya, Naomi senang waktu mendengar cerita Rut tentang kebaikan hati Boaz. Jangan-jangan Boaz bisa menjadi suami Rut! Pria itu masih punya hubungan keluarga dengan Naomi. Dalam hukum Taurat, ada pengaturan khusus bagi janda yang masih muda seperti Rut. Dia berhak menikah dengan keluarga dekat suaminya yang sudah meninggal, supaya dia bisa punya anak laki-laki yang akan meneruskan nama suaminya. Dengan begitu, garis keturunan suaminya tidak terputus dan warisan keluarga suaminya tidak berpindah tangan. ( Ul. 25:​5, 6 ) Naomi pun meminta Rut melakukan sesuatu."],["p","Permintaan Naomi mungkin terdengar aneh bagi Rut. Tapi, Rut melawan rasa khawatirnya dan setuju untuk melakukannya. Pada malam hari, dia pergi ke tempat pengirikan. Di situ, pria-pria biasanya tidur di samping tumpukan biji-bijian yang sudah dipanen. Lalu, Rut diam-diam mendekati Boaz yang sedang tertidur, membuka selimut di kaki Boaz, dan berbaring di sana. Waktu Boaz terbangun, Rut dengan sopan berbicara kepada Boaz tentang hukum Taurat yang berlaku untuknya. Pria yang baik hati itu mungkin menyadari bahwa Rut khawatir. Dia terkesan melihat keberanian dan kasih setia Rut kepada Yehuwa dan Naomi. Boaz pun setuju untuk menikah dengan Rut, tapi dia perlu memastikan dulu apakah dia berhak melakukannya."],["p","Besoknya, Boaz pergi menemui para pemimpin kota Betlehem. Dia memastikan bahwa dia berhak menikahi Rut dan mengurus semuanya sesuai hukum Taurat. Setelah mereka menikah, Rut melahirkan anak laki-laki, yang dinamai Obed. Naomi sangat menyayangi cucunya itu. Belakangan, Obed menjadi kakek dari Raja Daud dan leluhur Mesias! ( Mat. 1:​5, 6, 16 ) Yehuwa benar-benar memberkati keberanian Naomi dan Rut!"],["h","Baca kisahnya di:"],["p","Rut 1:1–4:22"],["h","Untuk dibahas:"],["p","Bagaimana Naomi dan Rut bersikap berani dan tabah?"],["h","Gali Lebih Dalam"],["p","1. Kenapa pengaturan Yehuwa tentang memungut sisa panen adalah pengaturan yang istimewa? ( ia 39 ¶23, catatan kaki ) Gambar A"],["p","Gambar A"],["p","2. Kenapa kita bisa menyimpulkan bahwa Rut tidak mendekati Boaz dengan tujuan yang salah? ( ia 47 ¶17-18 )"],["p","3. Boaz memanggil Rut ”anakku”. Apa yang bisa kita pelajari dari hal ini? ( Rut 2:8 ; w16.11 3 ¶4-6 )"],["p","4. Tidak seperti pria yang disebutkan di Rut 4:​1, 6 , Boaz setuju untuk menikahi Rut. Bagaimana hal ini menunjukkan bahwa Boaz tidak egois? ( w23.03 14 ) Gambar B"],["p","Gambar B"],["h","Pikirkan Pelajarannya"],["p","Saat kita kesulitan secara ekonomi, apa manfaatnya kalau kita meniru Rut yang rajin dan selalu bersyukur? Gambar C"],["p","Gambar C"],["p","Waktu Naomi terpuruk, dia dibantu dan dikuatkan oleh Rut. Apa yang bisa kita pelajari dari Naomi yang mau menerima bantuan? Apa yang bisa kita pelajari dari Rut tentang menguatkan orang lain?"],["p","Dengan cara apa lagi Saudara bisa meniru Naomi dan Rut yang berani dan tabah?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Naomi dan Rut setelah mereka dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Dari buku Rut, apa saja yang bisa kita pelajari tentang kasih setia, dan bagaimana kita bisa menunjukkannya?"],["p","”Teruslah Tunjukkan Kasih Setia kepada Satu Sama Lain” ( w21.11 8-13)"],["p","Gunakan komik Alkitab ini untuk membantu anak Saudara membayangkan kisahnya."],["p","”Rut Adalah Teman yang Setia” ( ijwis artikel 12)"]]},"r19":{"j":"a","jd":"Yeremia","sub":"Yeremia 52:1","isi":[[1,"52 Zedekia berumur 21 tahun ketika menjadi raja dan memerintah selama 11 tahun di Yerusalem. Ibunya adalah Hamutal anak Yeremia dari Libna."]]},"r20":{"j":"p","jd":"Melayani pada ”Akhir Masa”","sub":"jr 29","isi":[["p","Zedekia adalah penguasa yang pengecut, tidak berpendirian, serta mudah dipengaruhi oleh para pembesarnya dan oleh rasa takutnya sendiri. Dalam pengepungan Yerusalem yang terakhir oleh Babilon, Zedekia mencari bimbingan Allah melalui Yeremia. Namun, sang raja tidak bertindak selaras dengannya ketika diberi tahu untuk menyerah. Karena tidak suka dengan berita Yeremia, Zedekia memenjarakannya. ( Yer. 21:1-9; 32:1-5 ) Meski begitu, sang raja terus meminta nasihat Yeremia tetapi secara diam-diam agar tidak membuat marah para pembesar Yehuda. Ketika mereka meminta agar Yeremia dibunuh, Zedekia menurut karena takut, dengan mengatakan, ”Ia ada dalam tanganmu. Sebab raja tidak dapat berbuat apa-apa agar berhasil membujuk kamu.” Setelah Yeremia terbebas dari ancaman kematian, sang raja lagi-lagi meminta nasihatnya dan mengakui bahwa ia takut orang-orang akan menganiayanya jika ia menaati Allah.​— Yer. 37:15-17; 38:4, 5, 14-19, 24-26 ."],["p","Namun, Zedekia ”tidak merendahkan diri di hadapan nabi Yeremia . . . , dan ia terus menegarkan tengkuknya serta mengeraskan hatinya untuk tidak kembali kepada Yehuwa”.​— 2 Taw. 36:12, 13; Yeh. 21:25 ."],["p","24. Jelaskan peristiwa-peristiwa pada tahun 607 SM."],["p","24 Pada tahun 607 SM, orang Babilon akhirnya menerobos tembok Yerusalem, dan kota itu pun jatuh. Pasukan Nebukhadnezar membakar bait Yehuwa, menghancurkan tembok-tembok kota, dan membantai para bangsawan Yehuda. Zedekia berupaya kabur, tetapi akhirnya tertangkap dan dihadapkan kepada penakluknya. Putra-putra Zedekia dibantai di depan matanya sendiri, dan kemudian Nebukhadnezar membutakannya, mengikatnya, dan membawanya ke Babilon. ( Yer. 39:1-7 ) Ya, kata-kata Yeremia tentang Yehuda dan Yerusalem telah menjadi kenyataan. Ketimbang gembira, sang nabi Allah meratapi malapetaka yang dialami umat-Nya. Kita bisa membaca perasaannya di buku Ratapan dalam Alkitab. Kita pasti akan sangat tersentuh saat membaca buku itu."],["h","KEGIATAN DI ANTARA SISA ORANG YEHUDA"],["p","25, 26. (a) Peristiwa apa saja yang terjadi setelah keruntuhan Yerusalem? (b) Bagaimana orang-orang pada zaman Yeremia menanggapi beritanya setelah Yerusalem jatuh?"],["p","25 Apa yang terjadi dengan Yeremia sementara berbagai peristiwa yang dramatis ini berlangsung? Para pembesar Yerusalem telah memenjarakannya, tetapi orang Babilon yang mengalahkan mereka memperlakukan Yeremia dengan baik, membebaskan dia. Belakangan, Yeremia terbaur dalam kelompok orang Yahudi yang dibawa ke penawanan, tetapi ia dibebaskan. Namun, masih ada banyak hal yang harus ia lakukan dalam dinasnya kepada Allah; ada yang harus ia kerjakan di antara orang-orang yang selamat. Nebukhadnezar melantik Gedalia sebagai gubernur atas negeri taklukan itu, menjanjikan kedamaian kepada sisa orang Yehuda selama mereka melayani dia, sang raja Babilon. Tetapi, beberapa orang Yahudi yang tidak puas membunuh Gedalia. ( Yer. 39:13, 14; 40:1-7; 41:2 ) Yeremia mendesak sisa orang Yehuda untuk tetap tinggal di negeri itu dan tidak perlu takut kepada raja Babilon. Namun, para pemimpin mereka menuduh Yeremia pendusta dan melarikan diri ke Mesir, dengan paksa membawa serta Yeremia dan Barukh. Tetapi, Yeremia bernubuat bahwa Nebukhadnezar bahkan akan menyerbu dan menaklukkan Mesir serta membawa malapetaka atas para pengungsi Yehuda itu.​— Yer. 42:9-11; 43:1-11; 44:11-13 ."],["p","26 Lagi-lagi, orang-orang sebangsa Yeremia tidak mau mendengarkan sang nabi Allah. Mengapa? ”Sejak kami berhenti membuat asap korban bagi ’ratu surga’ dan mencurahkan persembahan minuman baginya,” kata mereka, ”kami kekurangan segala sesuatu, dan oleh pedang dan bala kelaparan kami sampai pada kesudahan kami.” ( Yer. 44:16, 18 ) Benar-benar suatu gambaran yang menyedihkan tentang keadaan rohani orang-orang pada zaman Yeremia! Di pihak lain, kita sungguh berbesar hati karena tahu bahwa seorang manusia yang tidak sempurna bisa tetap setia kepada Yehuwa meski dikelilingi oleh orang-orang yang tidak setia!"],["p","27. Apa yang kita ketahui tentang tahun-tahun terakhir dari karier Yeremia sebagai nabi?"],["p","27 Peristiwa terakhir yang dicatat Yeremia​—dibebaskannya Yehoyakhin dari penjara di bawah kekuasaan penerus Nebukhadnezar, Ewil-merodakh​—terjadi pada tahun 580 SM. ( Yer. 52:31-34 ) Saat itu, Yeremia pasti sudah berusia kira-kira 90 tahun. Kita tidak punya informasi yang tepercaya tentang akhir kehidupan Yeremia. Kemungkinan besar ia berada di Mesir selama tahun-tahun terakhirnya dan meninggal dalam keadaan setia di sana setelah menjalani dinas khusus kepada Yehuwa selama 67 tahun. Ia melayani pada masa ketika ibadat sejati didukung maupun ketika ibadat murtad merajalela di sekitarnya. Beberapa orang yang takut akan Allah memang mendengarkan Yeremia. Namun, mayoritas orang menolak beritanya, bahkan memperlihatkan permusuhan secara terang-terangan. Apakah itu berarti Yeremia gagal? Sama sekali tidak! Sejak awal, Yehuwa telah memberi tahu dia, ”Mereka pasti akan memerangi engkau, tetapi mereka tidak akan menang melawan engkau, sebab ’aku menyertai engkau’.” ( Yer. 1:19 ) Tugas kita sebagai Saksi-Saksi Yehuwa dewasa ini sama seperti Yeremia. Jadi, reaksi orang-orang terhadap kita pun akan serupa. ( Baca Matius 10:16-22 . ) Maka, pelajaran apa saja yang bisa kita peroleh dari Yeremia, dan bagaimana kita hendaknya memandang tugas pelayanan kita? Mari kita bahas pertanyaan-pertanyaan ini."],["p","Apa yang terjadi dengan Zedekia dan rakyatnya yang menolak berita Yeremia? Apa pandangan Saudara terhadap Yeremia?"],["p","a Karena Yeremia 7:1-15 mirip dengan 26:1-6 , beberapa orang menyimpulkan bahwa kedua pasal itu membicarakan peristiwa yang sama."],["p","b Daniel 1:1, 2 mengatakan bahwa Yehoyakim diserahkan ke tangan Nebukhadnezar pada tahun ketiga pemerintahan Yehoyakim sebagai raja bawahan. Ini bisa berarti bahwa sang raja mati selama pengepungan, yang akhirnya berhasil. Tidak ada konfirmasi Alkitab tentang laporan Yosefus bahwa Nebukhadnezar membunuh Yehoyakim dan membuang mayatnya ke luar tembok Yerusalem tanpa pemakaman.​— Yer. 22:18, 19; 36:30 ."],["p","c Disebutkannya Yehoyakim di Yeremia 27:1 mungkin adalah kesalahan penyalin karena ayat 3 dan 12 menyebutkan Zedekia."]]},"r21":{"j":"a","jd":"Yeremia","sub":"Yeremia 52:3","isi":[[3,"Yehuwa marah kepada Yerusalem dan Yehuda sehingga mereka mengalami semua ini, sampai Dia membuang mereka dari hadapan-Nya. Belakangan, Zedekia memberontak terhadap raja Babilon. "]]},"r22":{"j":"p","jd":"Pelajaran dari Penglihatan Zakharia","sub":"w17.10 23 ¶9-10","isi":[["p","1-3. (a) Sewaktu Zakharia mulai bernubuat, bagaimana keadaan umat Yehuwa? (b) Mengapa Yehuwa ingin agar umat-Nya kembali kepada-Nya?"],["p","ZAKHARIA mendapat penglihatan yang luar biasa. Beberapa hal yang dia lihat adalah gulungan yang terbang, seorang wanita di dalam wadah, dan dua wanita yang terbang dengan sayap seperti sayap bangau. ( Za. 5:1, 7-9 ) Mengapa Zakharia mendapat penglihatan yang menakjubkan ini dari Yehuwa? Bagaimana keadaan orang Israel pada waktu itu? Dan, pelajaran apa yang bisa kita dapatkan dari penglihatan ini?"],["p","2 Pada tahun 537 SM, umat Yehuwa sangat bersukacita. Setelah ditawan di Babilon selama 70 tahun, mereka akhirnya bebas! Mereka tidak sabar ingin pulang ke Yerusalem untuk membangun kembali bait dan menyembah Yehuwa. Setahun kemudian, mereka berhasil menyelesaikan fondasi bait. Mereka sangat senang dan mereka ”bersorak dengan sorakan yang keras, dan suara itu terdengar bahkan sampai jarak jauh”. ( Ezr. 3:10-13 ) Tapi, tekanan dari musuh untuk menghentikan pembangunan bait semakin kuat. Orang Israel menjadi sangat ketakutan sampai-sampai mereka berhenti membangun bait. Mereka malah sibuk membangun rumah mereka sendiri dan bercocok tanam. Enam belas tahun kemudian, bait Yehuwa masih belum selesai. Umat Allah perlu diberi peringatan untuk tidak mementingkan diri dan kembali kepada Yehuwa. Yehuwa ingin agar mereka berani dan bersemangat dalam beribadat kepada-Nya."]]},"r23":{"j":"a","jd":"Yeremia","sub":"Yeremia 52:8-11","isi":[[8,"tapi pasukan Khaldea mengejar Raja Zedekia, dan berhasil menyusulnya di Padang Gurun Yerikho. Seluruh pasukan Raja pun berhamburan meninggalkan dia."],[9,"Kemudian, Raja Zedekia ditangkap dan dibawa kepada raja Babilon di Ribla di tanah Hamat, lalu dihukum."],[10,"Putra-putra Zedekia dibantai oleh raja Babilon di depan matanya, dan dia juga membantai semua pemimpin Yehuda di sana, di Ribla."],[11,"Kemudian Raja Babilon membutakan mata Zedekia, lalu mengikat kakinya dengan rantai tembaga, membawanya ke Babilon, dan memenjarakannya sampai dia mati."]]},"r24":{"j":"p","jd":"Pelajaran dari Penglihatan Zakharia","sub":"w17.10 23 ¶11-12","isi":[["p","1-3. (a) Sewaktu Zakharia mulai bernubuat, bagaimana keadaan umat Yehuwa? (b) Mengapa Yehuwa ingin agar umat-Nya kembali kepada-Nya?"],["p","ZAKHARIA mendapat penglihatan yang luar biasa. Beberapa hal yang dia lihat adalah gulungan yang terbang, seorang wanita di dalam wadah, dan dua wanita yang terbang dengan sayap seperti sayap bangau. ( Za. 5:1, 7-9 ) Mengapa Zakharia mendapat penglihatan yang menakjubkan ini dari Yehuwa? Bagaimana keadaan orang Israel pada waktu itu? Dan, pelajaran apa yang bisa kita dapatkan dari penglihatan ini?"],["p","2 Pada tahun 537 SM, umat Yehuwa sangat bersukacita. Setelah ditawan di Babilon selama 70 tahun, mereka akhirnya bebas! Mereka tidak sabar ingin pulang ke Yerusalem untuk membangun kembali bait dan menyembah Yehuwa. Setahun kemudian, mereka berhasil menyelesaikan fondasi bait. Mereka sangat senang dan mereka ”bersorak dengan sorakan yang keras, dan suara itu terdengar bahkan sampai jarak jauh”. ( Ezr. 3:10-13 ) Tapi, tekanan dari musuh untuk menghentikan pembangunan bait semakin kuat. Orang Israel menjadi sangat ketakutan sampai-sampai mereka berhenti membangun bait. Mereka malah sibuk membangun rumah mereka sendiri dan bercocok tanam. Enam belas tahun kemudian, bait Yehuwa masih belum selesai. Umat Allah perlu diberi peringatan untuk tidak mementingkan diri dan kembali kepada Yehuwa. Yehuwa ingin agar mereka berani dan bersemangat dalam beribadat kepada-Nya."]]},"r25":{"j":"a","jd":"Yeremia","sub":"Yeremia 51:6","isi":[[6,"Larilah dari tengah-tengah Babilon Dan selamatkan nyawamu.  Jangan mati karena kesalahannya. Sebab inilah saatnya Yehuwa membalas. Dia membalasnya atas semua yang dilakukannya. "]]},"r26":{"j":"a","jd":"Yeremia","sub":"Yeremia 51:36","isi":[[36,"Maka inilah yang Yehuwa katakan: ”Aku akan menangani kasus hukummu,  Aku akan melakukan pembalasan untukmu.  Aku akan mengeringkan lautnya dan sumur-sumurnya. "]]},"r27":{"j":"p","jd":"”Yehuwa Melakukan Apa yang Telah Ia Maksudkan”","sub":"jr 165 ¶21;","isi":[["p","1. Setelah Yerusalem benar-benar hancur, apa yang Yeremia katakan tentang nubuat Yehuwa?"],["p","YERUSALEM sudah menjadi puing. Asap masih mengepul dari api yang disulut oleh orang-orang Babilon yang menaklukkan kota itu. Yeremia masih ingat akan jeritan mengerikan dari orang-orang yang dibantai. Ia telah diberi tahu tentang apa yang bakal terjadi, dan peristiwa demi peristiwa bergulir tepat seperti yang Allah katakan. ”Yehuwa melakukan apa yang telah ia maksudkan,” kata sang nabi sambil menghela napas. Kejatuhan Yerusalem benar-benar suatu tragedi!​ —Baca Ratapan 2:17 ."],["p","2. Yeremia melihat penggenapan nubuat apa yang diucapkan berabad-abad sebelumnya?"]]},"r28":{"j":"p","jd":"”Yehuwa Melakukan Apa yang Telah Ia Maksudkan”","sub":"167 ¶25","isi":[["p","1. Setelah Yerusalem benar-benar hancur, apa yang Yeremia katakan tentang nubuat Yehuwa?"],["p","YERUSALEM sudah menjadi puing. Asap masih mengepul dari api yang disulut oleh orang-orang Babilon yang menaklukkan kota itu. Yeremia masih ingat akan jeritan mengerikan dari orang-orang yang dibantai. Ia telah diberi tahu tentang apa yang bakal terjadi, dan peristiwa demi peristiwa bergulir tepat seperti yang Allah katakan. ”Yehuwa melakukan apa yang telah ia maksudkan,” kata sang nabi sambil menghela napas. Kejatuhan Yerusalem benar-benar suatu tragedi!​ —Baca Ratapan 2:17 ."],["p","2. Yeremia melihat penggenapan nubuat apa yang diucapkan berabad-abad sebelumnya?"]]},"r29":{"j":"a","jd":"Yeremia","sub":"Yeremia 52:6-20","isi":[[6,"Pada hari kesembilan dari bulan keempat, saat kota itu mengalami kelaparan yang parah dan tidak ada makanan untuk rakyat negeri itu, "],[7,"tembok kota itu akhirnya diterobos. Malamnya, semua prajurit melarikan diri dari kota itu melalui gerbang di antara tembok berlapis dua, yang ada di dekat taman raja, sementara kota itu dikepung orang-orang Khaldea. Lalu, mereka pergi ke arah Araba, "],[8,"tapi pasukan Khaldea mengejar Raja Zedekia, dan berhasil menyusulnya di Padang Gurun Yerikho. Seluruh pasukan Raja pun berhamburan meninggalkan dia."],[9,"Kemudian, Raja Zedekia ditangkap dan dibawa kepada raja Babilon di Ribla di tanah Hamat, lalu dihukum."],[10,"Putra-putra Zedekia dibantai oleh raja Babilon di depan matanya, dan dia juga membantai semua pemimpin Yehuda di sana, di Ribla."],[11,"Kemudian Raja Babilon membutakan mata Zedekia, lalu mengikat kakinya dengan rantai tembaga, membawanya ke Babilon, dan memenjarakannya sampai dia mati."],[12,"Pada hari kesepuluh dari bulan kelima, di tahun ke-19 pemerintahan Nebukhadnezar raja Babilon, Nebuzaradan yang adalah kepala pengawal raja Babilon datang ke Yerusalem. "],[13,"Dia membakar rumah Yehuwa, istana raja, dan semua rumah di Yerusalem. Setiap rumah yang besar juga dibakar olehnya."],[14,"Selain itu, tembok di sekeliling Yerusalem dirobohkan oleh seluruh pasukan Khaldea yang mengikuti kepala pengawal itu. "],[15,"Nebuzaradan kepala pengawal itu menawan beberapa orang kecil dan orang-orang yang tersisa di kota itu. Dia juga membawa orang-orang yang membelot kepada raja Babilon, dan para perajin ahli yang tersisa. "],[16,"Tapi Nebuzaradan kepala pengawal itu meninggalkan sebagian rakyat negeri itu yang sangat miskin untuk menjadi pengurus kebun anggur dan pekerja paksa. "],[17,"Orang Khaldea menghancurkan pilar-pilar tembaga rumah Yehuwa, serta kereta-kereta dan Laut Tembaga yang ada di rumah Yehuwa, lalu membawa semua tembaganya ke Babilon. "],[18,"Mereka juga mengambil semua ember, sekop, pemadam, mangkuk, cangkir, dan semua peralatan tembaga yang digunakan di bait."],[19,"Kepala pengawal itu mengambil semua baskom, wadah bara, mangkuk, ember, tempat lampu, cangkir, dan mangkuk lainnya yang terbuat dari emas dan perak asli. "],[20,"Tembaga yang didapat dari kedua pilar, dari Laut Tembaga, dari 12 patung sapi jantan tembaga di bawah Laut Tembaga, dan dari kereta-kereta yang dibuat Raja Salomo untuk rumah Yehuwa itu terlalu banyak untuk ditimbang."]]},"r30":{"j":"p","jd":"Membaca dengan Tepat","sub":"th pelajaran 5","isi":[["p","PELAJARAN 5"],["h","1 Timotius 4:13"],["p","YANG PERLU DILAKUKAN: Bacakan tulisan tercetak dengan tepat."],["h","CARA MELAKUKANNYA:"],["p","Buat persiapan dengan baik. Pikirkan alasan bagian itu ditulis. Berlatihlah dengan membaca kelompok kata, bukan setiap kata secara terpisah. Berhati-hatilah agar Saudara tidak menambah, melewatkan, atau mengganti kata. Perhatikan semua tanda baca."],["p","Minta seorang teman mendengarkan pembacaan Saudara. Minta dia memberitahukan kata-kata mana yang Saudara baca dengan kurang tepat."],["p","Ucapkan setiap kata dengan benar. Jika Saudara tidak tahu cara mengucapkan suatu kata dalam publikasi, periksa kata itu di kamus, dengarkan rekamannya, atau bertanyalah kepada seorang pembaca yang terampil."],["p","Berbicaralah dengan jelas. Tegakkan kepala dan buka mulut lebar-lebar supaya kata-kata Saudara jelas. Upayakan agar setiap suku kata terdengar."],["p","Jangan ucapkan setiap suku kata dengan sejelas-jelasnya. Kalau Saudara melakukan itu, pembacaan Saudara akan terdengar tidak wajar."]]},"r31":{"j":"p","jd":"Baik Hati","sub":"lmd pelajaran 3 nomor 3","isi":[["p","Yoh. 9:​1-7"],["p","PELAJARAN 3"],["p","Prinsip: ”Orang yang punya kasih itu . . . baik hati.”— 1 Kor. 13:4 ."]]},"r32":{"j":"p","jd":"Baik Hati","sub":"lmd pelajaran 3 nomor 4","isi":[["p","Yoh. 9:​1-7"],["p","PELAJARAN 3"],["p","Prinsip: ”Orang yang punya kasih itu . . . baik hati.”— 1 Kor. 13:4 ."]]},"r33":{"j":"p","jd":"Kebenaran yang Senang Kita Ajarkan","sub":"lmd lampiran A nomor 21","isi":[["p","NASA , ESA and the Hubble Heritage Team ( STScI / AURA )-ESA/ Hubble Collaboration. Licensed under CC BY 4.0 . Source ."],["h","ALLAH"],["p","10. Allah punya nama.— Mz. 83:18; Yer. 10:10 ."]]},"r34":{"j":"p","jd":"Tepat dan Bisa Dipercaya","sub":"th pelajaran 7","isi":[["p","PELAJARAN 7"],["h","Lukas 1:3"],["p","YANG PERLU DILAKUKAN: Pakai sumber yang bisa dipercaya untuk membantu pendengar Saudara membuat kesimpulan yang benar."],["h","CARA MELAKUKANNYA:"],["p","Cari dan gunakan sumber yang bisa dipercaya. Gunakan Firman Allah sebagai dasar dari apa yang Saudara sampaikan. Jika mungkin, bacalah langsung dari Alkitab. Jika Saudara mengutip fakta ilmiah, berita, pengalaman, atau bukti lainnya, pastikan informasinya benar dan sumbernya bisa dipercaya."],["p","Sampaikan informasi dengan tepat. Jelaskan ayat sesuai dengan konteksnya, dengan berita utama Alkitab, dan dengan publikasi dari ”budak yang setia dan bijaksana”. ( Mat. 24:45 ) Kalau Saudara mengambil informasi dari sumber di luar organisasi, sampaikan sesuai dengan konteks aslinya dan maksud penulisnya."],["p","Jangan melebih-lebihkan fakta dan jumlah. Berhati-hatilah agar tidak mengubah ”beberapa orang” menjadi ”kebanyakan orang”, atau ”kadang-kadang” menjadi ”selalu”."],["p","Bantu pendengar berpikir. Setelah membacakan suatu ayat atau mengutip suatu informasi, ajukan pertanyaan atau berikan gambaran untuk membantu pendengar membuat kesimpulan."],["h","DALAM PELAYANAN"],["p","Sewaktu membuat persiapan untuk mengabar, pikirkan apa yang mungkin akan ditanyakan orang dan cari tahu jawabannya dengan meriset. Kalau pendengar Saudara bertanya dan Saudara tidak tahu jawabannya, beri tahu dia bahwa Saudara akan meriset dulu jawabannya lalu kembali."]]},"r35":{"j":"a","jd":"Buku Pertama Tawarikh","sub":"Buku Pertama Tawarikh 29:8-10","isi":[[8,"Semua yang memiliki batu berharga memberikannya ke tempat penyimpanan harta rumah Yehuwa, yang diawasi oleh Yehiel keturunan Gersyon. "],[9,"Bangsa itu bergembira atas persembahan sukarela mereka, karena mereka memberikannya kepada Yehuwa dengan sepenuh hati. Raja Daud juga sangat gembira."],[10,"Lalu Daud mengagungkan Yehuwa di depan seluruh jemaat itu. Dia berkata, ”Semoga Engkau, Yehuwa Allah Israel leluhur kami, dipuji sampai selamanya. "]]},"r36":{"j":"a","jd":"Mazmur","sub":"Mazmur 96:8","isi":[[8,"Muliakanlah Yehuwa karena nama-Nya;  Bawalah pemberian dan masuklah ke halaman rumah-Nya."]]},"r37":{"j":"a","jd":"Buku Pertama Tawarikh","sub":"Buku Pertama Tawarikh 29:14-16","isi":[[14,"”Tapi siapakah aku dan siapakah bangsaku, sehingga kami bisa memberikan persembahan sukarela seperti ini? Segala sesuatu berasal dari-Mu, dan apa yang kami berikan kepada-Mu berasal dari tangan-Mu."],[15,"Di hadapan-Mu, kami adalah penduduk asing dan penduduk sementara, sama dengan semua leluhur kami. Hidup kami di bumi ini seperti bayangan dan tanpa harapan."],[16,"Yehuwa Allah kami, segala hal ini, yang kami siapkan untuk membangun rumah bagi nama suci-Mu, berasal dari tangan-Mu, dan semuanya itu milik-Mu."]]},"r38":{"j":"a","jd":"Yesaya","sub":"Yesaya 12:5","isi":[[5,"Nyanyikan pujian bagi Yehuwa, karena hal-hal hebat yang Dia lakukan.  Beri tahukan itu ke seluruh bumi."]]},"r39":{"j":"p","jd":"”Saya Pasti Ikut”","sub":"wcg bab 16","isi":[["p","16 BARAK DAN DEBORA"],["p","BANGSA Israel berada di masa yang kelam. Mereka sudah memberontak melawan Yehuwa. Jadi, persis seperti yang Yehuwa peringatkan, Dia membiarkan mereka dijajah dan ditindas. Mereka pun diserahkan ke tangan raja Kanaan bernama Yabin. Panglimanya, Sisera, adalah pria yang sangat kejam. Dia punya pasukan besar dan 900 kereta kuda yang diperlengkapi sabit besi."],["p","Selama 20 tahun, orang Israel hidup dalam ketakutan karena pasukan Sisera. Kelihatannya, setiap kali pasukan itu menyerang sebuah desa atau kota, mereka menculik dan memerkosa gadis-gadis muda. Orang-orang pun bersembunyi di hutan dan bukit sehingga jalan-jalan dan desa-desa di Israel menjadi sepi. Selain itu, hanya sedikit orang Israel yang punya senjata untuk melindungi diri."],["p","Pada waktu itu, ada seorang wanita yang berani bernama Debora. Dia melayani sebagai nabiah, dan dia juga menyampaikan penghakiman dari Yehuwa untuk kasus-kasus sulit yang dibawa orang Israel kepadanya. Debora memberi tahu seorang pria bernama Barak bahwa Yehuwa sudah mengangkat Barak sebagai hakim dan penyelamat umat-Nya. Bayangkan betapa kagetnya Barak saat mendengar petunjuk yang Yehuwa sampaikan melalui Debora: Dia harus mengumpulkan pasukan sebanyak 10.000 pria dan membawa mereka ke Gunung Tabor. Yehuwa akan memberi dia kemenangan atas Sisera dan pasukannya!"],["p","Apakah Barak sombong? Apakah dia tersinggung karena mendapat perintah melalui seorang wanita? Tidak. Dia malah mengatakan bahwa dia akan pergi hanya kalau Debora ikut dengannya. Ini tidak berarti Barak kurang beriman. Rasul Paulus belakangan menyebutkan nama Barak juga dalam daftar orang-orang yang sangat beriman. ( Ibr. 11:​1, 2, 32 ) Dengan meminta Debora untuk ikut, Barak justru menunjukkan bahwa dia beriman. Dia tahu bahwa Debora adalah nabiah, dan dia ingin mendapat sebanyak mungkin petunjuk Yehuwa. Bagaimana tanggapan Debora? Dia dengan berani berkata, ”Saya pasti ikut.” Dia juga memberi tahu Barak bahwa meskipun Barak akan memenangkan pertempuran itu, bukan Barak atau pria lainnya yang akan membunuh Sisera. Allah akan memberikan tugas itu kepada seorang wanita."],["p","Barak langsung bertindak. Dia mulai mengumpulkan 10.000 pria yang berani dan mempersiapkan mereka sebisa-bisanya untuk berperang. Lalu, dia membawa pasukannya ke puncak Gunung Tabor. Gunung yang megah itu terletak di dataran Lembah Yizreel. Tingginya hampir 600 meter, dan bentuknya seperti kerucut yang bagian atasnya terpotong. Dari puncak gunung, Debora, Barak, dan pasukan Israel bisa melihat pasukan Sisera dan kereta-kereta perangnya maju ke arah mereka."],["p","Apa yang Barak lakukan? Kebanyakan panglima mungkin akan menunggu pasukan Sisera sampai di lereng Gunung Tabor. Di lereng yang miring, kereta perang musuh pasti akan melambat sehingga menguntungkan pasukan Barak. Tapi, Barak tahu bahwa ini adalah pertempuran Yehuwa, bukan pertempurannya sendiri. Barak pun mendengarkan Debora. Melalui Debora, Yehuwa menyuruh Barak untuk langsung menyerang pasukan Sisera! Dengan berani, Barak dan pasukannya turun ke dataran lembah untuk menghadapi kereta-kereta perang yang mengerikan itu!"],["p","Seorang hakim dan seorang nabiah harus menghadapi panglima yang keji dan kereta-kereta perangnya yang menakutkan"],["p","Dari sudut pandang militer, pasukan Israel tidak mungkin bisa menang. Tapi, Yehuwa melihat keberanian mereka, dan Dia pun turun tangan. Dia mengacaukan pasukan Kanaan dan menurunkan hujan yang sangat deras. Lembah itu pun menjadi seperti rawa, dan kereta perang musuh terjebak lumpur. Para prajurit Sisera tidak punya pilihan dan harus turun untuk berhadapan langsung dengan para pejuang Israel. Hasilnya, tidak satu pun prajurit Sisera selamat. Bagaimana dengan Sisera sendiri?"],["p","Sisera melarikan diri dari pertempuran. Dia tega meninggalkan pasukannya dan membiarkan mereka tewas. Dengan susah payah, dia melewati dataran yang berlumpur itu dan naik ke daerah yang lebih tinggi. Tapi ternyata, Barak mengejarnya. Sementara itu, Yehuwa memperhatikan semua yang terjadi. Apakah Dia akan membiarkan Sisera lolos?"],["h","Baca kisahnya di:"],["p","Hakim 4:​1-16, 23, 24; 5:​1-23"],["h","Untuk dibahas:"],["p","Bagaimana Barak dan Debora bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Kira-kira seperti apa kehidupan orang Israel selama dikuasai oleh Sisera? ( w15 1/8 12 ¶6 )"],["p","2. Kenapa kita tidak menganggap Debora sama seperti ke-12 hakim yang melayani di Israel sebelum zaman Samuel? ( w86 1/6 31 ¶6-8- wcgr )"],["p","3. Kenapa Debora menyebut dirinya ”ibu di Israel”? ( Hak. 4:​4, 5; 5:7 ; w15 1/8 13 ¶1 ) Gambar A"],["p","Gambar A"],["p","4. Apa maksudnya waktu Debora dan Barak bernyanyi, ”Bintang-bintang berperang . . . melawan Sisera”? ( Hak. 5:20 ; w05 15/1 25 ¶4 )"],["h","Pikirkan Pelajarannya"],["p","Barak dengan rendah hati mau menerima bantuan Debora. Dalam situasi apa saja seorang saudara bisa meniru Barak? Gambar B"],["p","Gambar B"],["p","Kenapa Debora butuh keberanian untuk ikut dengan Barak? Dalam situasi apa kita perlu berani seperti Debora?"],["p","Dengan cara apa lagi Saudara bisa meniru keberanian Barak dan Debora?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Barak dan Debora setelah mereka dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Perhatikan bagaimana kisah Barak dan Debora meyakinkan kita bahwa Yehuwa menghargai upaya kita untuk melayani-Nya."],["p","”Buatlah Yehuwa Senang dengan Merelakan Diri!” ( w17.04 28-32)"],["p","Apa yang bisa kita pelajari dari Barak dan Debora tentang iman, ketaatan, dan sikap sadar diri?"],["p","”Dengan Iman, Barak Mengacaubalaukan Bala Tentara yang Perkasa” ( w03 15/11 28-31)"]]},"r40":{"j":"a","jd":"Ratapan","sub":"Ratapan 2:11","isi":[[11,"Mataku lelah karena terus mencucurkan air mata.  Perasaanku kacau balau.  Hatiku hancur karena kejatuhan putri bangsaku.  Sebab anak-anak kecil dan bayi-bayi pingsan di lapangan-lapangan kota. "]]},"r41":{"j":"a","jd":"Ratapan","sub":"Ratapan 2:19","isi":[[19,"Bangunlah! Berserulah pada malam hari, pada awal giliran jaga. Curahkan isi hatimu
