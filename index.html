/* ---------- bagi tugas siswa/asisten untuk seluruh periode ---------- */
function bagiTugas(){
  const orang = daftarSiswa().filter((o) => o.r !== 0);
  if (!orang.length){ alert("Daftar nama masih kosong."); return; }

  const kunci = (o) => normNama(o.n);
  const beban = new Map();        // jumlah giliran siswa/asisten (termasuk yang sudah ada)
  const terakhir = new Map();     // pekan terakhir dapat giliran
  const pakaiMinggu = new Map();  // pekan -> nama yang sudah dipakai di pekan itu
  const tanpaGender = new Set();

  const tandai = (wi, teks, hitung) => {
    const o = cariOrang(teks);
    if (!o) return;
    const k = kunci(o);
    if (!pakaiMinggu.has(wi)) pakaiMinggu.set(wi, new Set());
    pakaiMinggu.get(wi).add(k);
    if (hitung){
      beban.set(k, (beban.get(k) || 0) + 1);
      terakhir.set(k, wi);
    }
  };
  const kosong = (v) => !v || v === "\u2014" || /^menyusul$/i.test(String(v).trim());
  const duaSlotDari = (b) => String(b.nilai || "").indexOf("/") >= 0;
  const nilaiSlot = (wi, b, i) => {
    const simpan = namaTersimpan("w" + (wi + 1), String(parseInt(b.nomor, 10)), "s" + i);
    const pisah = String(b.nilai || "").split("/").map((t) => t.trim());
    return simpan != null ? simpan : (pisah[i] || "");
  };

  // 1) hitung pemakaian yang sudah ada
  JADWAL.forEach((d, wi) => {
    d.baris.forEach((b) => {
      if (!b.nomor){ if (b.doa) tandai(wi, b.doa, false); return; }
      const siswaSlot = !!(b.siswa && /siswa/i.test(b.siswa));
      const jml = siswaSlot && duaSlotDari(b) ? 2 : 1;
      for (let i = 0; i < jml; i++){
        const v = nilaiSlot(wi, b, i);
        if (!kosong(v)) tandai(wi, v, siswaSlot);
      }
      if (!siswaSlot && b.nilai) tandai(wi, String(b.nilai).split("/")[0], false);
    });
    if (d.ketua) tandai(wi, d.ketua, false);
  });

  // 2) isi slot yang masih kosong
  let terisi = 0, gagal = 0, dipaksa = 0;
  JADWAL.forEach((d, wi) => {
    if (/tidak ada perhimpunan|kebaktian|pertemuan wilayah|cancel|dibatalkan/i.test(d.catatan || "")) return;
    d.baris.forEach((b) => {
      if (!b.nomor || !b.siswa || !/siswa/i.test(b.siswa)) return;
      const jml = duaSlotDari(b) ? 2 : 1;
      const isi = [];
      for (let i = 0; i < jml; i++){
        const v = nilaiSlot(wi, b, i);
        isi.push(kosong(v) ? null : v);
      }
      if (isi.indexOf(null) < 0) return;
      let gender = "";
      isi.forEach((v) => { if (v){ const o = cariOrang(v); if (o && o.g) gender = o.g; } });
      for (let i = 0; i < jml; i++){
        if (isi[i]) continue;
        const pakai = pakaiMinggu.get(wi) || new Set();
        let calon = orang.filter((o) => o.g && (!gender || o.g === gender) && !pakai.has(kunci(o)));
        if (!calon.length){
          orang.filter((o) => !o.g).forEach((o) => tanpaGender.add(o.n));
          gagal++;
          continue;
        }
        /* jeda: setelah dapat tugas, tunggu JEDA_PEKAN pekan (dihitung per pekan) */
        const jeda = (o) => {
          const t = terakhir.get(kunci(o));
          return t == null ? 999 : wi - t;
        };
        const siapJeda = calon.filter((o) => jeda(o) >= JEDA_PEKAN);
        if (siapJeda.length){
          calon = siapJeda;
        } else {
          dipaksa++;
        }
        const bebanlah = (o) => beban.get(kunci(o)) || 0;
        const akhirnya = (o) => (terakhir.get(kunci(o)) == null ? -1 : terakhir.get(kunci(o)));
        calon.sort((a, c) => (bebanlah(a) - bebanlah(c)) || (jeda(c) - jeda(a))
          || (akhirnya(a) - akhirnya(c)) || a.n.localeCompare(c.n));
        const pilih = calon[0];
        simpanNama("w" + (wi + 1), String(parseInt(b.nomor, 10)), "s" + i, pilih.n);
        isi[i] = pilih.n;
        if (!gender) gender = pilih.g;
        beban.set(kunci(pilih), bebanlah(pilih) + 1);
        terakhir.set(kunci(pilih), wi);
        if (!pakaiMinggu.has(wi)) pakaiMinggu.set(wi, new Set());
        pakaiMinggu.get(wi).add(kunci(pilih));
        terisi++;
      }
    });
  });

  if (typeof tampilkanPekan === "function" && typeof pekanAktif === "number") tampilkanPekan(pekanAktif, false);
  const catatan = tanpaGender.size
    ? "\n\nBelum bisa dipasangkan karena jenis kelaminnya belum diisi: " + Array.from(tanpaGender).join(", ") + "."
    : "";
  const catatanJeda = dipaksa
    ? "\n" + dipaksa + " slot terpaksa diisi sebelum jeda " + JEDA_PEKAN + " pekan selesai (kandidat sudah habis)."
    : "";
  alert("Selesai.\n" + terisi + " slot siswa/asisten terisi, " + gagal + " slot belum dapat pasangan."
    + catatanJeda + catatan);
}

/* ---------- pilihan nama: daftar drop-down + kelola daftar ---------- */
(function(){
  let pop = null, aktif = null, sorot = -1, waktuBuka = 0;

  function tutup(){
    if (pop) pop.remove();
    pop = null; sorot = -1;
    if (aktif){ aktif.setAttribute("aria-expanded", "false"); aktif = null; }
  }

  function pakai(trig, nama){
    trig.dataset.nilai = nama;
    const lihat = nama ? tampilNama(nama, trig.dataset.semi === "1") : "\u2014";
    const t = trig.querySelector(".pn-teks");
    t.textContent = lihat;
    t.classList.toggle("pn-kosong", !nama);
    simpanNama(trig.dataset.w, trig.dataset.no, trig.dataset.slot, nama);
  }

  function letakkan(trig){
    const r = trig.getBoundingClientRect();
    const w = pop.offsetWidth, h = pop.offsetHeight;
    let kiri = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
    let atas = r.bottom + 4;
    if (atas + h > window.innerHeight - 8) atas = Math.max(8, r.top - h - 4);
    pop.style.left = kiri + "px";
    pop.style.top = atas + "px";
  }

  let saringSiap = false;

  /* status jeda tiap orang, dihitung dari pekan yang sedang dibuka */
  function petaTugas(){
    const peta = new Map();
    if (typeof dataHadirin === "function"){
      dataHadirin().forEach((it) => peta.set(normNama(it.o.n), it));
    }
    return peta;
  }
  function statusOrang(it){
    if (!it || it.terakhir == null) return { teks: "belum pernah", kelas: "siap", siap: true };
    if (it.terakhir > pekanAktif) return { teks: "terjadwal", kelas: "tunggu", siap: false };
    const sisa = JEDA_PEKAN - (pekanAktif - it.terakhir);
    return sisa > 0
      ? { teks: "sisa " + sisa + " pekan", kelas: "tunggu", siap: false }
      : { teks: "siap", kelas: "siap", siap: true };
  }

  function daftarOpsi(){
    const info = petaTugas();
    const arr = daftarNama().slice();
    arr.sort((a, b) => a.n.localeCompare(b.n, "id"));
    let html = "";
    let no = 0;
    let jumlahSiap = 0;
    arr.forEach((o) => {
      const org = cariOrang(o.n);
      const g = org && org.g ? org.g : "";
      const st = statusOrang(info.get(normNama(o.n)));
      if (st.siap) jumlahSiap += 1;
      if (saringSiap && !st.siap) return;
      no += 1;
      html += `<button type="button" class="pn-opsi" data-n="${encodeURIComponent(o.n)}">`
        + `<span class="pn-no">${no}</span>`
        + `<span class="pn-nama g${g || "x"}">${esc(o.n)}</span>`
        + `<span class="pn-ini">${esc(o.i || "")}</span>`
        + `<span class="pn-st ${st.kelas}">${esc(st.teks)}</span>`
        + `<span class="pn-cek"></span>`
        + `</button>`;
    });
    daftarOpsi.jumlahSiap = jumlahSiap;
    const kepala = '<div class="pn-th"><span>No</span><span>Nama</span><span>Ini</span>'
      + '<span>Status</span><span></span></div>';
    return jumlahSiap || !saringSiap
      ? kepala + html
      : kepala + '<div class="pn-kosong2">Tidak ada yang siap di pekan ini.</div>';
  }

  function gambar(trig, awal){
    pop.innerHTML =
      '<div class="pn-kepala"><span class="pn-judul">Pilih nama</span>'
      + '<span class="pn-saring">'
      + '<button type="button" class="pn-sbtn" data-siap="0">Semua</button>'
      + '<button type="button" class="pn-sbtn" data-siap="1">Siap tugas</button>'
      + '</span></div>'
      + `<div class="pn-daftar" role="listbox">${daftarOpsi()}</div>`
      + '<div class="pn-kaki"><button type="button" class="pn-tambah">+ Nama baru&hellip;</button></div>';
    const daftar = pop.querySelector(".pn-daftar");

    const tandaSaring = () => {
      pop.querySelectorAll(".pn-sbtn").forEach((b) => {
        const on = (b.dataset.siap === "1") === saringSiap;
        b.classList.toggle("on", on);
      });
      const bs = pop.querySelector('.pn-sbtn[data-siap="1"]');
      if (bs) bs.textContent = "Siap (" + (daftarOpsi.jumlahSiap || 0) + ")";
    };
    tandaSaring();
    pop.querySelectorAll(".pn-sbtn").forEach((b) => {
      b.addEventListener("click", (ev) => {
        ev.stopPropagation();
        saringSiap = b.dataset.siap === "1";
        daftar.innerHTML = daftarOpsi();
        tandaSaring();
        daftar.scrollTop = 0;
      });
    });
    const terpilih = Array.from(daftar.querySelectorAll(".pn-opsi"))
      .find((o) => decodeURIComponent(o.dataset.n) === awal);
    if (terpilih){
      terpilih.classList.add("terpilih");
      terpilih.scrollIntoView({ block: "center" });
    }
    daftar.addEventListener("click", (ev) => {
      const b = ev.target.closest(".pn-opsi");
      if (!b) return;
      pakai(trig, decodeURIComponent(b.dataset.n));
      tutup();
    });
    pop.querySelector(".pn-tambah").addEventListener("click", (ev) => {
      ev.stopPropagation();
      formBaru(trig);
    });
  }

  function formBaru(trig){
    pop.innerHTML = '<div class="pn-kepala">Nama baru</div>'
      + '<div class="pn-baru"><input class="pn-input" type="text" placeholder="Ketik nama&hellip;" aria-label="Nama baru">'
      + '<button type="button" class="pn-simpan">Simpan</button></div>'
      + '<div class="pn-kaki"><button type="button" class="pn-batal">Batal</button></div>';
    const inp = pop.querySelector(".pn-input");
    inp.focus();
    const simpan = () => {
      const v = inp.value.trim();
      if (!v) return;
      const arr = daftarSiswa();
      if (arr.indexOf(v) < 0){ arr.push(v); simpanDaftarSiswa(arr); }
      if (trig) pakai(trig, v);
      tutup();
    };
    pop.querySelector(".pn-simpan").addEventListener("click", simpan);
    pop.querySelector(".pn-batal").addEventListener("click", () => { if (trig) buka(trig); else tutup(); });
    inp.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter"){ ev.preventDefault(); simpan(); }
      if (ev.key === "Escape"){ ev.preventDefault(); tutup(); }
    });
    letakkan(trig);
  }

  function buka(trig){
    tutup();
    aktif = trig;
    waktuBuka = Date.now();
    trig.setAttribute("aria-expanded", "true");
    pop = document.createElement("div");
    pop.className = "pn-pop";
    pop.tabIndex = -1;
    document.body.appendChild(pop);
    gambar(trig, trig.dataset.nilai || "");
    letakkan(trig);
    pop.focus();
  }

  // ketik huruf = lompat ke nama berawalan huruf itu
  document.addEventListener("keydown", (ev) => {
    if (!pop) return;
    if (ev.key === "Escape"){ tutup(); return; }
    const trig = aktif;
    if (!trig) return;
    const opsi = Array.from(pop.querySelectorAll(".pn-opsi"));
    if (!opsi.length) return;
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
      ev.preventDefault();
      if (!opsi.length) return;
      sorot = ev.key === "ArrowDown"
        ? (sorot + 1) % opsi.length
        : (sorot - 1 + opsi.length) % opsi.length;
      opsi.forEach((o, k) => o.classList.toggle("sorot", k === sorot));
      opsi[sorot].scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter"){
      if (sorot >= 0){ ev.preventDefault(); pakai(trig, decodeURIComponent(opsi[sorot].dataset.n)); tutup(); }
    } else if (/^[a-zA-Z0-9]$/.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey){
      const c = ev.key.toUpperCase();
      const target = opsi.find((o) => decodeURIComponent(o.dataset.n).toUpperCase().startsWith(c));
      if (target){
        const i = opsi.indexOf(target);
        sorot = i;
        opsi.forEach((o, k) => o.classList.toggle("sorot", k === i));
        target.scrollIntoView({ block: "nearest" });
      }
    }
  }, true);

  document.addEventListener("click", (ev) => {
    const trig = ev.target.closest ? ev.target.closest(".pilih-nama") : null;
    if (trig){
      ev.preventDefault();
      if (aktif === trig) tutup(); else buka(trig);
      return;
    }
    const jalur = ev.composedPath ? ev.composedPath() : [];
    const dalamPop = pop && (jalur.indexOf(pop) >= 0 || pop.contains(ev.target));
    if (pop && !dalamPop) tutup();
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape"){ tutup(); return; }
    const trig = ev.target.closest ? ev.target.closest(".pilih-nama") : null;
    if (trig && (ev.key === "Enter" || ev.key === " ")){
      ev.preventDefault(); buka(trig);
    }
  });

  window.addEventListener("resize", tutup);
  window.addEventListener("scroll", () => {
    if (!pop) return;
    if (Date.now() - waktuBuka < 300) return;   // abaikan gulir akibat klik/auto-scroll
    if (aktif) letakkan(aktif);
  }, true);

  /* ---------- kelola daftar nama ---------- */
  function renderEditor(kotak, arr){
    const isi = arr.map((o, i) => {
      const g = (o.g === "L" || o.g === "P") ? o.g : "";
      const rotasi = o.r !== 0;
      return `<div class="ed-baris${o.baru ? " baru" : ""}" data-i="${i}"${o.baru ? ' title="Dari jadwal, belum ada di daftar"' : ""}>`
      + `<input class="ed-input ed-nama" type="text" value="${esc(o.n)}" placeholder="Nama" aria-label="Nama ${i + 1}">`
      + `<input class="ed-input ed-ini" type="text" value="${esc(o.i)}" placeholder="Ini" aria-label="Inisial ${i + 1}">`
      + `<button type="button" class="ed-g g-${g || "x"}" title="Jenis kelamin (klik untuk ganti): ${g === "L" ? "Laki-laki" : g === "P" ? "Perempuan" : "belum diisi"}">${g || "?"}</button>`
      + `<button type="button" class="ed-r${rotasi ? "" : " mati"}" title="${rotasi ? "Ikut rotasi siswa/asisten" : "Tidak ikut rotasi"}">${rotasi ? "&#10003;" : "&ndash;"}</button>`
      + `<button type="button" class="ed-hapus" title="Hapus nama">&times;</button></div>`;
    }).join("");
    kotak.innerHTML = isi || '<div class="ed-kosong">Daftar masih kosong.</div>';
  }

  function bukaEditor(){
    tutup();
    const belum = namaBelumCocok();
    const perluNama = belum.filter((v) => /[a-z]/.test(v));
    const hanyaInisial = belum.filter((v) => !/[a-z]/.test(v));
    let kerja = perluNama
      .map((v) => ({ n: v, i: bikinInisial(v), g: "", r: 1, baru: true }))
      .concat(daftarSiswa().map((o) => ({ n: o.n, i: o.i, g: o.g || "", r: o.r === 0 ? 0 : 1 })));
    const tirai = document.createElement("div");
    tirai.className = "modal-tirai";
    tirai.innerHTML = '<div class="modal-kotak" role="dialog" aria-modal="true" aria-label="Kelola daftar nama">'
      + '<div class="modal-kepala"><span>Daftar nama &amp; inisial</span>'
      + '<button type="button" class="modal-x" title="Tutup">&times;</button></div>'
      + '<div class="modal-isi">'
      + '<div class="ed-tambah">'
      + '<input class="ed-input baru-nama" type="text" placeholder="Nama lengkap&hellip;" aria-label="Nama baru">'
      + '<input class="ed-input baru-ini" type="text" placeholder="Ini" aria-label="Inisial baru">'
      + '<button type="button" class="ed-tambah-btn">Tambah</button></div>'
      + '<div class="ed-legenda" hidden></div>'
      + '<div class="ed-kepala-kolom"><span>Nama</span><span>Inisial</span><span>L/P</span><span>Rot</span><span></span></div>'
      + '<div class="ed-daftar"></div></div>'
      + '<div class="modal-kaki"><button type="button" class="ed-reset">Kembalikan daftar awal</button>'
      + '<span class="kaki-kanan">'
      + '<button type="button" class="ed-batal">Batal</button>'
      + '<button type="button" class="ed-simpan">Simpan</button></span></div></div>';
    document.body.appendChild(tirai);
    const kotak = tirai.querySelector(".ed-daftar");
    const legenda = tirai.querySelector(".ed-legenda");
    let pesan = "";
    if (perluNama.length){
      pesan += "Baris kuning berasal dari jadwal dan belum ada di daftar. "
        + "Lengkapi nama lengkapnya, lalu tekan Simpan.";
    }
    if (hanyaInisial.length){
      pesan += (pesan ? " " : "") + "Masih berupa inisial, belum ada nama lengkapnya: "
        + hanyaInisial.join(", ") + ".";
    }
    if (pesan){ legenda.textContent = pesan; legenda.hidden = false; }
    const segarkan = () => renderEditor(kotak, kerja);
    segarkan();

    // setiap ketikan masuk ke salinan kerja (belum disimpan)
    tirai.addEventListener("input", (ev) => {
      const b = ev.target.closest(".ed-baris");
      if (!b) return;
      const i = Number(b.dataset.i);
      if (ev.target.classList.contains("ed-nama")) kerja[i].n = ev.target.value;
      if (ev.target.classList.contains("ed-ini")) kerja[i].i = ev.target.value;
    });

    tirai.addEventListener("click", (ev) => {
      const gantiG = ev.target.closest(".ed-g");
      if (gantiG){
        const i = Number(gantiG.closest(".ed-baris").dataset.i);
        const urut = ["", "L", "P"];
        kerja[i].g = urut[(urut.indexOf(kerja[i].g || "") + 1) % 3];
        const pos = kotak.scrollTop;
        segarkan();
        kotak.scrollTop = pos;
        return;
      }
      const gantiR = ev.target.closest(".ed-r");
      if (gantiR){
        const i = Number(gantiR.closest(".ed-baris").dataset.i);
        kerja[i].r = kerja[i].r === 0 ? 1 : 0;
        const pos = kotak.scrollTop;
        segarkan();
        kotak.scrollTop = pos;
        return;
      }
      const hapus = ev.target.closest(".ed-hapus");
      if (hapus){
        kerja.splice(Number(hapus.closest(".ed-baris").dataset.i), 1);
        segarkan();
        return;
      }
      if (ev.target.closest(".ed-tambah-btn")){
        const inN = tirai.querySelector(".baru-nama");
        const inI = tirai.querySelector(".baru-ini");
        const n = inN.value.trim();
        if (!n) { inN.focus(); return; }
        kerja.push({ n: n, i: (inI.value.trim() || bikinInisial(n)).toUpperCase(), g: "", r: 1 });
        inN.value = ""; inI.value = "";
        segarkan();
        kotak.scrollTop = kotak.scrollHeight;
        inN.focus();
        return;
      }
      if (ev.target.closest(".ed-reset")){
        kerja = DAFTAR_SISWA_BAWAAN.map((o) => ({ n: o.n, i: o.i, g: o.g || "", r: o.r === 0 ? 0 : 1 }));
        segarkan();
        return;
      }
      if (ev.target.closest(".ed-simpan")){
        const bersih = kerja
          .map((o) => ({
            n: String(o.n || "").trim(),
            i: String(o.i || "").trim().toUpperCase(),
            g: (o.g === "L" || o.g === "P") ? o.g : "",
            r: o.r === 0 ? 0 : 1
          }))
          .filter((o) => o.n)
          .map((o) => ({ n: o.n, i: o.i || bikinInisial(o.n), g: o.g, r: o.r }));
        simpanDaftarSiswa(bersih);
        tirai.remove();
        if (typeof tampilkanPekan === "function" && typeof pekanAktif === "number") tampilkanPekan(pekanAktif, false);
        return;
      }
      if (ev.target.closest(".ed-batal") || ev.target.closest(".modal-x") || ev.target === tirai){
        tirai.remove();
      }
    });

    tirai.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape"){ tirai.remove(); return; }
      if (ev.key === "Enter" && ev.target.classList.contains("baru-nama")){
        ev.preventDefault();
        tirai.querySelector(".ed-tambah-btn").click();
      }
    });
    setTimeout(() => { const i = tirai.querySelector(".baru-nama"); if (i) i.focus(); }, 0);
  }

  window.bukaDaftarNama = bukaEditor;
})();

document.addEventListener("click", (ev) => {
  if (ev.target.closest && ev.target.closest("#btnAdmin")){
    ev.preventDefault();
    if (typeof bukaPin === "function") bukaPin();
    return;
  }
  if (ev.target.closest && ev.target.closest("#btnKeluar")){
    ev.preventDefault();
    setAdmin(false);
    return;
  }
  if (ev.target.closest && ev.target.closest("#btnHadirin")){
    ev.preventDefault();
    if (typeof bukaHadirin === "function") bukaHadirin();
    return;
  }
  if (ev.target.closest && ev.target.closest("#btnTugas")){
    ev.preventDefault();
    if (typeof bagiTugas === "function") bagiTugas();
    return;
  }
  if (ev.target.closest && ev.target.closest("#btnDaftar")){
    ev.preventDefault();
    if (window.bukaDaftarNama) window.bukaDaftarNama();
  }
});
</script>

<script>
/* ============ spoiler: tema sesi + isi setiap link (show/hide) ============ */
(function(){
  const e = (t) => String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  let urut = 0;

  // satu blok teks; link biru dibuat + kotak spoiler kosong sesudahnya
  function blok(bl){
    let html = "", spoiler = "";
    const link = [];
    bl.s.forEach((sg) => {
      if (sg.r){
        const id = "sp" + (++urut);
        link.push({ id: id, r: sg.r });
        html += `<a class="tautan-wol" data-sp="${id}" role="button" tabindex="0">${e(sg.l)}</a>`;
      } else {
        html += e(sg.t);
      }
    });
    link.forEach((l) => { spoiler += `<div class="spoiler" id="${l.id}" data-r="${l.r}" hidden></div>`; });
    return { html: html, spoiler: spoiler };
  }

  function isiTema(w, no){
    const p = WOL.pekan[w] && WOL.pekan[w].bagian[no];
    if (!p) return "<p>Tema belum tersedia.</p>";
    let out = "";
    p.isi.forEach((bl) => {
      if (bl.t === "p" || bl.t === "li"){
        const b = blok(bl);
        out += (bl.t === "p" ? `<p>${b.html}</p>` : `<p class="butir">${b.html}</p>`) + b.spoiler;
      }
    });
    return out;
  }

  function isiRef(rid){
    const r = WOL.ref[rid];
    if (!r) return `<p>Isi referensi tidak tersedia.</p>`;
    if (r.j === "a"){
      return `<div class="judul-spoiler">${e(r.sub || r.jd)}</div>` +
        r.isi.map(([n, t]) => `<p class="ayat"><b>${n}</b> ${e(t)}</p>`).join("");
    }
    const judul = e(r.jd) + (r.sub ? ` <span style="font-weight:400">— ${e(r.sub)}</span>` : "");
    return `<div class="judul-spoiler">${judul}</div>` +
      r.isi.map(([k, t]) => k === "h" ? `<p><strong>${e(t)}</strong></p>` : `<p>${e(t)}</p>`).join("");
  }

  function bukaTema(tombol){
    const baris = tombol.closest(".baris");
    const tema = baris && baris.nextElementSibling;
    if (!tema || !tema.classList.contains("tema")) return;
    const akanBuka = tema.hidden;
    if (akanBuka && !tema.dataset.siap){
      tema.innerHTML = isiTema(tema.dataset.w, tema.dataset.tema);
      tema.dataset.siap = "1";
    }
    tema.hidden = !akanBuka;
    tombol.setAttribute("aria-expanded", akanBuka ? "true" : "false");
  }

  function isiLagu(no){
    const l = (typeof LAGU !== "undefined") ? LAGU[no] : null;
    if (!l || !l.isi || !l.isi.length) return "<p>Lirik belum tersedia.</p>";
    const judul = `<div class="judul-spoiler">Nyanyian ${e(no)} &mdash; ${e(l.jd)}</div>`;
    const ay = l.ay ? `<p class="lagu-ayat-alkitab">(${e(l.ay)})</p>` : "";
    const bait = l.isi.map((brs) => `<div class="lagu-bait">` + brs.map(([k, t]) =>
      `<p class="lr ${e(k)}">${e(t)}</p>`).join("") + `</div>`).join("");
    return judul + ay + bait;
  }

  function bukaLagu(tautan){
    const baris = tautan.closest(".baris");
    const sp = baris && baris.nextElementSibling;
    if (!sp || !sp.classList.contains("lagu-sp")) return;
    document.querySelectorAll(".lagu-sp").forEach((lain) => { if (lain !== sp) lain.hidden = true; });
    if (!sp.dataset.siap){ sp.innerHTML = `<div class="spoiler">${isiLagu(sp.dataset.lagu)}</div>`; sp.dataset.siap = "1"; }
    sp.hidden = !sp.hidden;
    tautan.setAttribute("aria-expanded", sp.hidden ? "false" : "true");
  }

  function bukaSpoiler(tautan){
    const sp = document.getElementById(tautan.dataset.sp);
    if (!sp) return;
    // tutup dulu spoiler lain di tema yang sama: hanya yang diklik yang terbuka
    const tema = sp.closest(".tema");
    if (tema) tema.querySelectorAll(".spoiler").forEach((lain) => {
      if (lain !== sp) lain.hidden = true;
    });
    if (!sp.dataset.siap){
      sp.innerHTML = isiRef(sp.dataset.r);
      sp.dataset.siap = "1";
    }
    sp.hidden = !sp.hidden;
  }

  document.addEventListener("click", (ev) => {
    const tombol = ev.target.closest(".tema-tombol");
    if (tombol){ ev.preventDefault(); bukaTema(tombol); return; }
    const lagu = ev.target.closest(".tautan-lagu");
    if (lagu){ ev.preventDefault(); bukaLagu(lagu); return; }
    const tautan = ev.target.closest(".tautan-wol");
    if (tautan){ ev.preventDefault(); bukaSpoiler(tautan); }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter" && ev.key !== " ") return;
    const t = ev.target.closest(".tema-tombol, .tautan-wol, .tautan-lagu");
    if (t){ ev.preventDefault(); t.click(); }
  });
})();

</script>

<script>
window.TC = (function(){
var firebase = window.firebase;
var MAP = [
  "xrrxxxxxxxxrrx",   // 0: screens at 1,2 and 11,12
  "xsxxxxppxxxssx",   // 1: seat@1, podium@6-7, seats@11-12 (under screen R)
  "xxxxxxxxxxxxxq",   // 2: EXIT@13 (below podium, above row A)
  "sssxssssssxsss",   // 3: Row A
  "sssxssssssxsss",   // 4: Row B
  "sssxssssssxsss",   // 5: Row C
  "sssxssssssxsss",   // 6: Row D
  "sssxssssssxsss",   // 7: Row E
  "sssxssssssxsss",   // 8: Row F
  "sssxssssssxsss",   // 9: Row G
  "sssxssssssxsss",   // 10: Row H
  "sssxssssssxsss",   // 11: Row I
  "sssxssssssxsss",   // 12: Row J
  "sssxssssssxsss",   // 13: Row K
  "sssxssssssxsss",   // 14: Row L
  "xxxxxxxxxxxxxx",   // 15: corridor
  "xxxxxxxxxxxxxx",   // 16: corridor
  "qxxxxtxxtxvvvx",   // 17: EXIT@0, TATIB@5&8, AV@10-12 (doors replaced with x)
  "wwwwwwwwwwwwww",   // 18: wall
  "xsxsxpxxxxxxxx",   // 19: R2 front row + podium
  "sssssxxxxxxxxx",   // 20: R2-A
  "sssssxxxxxxxxx",   // 21: R2-B
  "sssssxxxxxxxxx",   // 22: R2-C
  "sssssxxxxxxxxx",   // 23: R2-D
  "sssssxxxxxxxxx"    // 24: R2-E
];
var ROWS = MAP.length, COLS = 14;
var STORAGE_KEY = 'cinema_venue_v14';
var reservations = {};
try { reservations = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}

// Firebase sync setup (optional - requires config in index.html)
var db = null;
var stateDocRef = null;
var usingFirebase = false;

try {
  if (typeof firebase !== 'undefined' && typeof firebase.firestore !== 'undefined' && typeof FIREBASE_CONFIG !== 'undefined' && FIREBASE_CONFIG.apiKey !== "PASTE_API_KEY") {
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    db = firebase.firestore();
    stateDocRef = db.collection('tangci').doc('state');
    usingFirebase = true;
  }
} catch(e) { console.warn('[Firebase] Not configured, using localStorage only.', e); }

// Load initial state (Firebase async or localStorage sync)
if (usingFirebase && stateDocRef) {
  stateDocRef.onSnapshot(function(doc) {
    if (doc.exists) {
      var data = doc.data();
      reservations = data.reservations || {};
      if (data.hiddenRows) {
        hiddenRows = new Set(data.hiddenRows);
      }
      render();
    }
  });
}


// ---- Podium popup sync: klik seat hijau di satu device → muncul popup kuning di semua device ----
var podiumPopupRef = null;
if (usingFirebase && db) {
  podiumPopupRef = db.collection('tangci').doc('podiumPopup');
  podiumPopupRef.onSnapshot(function(doc) {
    if (doc.exists && currentPOV === 'podium') {
      var d = doc.data();
      if (d && d.seatId && d.name) {
        showNamePopup(d.seatId, d.name);
      }
    }
  });
}

// Row visibility – A-L (map rows 3-14). hiddenRows is a Set of letters to HIDE.
var ALL_ROW_LETTERS = ['A','B','C','D','E','F','G','H','I','J','K','L'];
var HIDDEN_KEY = 'cinema_hidden_rows_v14';
var hiddenRows = new Set();
try {
  var stored = JSON.parse(localStorage.getItem(HIDDEN_KEY) || '[]');
  stored.forEach(function(l){ hiddenRows.add(l); });
} catch(e) {}

// Temp state while dropdown is open
var tempHidden = new Set();

var MERGE_GROUPS = [
  { row:0, minCol:1,  maxCol:2,  label:'SCREEN L', cls:'screen-block' },
  { row:0, minCol:11, maxCol:12, label:'SCREEN R', cls:'screen-block' },
  { row:1, minCol:6,  maxCol:7,  label:'PODIUM',   cls:'podium-block' }
];

var LABEL_COLS = [3, 10];

var currentPOV = 'av';
var currentSeat = null;
var floorEl = document.getElementById('floor');
var povTitle = document.getElementById('povTitle');
var navAvBtn = document.getElementById('navAvPov');
var navPodiumBtn = document.getElementById('navPodiumPov');
var modalOverlay = document.getElementById('modalOverlay');
var modalBox = document.getElementById('modalBox');
var nameInput = document.getElementById('nameInput');
var modalTitle = document.getElementById('modalTitle');
var clearBtnEl = document.getElementById('clearBtn');

function switchPOV(pov) {
  currentPOV = pov;
  var navResetBtn = document.getElementById('navResetBtn');
  var rowVisWrap = document.getElementById('rowVisWrap');
  if (pov === 'av') {
    povTitle.textContent = 'AV View';
    navAvBtn.style.background = '#1c2d48';
    navAvBtn.style.color = '#8fc8ff';
    navAvBtn.style.borderColor = '#2c4a78';
    navPodiumBtn.style.background = '#1d2331';
    navPodiumBtn.style.color = '#b9c2d5';
    navPodiumBtn.style.borderColor = '#2c3448';
    if (navResetBtn) navResetBtn.style.display = '';
    if (rowVisWrap) rowVisWrap.style.display = '';
  } else {
    povTitle.textContent = 'Podium View';
    navPodiumBtn.style.background = '#3b2336';
    navPodiumBtn.style.color = '#f5a9d0';
    navPodiumBtn.style.borderColor = '#5c3050';
    navAvBtn.style.background = '#1d2331';
    navAvBtn.style.color = '#b9c2d5';
    navAvBtn.style.borderColor = '#2c3448';
    if (navResetBtn) navResetBtn.style.display = 'none';
    if (rowVisWrap) rowVisWrap.style.display = 'none';
  }
  render();
}

function getMergeGroup(r, c) {
  for (var i = 0; i < MERGE_GROUPS.length; i++) {
    var g = MERGE_GROUPS[i];
    if (r === g.row && c >= g.minCol && c <= g.maxCol) return g;
  }
  return null;
}

function getCellInfo(r, origC) {
  // Row letters at aisle cols 3 and 10, rows 3-14
  if (r >= 3 && r <= 14 && LABEL_COLS.indexOf(origC) !== -1) {
    return { type: 'label', label: String.fromCharCode(65 + r - 3) };
  }

  var ch = MAP[r] ? MAP[r][origC] : null;
  if (!ch || ch === 'x') return { type: 'space' };
  if (ch === 'w') return { type: 'wall' };
  if (ch === 'q') return { type: 'static', cls: 'exit-q', label: 'EXIT' };
  if (ch === 'd') return { type: 'static', cls: 'door', label: 'DOOR' };

  var mg = getMergeGroup(r, origC);
  if (mg) return { type: 'merge', group: mg, isStart: origC === mg.minCol };

  // Row 1 seats: col 1 (under screen L, labeled "x"), cols 11-12 (under screen R, labeled 1,2)
  if (r === 1 && ch === 's') {
    if (origC === 1) {
      return { type: 'seat', id: 'TOP-L', label: 'x' };
    } else if (origC === 11 || origC === 12) {
      var pos = origC - 10;
      return { type: 'seat', id: 'TOP-R' + pos, label: String(pos) };
    }
  }

  // Main hall seats (rows 3-14)
  if (ch === 's' && r >= 3 && r <= 14) {
    var seatCols = [0,1,2,4,5,6,7,8,9,11,12,13];
    var idx = seatCols.indexOf(origC);
    if (idx !== -1) {
      var id = String.fromCharCode(65 + r - 3) + (idx + 1);
      return { type: 'seat', id: id, label: String(idx + 1) };
    }
  }

  // TATIB at row 17, cols 5 and 8
  if (ch === 't' && r === 17) {
    var tn = origC === 5 ? '1' : '2';
    return { type: 'seat', id: 'TATIB-' + tn, label: 'TATIB' };
  }
  // AV at row 17, cols 10, 11, 12
  if (ch === 'v' && r === 17) {
    var an = String(origC - 9);
    return { type: 'seat', id: 'AV-' + an, label: 'AV' };
  }

  // Second room front seats (row 19, cols 1 & 3)
  if (r === 19 && ch === 's' && (origC === 1 || origC === 3)) {
    var sid = origC === 1 ? 'R2-F1' : 'R2-F2';
    return { type: 'seat', id: sid, label: 'S' };
  }

  // Second room podium (row 19, col 5)
  if (r === 19 && ch === 'p' && origC === 5) {
    return { type: 'r2podium', id: 'R2-PODIUM', label: 'PDM' };
  }

  // Second room seats (rows 20-24, cols 0-4)
  if (ch === 's' && r >= 20 && r <= 24 && origC <= 4) {
    var rl = ['A','B','C','D','E'][r - 20];
    var rid = 'R2-' + rl + (origC + 1);
    return { type: 'seat', id: rid, label: String(origC + 1) };
  }

  return { type: 'space' };
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isRowHidden(r) {
  // Main hall rows: 3-14 map to A-L
  if (r >= 3 && r <= 14) {
    return hiddenRows.has(String.fromCharCode(65 + r - 3));
  }
  return false;
}

// ---- Row visibility UI ----
function toggleRowVis() {
  var dd = document.getElementById('rowVisDropdown');
  if (dd.classList.contains('open')) {
    dd.classList.remove('open');
  } else {
    // Load current hidden into temp
    tempHidden = new Set(hiddenRows);
    renderRowVisList();
    dd.classList.add('open');
  }
}

function closeRowVis(e) {
  if (e) e.stopPropagation();
  document.getElementById('rowVisDropdown').classList.remove('open');
}

function selectAllRows(e) {
  if (e) e.stopPropagation();
  tempHidden = new Set();
  renderRowVisList();
}

function toggleRowItem(letter, e) {
  if (e) e.stopPropagation();
  if (tempHidden.has(letter)) {
    tempHidden.delete(letter);
  } else {
    tempHidden.add(letter);
  }
  renderRowVisList();
}

function renderRowVisList() {
  var list = document.getElementById('rowVisList');
  list.innerHTML = '';
  ALL_ROW_LETTERS.forEach(function(letter) {
    var item = document.createElement('div');
    item.className = 'row-vis-item' + (tempHidden.has(letter) ? '' : ' checked');
    item.textContent = letter;
    item.onclick = function(e) { toggleRowItem(letter, e); };
    list.appendChild(item);
  });
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations)); } catch(e) {}
  try { localStorage.setItem(HIDDEN_KEY, JSON.stringify(Array.from(hiddenRows))); } catch(ex) {}
  if (usingFirebase && stateDocRef) {
    stateDocRef.set({
      reservations: reservations,
      hiddenRows: Array.from(hiddenRows)
    }).catch(function(err) { console.warn('[Firebase] Save error:', err); });
  }
}

function applyRowVis(e) {
  if (e) e.stopPropagation();
  hiddenRows = new Set(tempHidden);
  saveState();
  document.getElementById('rowVisDropdown').classList.remove('open');
  render();
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  var wrap = document.getElementById('rowVisBtn');
  var dd = document.getElementById('rowVisDropdown');
  if (dd && dd.classList.contains('open') && !dd.contains(e.target) && e.target !== wrap && !wrap.contains(e.target)) {
    dd.classList.remove('open');
  }
});

function render() {
  floorEl.innerHTML = '';
  var clickable = 0, reserved = 0;
  var isEditable = currentPOV === 'av';
  var isPodium = currentPOV === 'podium';
  var renderedMerges = {};
  var displayR = 0;

  for (var mapR = 0; mapR < ROWS; mapR++) {
    var r = isPodium ? (ROWS - 1 - mapR) : mapR;

    // Skip hidden rows (only main hall rows 3-14 can be hidden)
    if (isRowHidden(r)) continue;

    for (var displayC = 0; displayC < COLS; displayC++) {
      var origC = isPodium ? (COLS - 1 - displayC) : displayC;
      var info = getCellInfo(r, origC);

      if (info.type === 'merge') {
        var g = info.group;
        var mergeKey = g.row + '_' + g.minCol;
        if (!info.isStart) continue;
        if (renderedMerges[mergeKey]) continue;
        renderedMerges[mergeKey] = true;

        var startDC, span;
        if (isPodium) {
          startDC = COLS - 1 - g.maxCol;
          span = g.maxCol - g.minCol + 1;
        } else {
          startDC = g.minCol;
          span = g.maxCol - g.minCol + 1;
        }

        var el = document.createElement('div');
        el.className = 'cell merge ' + g.cls;
        el.style.gridColumn = (startDC + 1) + ' / ' + (startDC + 1 + span);
        el.style.gridRow = (displayR + 1) + ' / ' + (displayR + 2);
        el.style.width = 'auto';
        el.style.height = 'auto';
        el.textContent = g.label;
        floorEl.appendChild(el);
        continue;
      }

      var cell = document.createElement('div');
      cell.className = 'cell';

      if (info.type === 'seat') {
        clickable++;
        cell.classList.add('seat');
        if (!isEditable) cell.classList.add('readonly');
        var nm = reservations[info.id];
        if (nm) {
          reserved++;
          cell.classList.add('filled');
          // Dynamic font size to fit name on one line (optimized for 32px mobile cells)
          var nameLen = nm.length;
          var fontSize;
          if (nameLen <= 4) fontSize = 0.45;
          else if (nameLen <= 6) fontSize = 0.38;
          else if (nameLen <= 8) fontSize = 0.32;
          else if (nameLen <= 10) fontSize = 0.28;
          else if (nameLen <= 12) fontSize = 0.24;
          else fontSize = 0.20;
          cell.innerHTML = '<span class="nm" style="font-size:' + fontSize.toFixed(2) + 'rem">' + escHtml(nm) + '</span>';
          cell.title = info.id + ' – ' + nm;
          
          // In podium view, make filled seats clickable to show name
          if (!isEditable) {
            (function(sid, name) {
              cell.style.cursor = 'pointer';
              cell.onclick = function(e) {
                e.stopPropagation();
                // Sync ke Firestore: semua device podium view dapat popup
                if (podiumPopupRef) {
                  podiumPopupRef.set({ seatId: sid, name: name, ts: Date.now() }).catch(function(){});
                }
                showNamePopup(sid, name);
              };
            })(info.id, nm);
          }
        } else {
          cell.textContent = info.label;
          cell.title = info.id;
        }
        if (isEditable) {
          (function(sid) {
            cell.onclick = function(e) {
              e.stopPropagation();
              openModal(sid);
            };
          })(info.id);
        }
      } else if (info.type === 'label') {
        cell.classList.add('label-row');
        cell.textContent = info.label;
        cell.title = 'Row ' + info.label;
      } else if (info.type === 'static') {
        cell.classList.add(info.cls);
        cell.textContent = info.label;
      } else if (info.type === 'wall') {
        cell.classList.add('wall-row');
        var isDoorPos = (r === 18 && (origC === 6 || origC === 7));
        cell.innerHTML = '<div class="wall-line' + (isDoorPos ? ' door' : '') + '"></div>';
      } else if (info.type === 'r2podium') {
        cell.classList.add('r2-podium');
        cell.textContent = info.label;
        cell.title = info.id;
      } else {
        cell.classList.add('space');
      }

      floorEl.appendChild(cell);
    }
    displayR++;
  }
  document.getElementById('stats').textContent = reserved + ' Hadirin';
}

function openModal(id) {
  currentSeat = id;
  modalTitle.textContent = id;
  nameInput.value = reservations[id] || '';
  clearBtnEl.style.display = reservations[id] ? 'inline-block' : 'none';
  modalOverlay.style.display = 'flex';
  setTimeout(function() { nameInput.focus(); }, 100);
}

function doSave() {
  var sid = currentSeat;
  if (!sid) return;
  var v = nameInput.value.trim();
  if (v) {
    reservations[sid] = v;
  } else {
    delete reservations[sid];
  }
  saveState();
  modalOverlay.style.display = 'none';
  currentSeat = null;
  render();
}

function doCancel() {
  modalOverlay.style.display = 'none';
  currentSeat = null;
}

// Name popup for podium view - shows name in uppercase
function showNamePopup(id, name) {
  document.getElementById('namePopupText').textContent = name.toUpperCase();
  document.getElementById('namePopupSeatId').textContent = id;
  document.getElementById('namePopupOverlay').classList.add('open');
}

function closeNamePopup() {
  document.getElementById('namePopupOverlay').classList.remove('open');
}

function doClear() {
  if (currentSeat) {
    delete reservations[currentSeat];
    saveState();
    modalOverlay.style.display = 'none';
    currentSeat = null;
    render();
  }
}

function doReset() {
  var el = document.getElementById('resetConfirm');
  el.style.display = 'block';
}

function confirmReset() {
  reservations = {};
  hiddenRows = new Set();
  saveState();
  document.getElementById('resetConfirm').style.display = 'none';
  render();
}

function cancelReset() {
  document.getElementById('resetConfirm').style.display = 'none';
}

var fitted = false;
document.getElementById('fitBtn').onclick = function() {
  fitted = !fitted;
  var board = document.getElementById('board');
  var w = floorEl.scrollWidth;
  if (fitted) {
    var scale = Math.min(1, (board.clientWidth - 32) / w);
    floorEl.style.zoom = scale;
    board.style.overflow = 'hidden';
    document.body.style.overflowX = 'hidden';
    this.textContent = '100%';
  } else {
    floorEl.style.zoom = '';
    board.style.overflow = '';
    document.body.style.overflowX = '';
    this.textContent = 'Fit';
  }
};

var toastTimer;
function showToast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 1600);
}

render();



return { doReset: doReset, confirmReset: confirmReset, cancelReset: cancelReset,
  switchPOV: switchPOV, toggleRowVis: toggleRowVis, selectAllRows: selectAllRows,
  closeRowVis: closeRowVis, applyRowVis: applyRowVis, closeNamePopup: closeNamePopup,
  doClear: doClear, doCancel: doCancel, doSave: doSave, toggleRowItem: toggleRowItem,
  render: render, sesuaikan: function(){ render(); if (typeof showToast === 'function') showToast('Siap'); } };
})();
</script>

<script>
(function(){
  var body = document.body;
  var tirai = document.getElementById('tirai');
  var panel = document.getElementById('panelMenu');
  var judul = document.getElementById('judulAtas');

  var btnMenu = document.getElementById('btnMenu');
  function bukaMenu(){ panel.classList.add('buka'); tirai.classList.add('buka'); btnMenu.setAttribute('aria-expanded','true'); }
  function tutupMenu(){ panel.classList.remove('buka'); tirai.classList.remove('buka'); btnMenu.setAttribute('aria-expanded','false'); }

  function pilih(v, simpan){
    if (v !== 'hadirin') v = 'jadwal';
    document.getElementById('vJadwal').hidden = (v !== 'jadwal');
    document.getElementById('vHadirin').hidden = (v !== 'hadirin');
    body.classList.toggle('tema-hadirin', v === 'hadirin');
    document.querySelectorAll('.pm-item').forEach(function(b){
      b.classList.toggle('aktif', b.dataset.view === v);
    });
    judul.textContent = (v === 'hadirin') ? 'Hitung Hadirin' : 'Jadwal Tengah Pekan';
    tutupMenu();
    if (simpan){
      try { localStorage.setItem('jhtp-tampilan', v); } catch(e){}
      try { history.replaceState(null, '', '#' + v); } catch(e){}
    }
    if (v === 'hadirin' && window.TC && window.TC.sesuaikan) setTimeout(window.TC.sesuaikan, 80);
  }
  window.pilihTampilan = pilih;

  document.getElementById('btnMenu').addEventListener('click', function(e){
    e.stopPropagation(); bukaMenu();
  });
  tirai.addEventListener('click', tutupMenu);
  document.getElementById('btnTutupMenu').addEventListener('click', tutupMenu);
  document.querySelectorAll('.pm-item').forEach(function(b){
    b.addEventListener('click', function(){ pilih(b.dataset.view, true); });
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') tutupMenu(); });
  if (window.matchMedia) {
    var mm = window.matchMedia('print');
    if (mm.addEventListener) mm.addEventListener('change', function(e){ if (e.matches) tutupMenu(); });
  }

  var awal = (location.hash || '').replace('#','');
  if (!awal) { try { awal = localStorage.getItem('jhtp-tampilan') || 'jadwal'; } catch(e){ awal = 'jadwal'; } }
  pilih(awal, false);

  window.addEventListener('hashchange', function(){
    var v = (location.hash || '').replace('#','');
    if (v) pilih(v, false);
  });

  /* service worker (PWA bisa di-install) */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('[PWA] service worker gagal:', err);
      });
    });
  }
})();
</script>
<script>
/* ===== Sinkronisasi jadwal + daftar nama ke Firestore (project tangci) ===== */
(function(){
  function kabar(teks, ok){
    var el = document.getElementById('statusCloud');
    if (!el) return;
    el.textContent = teks;
    el.style.color = ok ? '#1f6b45' : '#8a5a12';
    el.style.fontWeight = '700';
  }
  if (typeof firebase === 'undefined' || typeof FIREBASE_CONFIG === 'undefined'){
    kabar('Tanpa internet \u00b7 data tersimpan di HP', false);
    return;
  }
  try { if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG); } catch(e){}
  var db;
  try { db = firebase.firestore(); } catch(e){ return; }
  var refTugas  = db.collection('jhtp').doc('tugas');
  var refDaftar = db.collection('jhtp').doc('daftar');
  var PREFIX = 'jhtp-nama:';
  var menunggu = Object.create(null);      // slot yang sedang dikirim dari HP ini
  var tungguDaftar = 0;

  function bacaLokal(){
    var map = {};
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf(PREFIX) === 0){
          var v = localStorage.getItem(k);
          if (v) map[k.slice(PREFIX.length)] = v;
        }
      }
    } catch(e){}
    return map;
  }

  /* satu slot = satu field, jadi dua HP menyimpan slot berbeda tidak saling menimpa */
  function kirimSatu(key, nilai){
    menunggu[key] = Date.now();
    var jalur = 'data.' + key;
    var isi = {};
    isi[jalur] = nilai ? String(nilai) : firebase.firestore.FieldValue.delete();
    refTugas.update(isi).catch(function(){
      var obj = {};
      if (nilai) obj[key] = String(nilai);
      refTugas.set({ data: obj, ts: Date.now() }, { merge: true })
        .catch(function(e){ console.warn('[jhtp] gagal simpan', e); });
    });
    setTimeout(function(){ delete menunggu[key]; }, 3000);
  }

  if (typeof simpanNama === 'function'){
    var simpanNamaAsli = simpanNama;
    window.simpanNama = function(w, no, slot, nilai){
      simpanNamaAsli(w, no, slot, nilai);
      kirimSatu(w + ':' + no + ':' + slot, nilai);
    };
  }
  if (typeof simpanDaftarSiswa === 'function'){
    var simpanDaftarAsli = simpanDaftarSiswa;
    window.simpanDaftarSiswa = function(arr){
      simpanDaftarAsli(arr);
      tungguDaftar = Date.now();
      refDaftar.set({ arr: arr, ts: Date.now() })
        .catch(function(err){ console.warn('[jhtp] gagal simpan daftar', err); });
    };
  }

  function gambarUlang(){
    if (typeof tampilkanPekan === 'function'){
      try { tampilkanPekan(pekanAktif, false); } catch(e){}
    }
  }

  refTugas.onSnapshot(function(doc){
    kabar('Cloud aktif \u00b7 data tersinkron', true);
    var d = doc.data() || {};
    var map = d.data || {};
    if (!doc.exists){
      var lokal = bacaLokal();                 // cloud masih kosong → unggah data HP ini
      if (Object.keys(lokal).length) refTugas.set({ data: lokal, ts: Date.now() }, { merge: true }).catch(function(){});
      return;
    }
    var lokal0 = bacaLokal();
    if (!Object.keys(map).length && Object.keys(lokal0).length){
      refTugas.set({ data: lokal0, ts: Date.now() }, { merge: true }).catch(function(){});
      return;
    }
    var ubah = false;
    Object.keys(map).forEach(function(k){
      if (menunggu[k]) return;
      var v = map[k];
      try {
        if (localStorage.getItem(PREFIX + k) !== v){ localStorage.setItem(PREFIX + k, v); ubah = true; }
      } catch(e){}
    });
    try {
      Object.keys(localStorage).filter(function(k){ return k.indexOf(PREFIX) === 0; })
        .forEach(function(k){
          var key = k.slice(PREFIX.length);
          if (menunggu[key]) return;
          if (!(key in map)){ localStorage.removeItem(k); ubah = true; }
        });
    } catch(e){}
    if (ubah) gambarUlang();
  }, function(err){
    console.warn('[jhtp] tugas offline', err);
    kabar('Cloud terkunci \u00b7 jalan dari data HP', false);
  });

  refDaftar.onSnapshot(function(doc){
    if (!doc.exists) return;
    if (Date.now() - tungguDaftar < 3000) return;      // baru saja kita kirim sendiri
    var d = doc.data() || {};
    if (!Array.isArray(d.arr) || !d.arr.length){
      var lokalArr = null;
      try { lokalArr = JSON.parse(localStorage.getItem('jhtp-daftar-siswa') || 'null'); } catch(e){}
      if (Array.isArray(lokalArr) && lokalArr.length){
        refDaftar.set({ arr: lokalArr, ts: Date.now() }).catch(function(){});
      }
      return;
    }
    try {
      if (localStorage.getItem('jhtp-daftar-siswa') === JSON.stringify(d.arr)) return;
      localStorage.setItem('jhtp-daftar-siswa', JSON.stringify(d.arr));
    } catch(e){ return; }
    gambarUlang();
  }, function(err){ console.warn('[jhtp] daftar offline', err); });
})();
</script>
