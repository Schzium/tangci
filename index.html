n 12 nomor 4","isi":[["p","Mrk. 10:​17-22"],["p","PELAJARAN 12"],["p","Prinsip: ”Minyak dan dupa membuat hati senang; begitu juga persahabatan manis yang terjalin karena nasihat yang tulus.”— Ams. 27:9 ."]]},"r100":{"j":"p","jd":"Dia Meminta Kekuatan di Saat Lemah","sub":"wcg bab 20","isi":[["p","20 SIMSON"],["p","SIMSON tidak bisa melihat apa-apa. Tapi, dia bisa mendengar ejekan dari kerumunan orang Filistin. Selain menertawakan dia, mereka juga pasti menghina Yehuwa, Allahnya. Kenapa itu bisa sampai terjadi? Simson dengan bodoh membocorkan rahasia kekuatannya, yang berasal dari Allah. Lalu, dia ditangkap, dibutakan, diikat, dipenjarakan, dan disuruh kerja paksa. Simson sadar bahwa dia sudah berbuat salah. Selama ini, dia adalah orang yang sangat berani. Tapi, apakah situasi yang dia hadapi sekarang membuat dia kehilangan keberanian?"],["p","Simson sudah menjadi hakim di Israel selama 20 tahun. Tapi, dia sangat berbeda dengan hakim-hakim pada umumnya. Hakim lainnya, seperti Barak, Gideon, dan Yefta, berperang melawan musuh Allah bersama pasukan mereka. Tapi, Simson berkali-kali melawan musuh sendirian! Yehuwa menggunakan dia untuk membunuh banyak sekali orang Filistin, tanpa pasukan atau bantuan orang lain. Bagaimana bisa?"],["p","Sesuai petunjuk Yehuwa, orang tua Simson membaktikan dia kepada Yehuwa sebagai orang Nazir. Karena itu, Simson tidak pernah memotong rambutnya. Selama dia memenuhi syarat itu, Yehuwa memberkati dia dengan kekuatan yang luar biasa. Simson bahkan pernah mencabik seekor singa menjadi dua dengan tangan kosong! Simson terus menggunakan kekuatannya untuk melawan orang Filistin, karena saat itu mereka menjajah orang Israel, yang lagi-lagi meninggalkan Yehuwa."],["p","Suatu hari, orang-orang Israel yang ketakutan mengikat Simson dan menyerahkan dia kepada orang Filistin. Tapi, Simson memutuskan tali-talinya semudah memutuskan benang. Lalu, dia membunuh 1.000 orang Filistin hanya dengan tulang rahang keledai! Suatu malam, waktu Simson ada di kota Gaza, musuh-musuhnya menunggu di gerbang kota untuk menyergap dia pada pagi hari. Tapi pada tengah malam, Simson bangun dan mencabut pintu-pintu gerbang kota yang sangat besar bersama tiang-tiang dan palangnya. Lalu, sambil memikul semua itu di pundaknya, dia berjalan sekitar 60 kilometer ke puncak gunung di dekat Hebron!"],["p","Berulang kali, Simson terbukti tidak terkalahkan. Dia menunjukkan kepada orang Filistin bahwa dewa-dewi mereka, seperti Dagon, tidak berdaya melawan seorang hamba Yehuwa yang setia. Tapi akhirnya, orang Filistin berhasil menemukan senjata yang ampuh untuk mengalahkan Simson, yaitu seorang wanita bernama Delila."],["p","Simson jatuh cinta kepada Delila, tapi wanita itu dengan licik mengkhianatinya. Delila sudah disogok orang Filistin untuk mencari tahu rahasia kekuatan Simson. Jadi, dia terus merengek supaya Simson membongkar rahasianya. Akhirnya, Simson tidak tahan lagi. Dia mengatakan bahwa kalau rambutnya dipotong, dia akan kehilangan kekuatannya dan menjadi seperti manusia biasa. Delila pun menunggu sampai Simson tertidur, lalu menyuruh seseorang memotong kepangan rambut Simson yang panjang. Kekuatan Simson pun lenyap. Alkitab mengatakan, ”Yehuwa telah meninggalkannya.” Kemudian, orang Filistin langsung menangkap Simson dan membutakan kedua matanya."],["p","Simson dipaksa melakukan pekerjaan yang sangat menguras tenaga, yaitu menggiling biji-bijian untuk orang Filistin. Pria yang tadinya perkasa itu sekarang hanyalah budak yang terbelenggu rantai tembaga! Orang Filistin sangat gembira. Mereka pun mengadakan pesta besar untuk mengagungkan Dagon. Ribuan orang memadati sebuah kuil yang besar. Di atapnya saja ada sekitar 3.000 orang. Orang Filistin ingin menjadikan Simson bahan tertawaan. Jadi, dia dibawa ke sana dan disuruh berdiri di antara dua pilar yang besar. Waktu itu, rambut Simson sudah tumbuh lagi dengan lebat."],["p","Simson terbelenggu karena kesalahannya sendiri, tapi dia meminta satu kesempatan terakhir untuk membayar kesalahannya"],["p","Hati Simson penuh dengan penyesalan. Setelah memegang kedua pilar itu, dia berdoa supaya kekuatannya kembali: ”Yehuwa, tolonglah. Ingatlah aku, dan buatlah aku kuat, kali ini saja.” Lalu dia berteriak, ”Aku akan mati bersama orang Filistin!” Bayangkan Simson mendorong kedua pilar besar itu dengan sekuat tenaga sampai pilar-pilar itu mulai bergeser. Sebelum orang Filistin bisa melakukan apa pun untuk menghentikan Simson, kedua pilar itu jatuh dan seluruh bangunan kuil itu roboh! Itulah kali terakhir Simson menggunakan kekuatannya. Dalam sekejap, dia membunuh banyak sekali musuh Allah, jauh lebih banyak daripada yang dia bunuh sepanjang hidupnya."],["p","Lebih dari 1.000 tahun kemudian, Rasul Paulus mencatat nama Simson di antara orang-orang yang sangat beriman. Dan waktu Paulus menulis tentang mereka yang ”menjadi kuat meskipun tadinya lemah”, dia pasti mengingat hakim yang berani ini.— Ibr. 11:​32-34 ."],["h","Baca kisahnya di:"],["p","Hakim 13:1–16:31"],["h","Untuk dibahas:"],["p","Bagaimana Simson bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Kenapa Simson bisa tetap menjadi orang Nazir meskipun sudah menyentuh mayat? ( w05 15/1 30 ¶1–31 ¶1 )"],["p","2. Dari mana kita tahu bahwa Simson pasti dibantu kuasa kudus untuk memikul pintu gerbang kota dan tiang-tiangnya dari Gaza ke Hebron? ( w04 15/10 15 ¶7-8 ) Gambar A"],["p","Gambar A"],["p","3. Dari mana kita tahu bahwa Delila kemungkinan adalah orang Israel? ( w05 15/3 28 ¶2 )"],["p","4. Kenapa Simson berdoa meminta pembalasan hanya untuk ’satu matanya’? ( Hak. 16:28 ; it ”Simson” ¶10 )"],["h","Pikirkan Pelajarannya"],["p","Karena terus didesak, Simson membocorkan rahasianya kepada Delila. Apa pelajarannya bagi para penatua dan istri mereka? Gambar B"],["p","Gambar B"],["p","Meskipun Simson sudah membuat kesalahan serius, belakangan Yehuwa menggunakan dia lagi dengan cara yang luar biasa. Kalau kita membuat kesalahan, bagaimana kisah Simson bisa membantu kita untuk tidak menyerah?"],["p","Bagaimana Saudara bisa meniru keberanian Simson dalam kehidupan Saudara?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Simson setelah dia dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Ajarlah anak Saudara tentang apa yang membuat Simson menjadi salah satu pria paling kuat yang pernah ada."],["p","”Roh Kudus Membuat Simson Kuat” ( ijwis artikel 14)"],["p","Apa lagi yang bisa kita pelajari dari kisah Simson?"],["p","”Seperti Simson, Andalkan Yehuwa” ( w23.09 2-7)"]]},"r101":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 5:11","isi":[[11,"”Tuan Yang Mahatinggi Yehuwa berkata, ’Demi Aku yang hidup, Aku juga akan menolakmu karena kamu mencemari tempat suci-Ku dengan semua berhalamu yang menjijikkan dan perbuatanmu yang memuakkan. Mata-Ku tidak akan kasihan, dan Aku tidak akan iba hati. "]]},"r102":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 6:9","isi":[[9,"Mereka yang selamat akan mengingat Aku di antara bangsa-bangsa tempat mereka ditawan. Mereka akan sadar bahwa hati-Ku hancur karena mereka tidak setia dan mengkhianati-Ku, dan karena mereka menginginkan berhala yang menjijikkan. Mereka akan malu dan jijik terhadap semua hal jahat dan memuakkan yang telah mereka lakukan. "]]},"r103":{"j":"p","jd":"","sub":"w04 15/5 6 ¶2-3","isi":[["p","Alkitab memberikan bukti-bukti yang jelas bahwa hati Allah sangat dipedihkan oleh tingkah laku yang tidak adil-benar. ( Mazmur 78:41 ) Hal-hal yang menyakitkan hati​—bahkan memuakkan​—bagi Allah mencakup kesombongan, dusta, pembunuhan, ilmu gaib, ramalan nasib, penyembahan nenek moyang, moral bebas, homoseksualitas, ketidaksetiaan dalam perkawinan, inses, dan penindasan atas orang miskin.​— Imamat 18:9-29; 19:29; Ulangan 18:9-12; Amsal 6:16-19; Yeremia 7:5-7; Maleakhi 2:14-16 ."],["p","Bagaimana perasaan Yehuwa terhadap penyembahan berhala? Keluaran 20:4, 5 menyatakan, ”Jangan membuat patung pahatan atau suatu bentuk yang mirip apa pun yang ada di langit di atas atau yang ada di bumi di bawah atau yang ada di dalam air di bawah bumi. Jangan membungkuk kepadanya ataupun terbujuk untuk melayaninya.” Mengapa? Karena berhala ”adalah hal yang memuakkan bagi Yehuwa”. ( Ulangan 7:25, 26 ) Rasul Yohanes memperingatkan, ”Anak-anak kecil, jagalah dirimu terhadap berhala-berhala.” ( 1 Yohanes 5:21 ) Dan, rasul Paulus menulis, ”Saudara-saudara yang kukasihi, larilah dari penyembahan berhala.”​— 1 Korintus 10:14 ."]]},"r104":{"j":"a","jd":"Surat Pertama untuk Sidang Jemaat di Korintus","sub":"Surat Pertama untuk Sidang Jemaat di Korintus 10:14","isi":[[14,"Maka, saudara-saudara yang saya kasihi, larilah dari penyembahan berhala. "]]},"r105":{"j":"p","jd":"”Lihatlah Hal-Hal Jahat dan Memuakkan yang Mereka Lakukan”","sub":"rr 54 ¶9","isi":[["p","1-3. Apa yang ingin Yehuwa perlihatkan kepada Yehezkiel di bait Yerusalem, dan mengapa? (Lihat gambar dan keterangan di Bagian 2. )"],["p","SEBAGAI anak seorang imam, Nabi Yehezkiel sangat memahami Hukum Musa. Jadi, dia tahu persis tentang bait di Yerusalem dan tentang ibadah yang murni kepada Yehuwa yang harus dijalankan di sana. ( Yeh. 1:3; Mal. 2:7 ) Tapi, keadaan di bait Yehuwa pada 612 SM pasti mengejutkan semua orang Yahudi yang setia, termasuk Yehezkiel."],["p","2 Yehuwa ingin memperlihatkan kepada Yehezkiel betapa parahnya keadaan di bait supaya Yehezkiel bisa menceritakannya kepada ”para pemimpin Yehuda”, yaitu sesama tawanan yang berkumpul di rumahnya. (Baca Yehezkiel 8:1-4; Yeh. 11:24, 25; 20:1-3 ) Dengan kuasa kudus, Yehuwa memberi Yehezkiel penglihatan, dan dalam penglihatan itu, dia dibawa dari rumahnya di Tel-abib, dekat Sungai Khebar di Babilon, ke bait Yerusalem yang jauhnya ratusan kilometer di sebelah barat. Yehuwa membawa nabi ini ke halaman dalam di dekat gerbang utara. Dari sana, Yehuwa mulai menunjukkan apa saja yang berlangsung di berbagai bagian bait."]]},"r106":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 5:1","isi":[[1,"5 ”Putra manusia, ambil pedang yang tajam untuk dipakai sebagai pisau cukur. Cukur rambut dan janggutmu, lalu ambil timbangan. Timbang dan bagi-bagi rambut itu."]]},"r107":{"j":"p","jd":"”Akhirmu Telah Tiba”","sub":"rr 63 ¶6","isi":[["p","1, 2. (a) Ceritakan tentang kelakuan aneh Yehezkiel. (Lihat gambar di awal bab.) (b) Apa yang sedang dia nubuatkan?"],["p","BERITA tentang kelakuan aneh Nabi Yehezkiel tersebar dengan cepat di antara orang-orang Yahudi yang ditawan di Babilon. Selama seminggu, dia duduk termenung di antara mereka. Tak sepatah kata pun keluar dari mulutnya. Tiba-tiba dia berdiri, masuk ke rumahnya, dan mengurung diri. Orang-orang bingung melihatnya. Lalu, nabi ini keluar dari rumah, mengambil sebuah batu bata, menaruh batu itu di depannya, dan mengukir sebuah gambar. Kemudian, tanpa berkata-kata, Yehezkiel mulai membuat miniatur pagar kayu.​— Yeh. 3:10, 11, 15, 24-26; 4:1, 2 ."],["p","2 Pastilah, ada semakin banyak orang yang memperhatikan dia. Mereka pasti bingung dan berpikir, ’Apa maksudnya ini?’ Belakangan, barulah orang-orang Yahudi yang ditawan itu mengerti bahwa kelakuan aneh Nabi Yehezkiel sebenarnya menubuatkan peristiwa mengerikan yang akan terjadi nanti, saat Allah Yehuwa menyatakan kemarahan-Nya atas mereka. Peristiwa apa itu? Apa dampaknya atas bangsa Israel zaman dulu? Dan, apa pengaruhnya atas orang-orang yang menjalankan ibadah yang murni di zaman sekarang?"]]},"r108":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 6:1-10","isi":[[1,"6 Yehuwa berfirman lagi kepada saya,"],[2,"”Putra manusia, arahkan mukamu ke gunung-gunung Israel dan bernubuatlah tentang mereka."],[3,"Katakan, ’Gunung-gunung Israel, dengarlah kata-kata Tuan Yang Mahatinggi Yehuwa: Inilah yang dikatakan Tuan Yang Mahatinggi Yehuwa kepada gunung, bukit, sungai, dan lembah: ”Aku akan mendatangkan pedang kepada kalian, dan Aku akan menghancurkan tempat-tempat penyembahan kalian."],[4,"Mezbah kalian akan dimusnahkan, tempat dupa kalian akan dipatahkan, dan Aku akan melemparkan orang-orang yang terbunuh ke depan berhala-berhala kalian yang menjijikkan. +"],[5,"Aku akan melemparkan mayat orang Israel ke depan berhala-berhala mereka yang menjijikkan. Aku akan menyebarkan tulang-tulang kalian ke sekeliling mezbah kalian. "],[6,"Di semua daerah tempat kalian tinggal, kotanya akan dihancurkan dan tempat penyembahannya akan dimusnahkan dan ditelantarkan. Mezbah kalian akan dimusnahkan dan dihancurkan. Berhala kalian yang menjijikkan akan binasa, tempat dupa kalian akan dipatahkan, dan hasil pekerjaan kalian akan dilenyapkan."],[7,"Orang-orang yang terbunuh akan bergelimpangan di tengah-tengah kalian. Kalian pun akan tahu bahwa Akulah Yehuwa. "],[8,"”’”Tapi Aku akan menyisakan beberapa dari kalian. Saat kalian dipencarkan ke berbagai negeri, ada yang akan selamat dari pedang saat tinggal di antara bangsa-bangsa lain. "],[9,"Mereka yang selamat akan mengingat Aku di antara bangsa-bangsa tempat mereka ditawan. Mereka akan sadar bahwa hati-Ku hancur karena mereka tidak setia dan mengkhianati-Ku, dan karena mereka menginginkan berhala yang menjijikkan. Mereka akan malu dan jijik terhadap semua hal jahat dan memuakkan yang telah mereka lakukan. "],[10,"Mereka pun akan tahu bahwa Akulah Yehuwa, dan bencana yang Aku katakan ini bukan cuma ancaman kosong.”’ "]]},"r109":{"j":"p","jd":"Rendah Hati","sub":"lmd pelajaran 4 nomor 5","isi":[["p","Kis. 26:​2, 3"],["p","PELAJARAN 4"],["p","Prinsip: ”Dengan rendah hati, anggaplah orang lain lebih tinggi daripada kalian.”— Flp. 2:3 ."]]},"r110":{"j":"a","jd":"Yang Ditulis Matius","sub":"Yang Ditulis Matius 4:10","isi":[[10,"Lalu Yesus berkata, ”Pergi, Setan! Ada tertulis, ’Yang harus kamu sembah adalah Yehuwa Allahmu, dan bagi Dia saja kamu harus melakukan pelayanan suci.’” "]]},"r111":{"j":"p","jd":"Anak Kecil yang Berani Menyampaikan Pesan Yehuwa","sub":"wcg bab 21","isi":[["p","21 SAMUEL"],["p","SAMUEL punya persamaan dengan anak perempuan Yefta dan Simson. Seperti anak perempuan Yefta, Samuel dibaktikan seumur hidupnya kepada Yehuwa karena ikrar orang tuanya. ( 1 Sam. 2:11 ) Seperti Simson, Samuel menjadi orang Nazir seumur hidupnya. ( Hak. 13:7 ) Dan seperti mereka berdua, Samuel juga butuh keberanian."],["p","Waktu Samuel tidak menyusu lagi (mungkin di usia tiga tahun atau sedikit lebih besar), ibunya, Hana, membawa dia untuk melayani di tabernakel Yehuwa di Syilo. Itu sesuai dengan janji Hana kepada Yehuwa. Tiap tahun, Hana mengunjungi anaknya dan membawakannya baju baru. Samuel pun bertumbuh besar di sana di bawah pengawasan Imam Besar Eli yang sudah tua. Beberapa wanita yang melayani di tabernakel juga mungkin membantu mengurus Samuel."],["p","Sayangnya, ibadah di tabernakel saat itu sedang tercemar, dan Eli ikut bersalah atas hal itu. Dua anak laki-lakinya, Hofni dan Pinehas, adalah orang yang bejat. Mereka berbuat cabul dengan beberapa wanita yang melayani di rumah Yehuwa yang suci. Mereka juga mencemari ibadah yang murni dengan cara lain. Kelihatannya, setiap kali orang-orang datang untuk membawa persembahan bagi Yehuwa, Hofni dan Pinehas memerintahkan para pelayan untuk merampas bagian terbaik dari persembahan itu. Eli tahu perbuatan kedua anaknya itu. Tapi, dia hanya menasihati mereka dengan lembut, dan mereka tidak mendengarkan dia. Nah, meski Samuel hidup di lingkungan seperti itu, dia bertumbuh menjadi orang yang disukai oleh Yehuwa dan semua orang. Saat tiba waktunya bagi Yehuwa untuk membereskan masalah di Syilo, Dia memilih Samuel kecil untuk menjadi juru bicara-Nya."],["p","Suatu malam, Samuel terbangun karena mendengar sebuah suara. Yehuwa memanggil dia! Tapi, Samuel mengira bahwa itu suara Eli, yang saat itu sudah tua dan tidak bisa melihat lagi. Jadi, Samuel berlari menemui sang imam besar untuk mencari tahu apa yang dia inginkan. Eli menyuruhnya untuk kembali tidur, karena dia tidak memanggilnya. Itu terjadi sampai tiga kali. Akhirnya, Eli menyadari apa yang terjadi dan menyuruh Samuel tidur lagi. Eli juga mengatakan bahwa kalau Yehuwa memanggil lagi, Samuel harus menjawab, ”Bicaralah, Yehuwa, hamba-Mu ini mendengarkan.”"],["p","Untuk keempat kalinya, Yehuwa memanggil, ”Samuel, Samuel!” Lalu, Samuel melakukan persis seperti yang Eli katakan. Dia menjawab, ”Bicaralah, hamba-Mu ini mendengarkan.” Yehuwa pun mengatakan bahwa Dia akan membereskan masalah di Syilo dan menghukum Eli, yang tidak mendisiplin anak-anaknya. Hukuman untuk seluruh keluarga Eli, termasuk kedua anaknya, sudah ditetapkan. Dan, Samuel harus memberitahukan semua itu kepada Eli!"],["p","Setelah itu, Samuel tidur lagi, meskipun mungkin tidak terlalu nyenyak. Pagi-pagi sekali, dia bangun untuk membuka pintu-pintu halaman tabernakel. Alkitab berkata, ”Samuel takut memberi tahu Eli tentang penglihatan itu.” Wajar saja kalau Samuel takut. Tapi, Eli memanggil Samuel dan menanyakan apa yang Allah katakan. Eli mungkin tahu bahwa Samuel ketakutan. Dia berkata, ”Janganlah sembunyikan apa pun dariku.”"],["p","Meskipun masih kecil, Samuel harus menyampaikan berita penghukuman Yehuwa kepada Imam Besar Eli"],["p","Situasi ini pasti sangat sulit bagi Samuel. Bisa jadi, dia menghormati Eli seperti kakeknya sendiri. Lagi pula, Eli adalah imam besar, yang mewakili seluruh bangsa Israel dalam ibadah! Meski begitu, Samuel yang masih kecil berani ”memberi tahu dia semuanya”. Eli pun tahu bahwa bencana sudah di ambang pintu. Sekarang, apakah Eli akhirnya mengoreksi kedua anaknya? Tidak ada catatan yang menunjukkan hal itu."],["p","Karena keberanian Samuel, Yehuwa memberkati dia dengan limpah. Alkitab mencatat, ”Yehuwa sendiri menyertai dia.” Sejak itu, Yehuwa mulai berbicara melalui Samuel dan ”membuat semua kata-katanya menjadi kenyataan”. Eli dan keturunannya akhirnya dihukum, persis seperti yang Samuel katakan. Samuel juga membimbing bangsa Israel secara rohani. Selama puluhan tahun, dia dengan setia melayani sebagai nabi dan hakim bagi umat Yehuwa. Sejak kecil, dia sudah belajar untuk bertindak berani dengan bantuan Yehuwa, dan dia terus menjadi orang yang berani sampai akhir kehidupannya yang panjang."],["h","Baca kisahnya di:"],["p","1 Samuel 1:​9-11, 24-28; 2:​12-36; 3:​1-21; 25:1"],["p","Ibrani 11:32"],["h","Untuk dibahas:"],["p","Bagaimana Samuel bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Seperti apa kota Syilo, tempat tabernakel Yehuwa berada? ( w92 1/11 8-9 ) Gambar A"],["p","Todd Bolen/BiblePlaces.com"],["p","Gambar A : Lokasi kota Syilo di zaman dulu"],["p","2. Seperti apa kehidupan Samuel di tabernakel? ( ia 61-62 ¶9-13 ) Gambar B"],["p","Gambar B"],["p","3. Apa maksudnya Samuel yang masih kecil ”belum mengenal Yehuwa”? ( 1 Sam. 3:7 ; w02 15/12 8 ¶5-6 )"],["p","4. Bagaimana nubuat tentang keluarga Eli menjadi kenyataan? ( it ”Eli, I” ¶5-7 )"],["h","Pikirkan Pelajarannya"],["p","Bagaimana anak muda bisa meniru Samuel yang . . ."],["p","siap untuk taat? ( 1 Sam. 3:5 )"],["p","sopan dan suka membantu? ( 1 Sam. 3:​6-10 )"],["p","bisa diandalkan? ( 1 Sam. 3:15 ) Gambar C"],["p","Gambar C"],["p","Dalam situasi apa anak muda harus berani untuk berbicara, dan bagaimana teladan Samuel bisa membantu mereka?"],["p","Dengan cara apa lagi Saudara bisa meniru keberanian Samuel?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Samuel setelah dia dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Dalam situasi apa anak muda dan orang dewasa butuh keberanian untuk membela apa yang benar?"],["p","Belajarlah dari Mereka—Samuel (4:53)"],["p","Samuel yang masih kecil tetap melakukan apa yang benar meskipun orang-orang di sekitarnya tidak menghormati Allah."],["p","”Samuel Memilih untuk Melayani Yehuwa” ( ijwis artikel 15)"]]},"r112":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 7:3","isi":[[3,"Akhirmu telah tiba, dan Aku akan melampiaskan kemarahan-Ku kepadamu. Aku akan menghakimi kamu sesuai dengan tingkah lakumu dan menghukum kamu atas semua perbuatanmu yang memuakkan."]]},"r113":{"j":"p","jd":"”Akhirmu Telah Tiba”","sub":"rr 67-68 ¶13-15","isi":[["p","1, 2. (a) Ceritakan tentang kelakuan aneh Yehezkiel. (Lihat gambar di awal bab.) (b) Apa yang sedang dia nubuatkan?"],["p","BERITA tentang kelakuan aneh Nabi Yehezkiel tersebar dengan cepat di antara orang-orang Yahudi yang ditawan di Babilon. Selama seminggu, dia duduk termenung di antara mereka. Tak sepatah kata pun keluar dari mulutnya. Tiba-tiba dia berdiri, masuk ke rumahnya, dan mengurung diri. Orang-orang bingung melihatnya. Lalu, nabi ini keluar dari rumah, mengambil sebuah batu bata, menaruh batu itu di depannya, dan mengukir sebuah gambar. Kemudian, tanpa berkata-kata, Yehezkiel mulai membuat miniatur pagar kayu.​— Yeh. 3:10, 11, 15, 24-26; 4:1, 2 ."],["p","2 Pastilah, ada semakin banyak orang yang memperhatikan dia. Mereka pasti bingung dan berpikir, ’Apa maksudnya ini?’ Belakangan, barulah orang-orang Yahudi yang ditawan itu mengerti bahwa kelakuan aneh Nabi Yehezkiel sebenarnya menubuatkan peristiwa mengerikan yang akan terjadi nanti, saat Allah Yehuwa menyatakan kemarahan-Nya atas mereka. Peristiwa apa itu? Apa dampaknya atas bangsa Israel zaman dulu? Dan, apa pengaruhnya atas orang-orang yang menjalankan ibadah yang murni di zaman sekarang?"]]},"r114":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 7:4","isi":[[4,"Mata-Ku tidak akan kasihan kepadamu, dan Aku tidak akan iba hati. Aku akan membalasmu sesuai dengan tingkah lakumu, dan kamu akan mengalami akibat perbuatanmu yang memuakkan. Kalian pun akan tahu bahwa Akulah Yehuwa.’ "]]},"r115":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 7:10","isi":[[10,"”’Hari itu! Hari itu telah tiba! Dan giliranmu telah tiba. Tongkat untuk menghukum kamu sudah siap. Musuhmu sudah semakin sombong."]]},"r116":{"j":"p","jd":"”Akhirmu Telah Tiba”","sub":"rr 70 ¶19","isi":[["p","1, 2. (a) Ceritakan tentang kelakuan aneh Yehezkiel. (Lihat gambar di awal bab.) (b) Apa yang sedang dia nubuatkan?"],["p","BERITA tentang kelakuan aneh Nabi Yehezkiel tersebar dengan cepat di antara orang-orang Yahudi yang ditawan di Babilon. Selama seminggu, dia duduk termenung di antara mereka. Tak sepatah kata pun keluar dari mulutnya. Tiba-tiba dia berdiri, masuk ke rumahnya, dan mengurung diri. Orang-orang bingung melihatnya. Lalu, nabi ini keluar dari rumah, mengambil sebuah batu bata, menaruh batu itu di depannya, dan mengukir sebuah gambar. Kemudian, tanpa berkata-kata, Yehezkiel mulai membuat miniatur pagar kayu.​— Yeh. 3:10, 11, 15, 24-26; 4:1, 2 ."],["p","2 Pastilah, ada semakin banyak orang yang memperhatikan dia. Mereka pasti bingung dan berpikir, ’Apa maksudnya ini?’ Belakangan, barulah orang-orang Yahudi yang ditawan itu mengerti bahwa kelakuan aneh Nabi Yehezkiel sebenarnya menubuatkan peristiwa mengerikan yang akan terjadi nanti, saat Allah Yehuwa menyatakan kemarahan-Nya atas mereka. Peristiwa apa itu? Apa dampaknya atas bangsa Israel zaman dulu? Dan, apa pengaruhnya atas orang-orang yang menjalankan ibadah yang murni di zaman sekarang?"]]},"r117":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 7:19","isi":[[19,"”’Mereka akan membuang perak mereka ke jalan-jalan dan akan muak kepada emas mereka. Perak maupun emas mereka tidak akan bisa menyelamatkan mereka pada hari kemurkaan Yehuwa. Semua itu tidak akan membuat mereka puas ataupun kenyang. Sebab semua itu telah membuat mereka melakukan kesalahan."]]},"r118":{"j":"p","jd":"Surat yang Bisa Membantu Kita Bertekun","sub":"w24.09 11 ¶14","isi":[["p","1-2. (a) Sewaktu Rasul Paulus menulis surat kepada orang-orang Ibrani, bagaimana situasi di Yudea? (b) Mengapa surat itu terbukti tepat waktu?"],["p","ORANG Kristen Ibrani yang tinggal di Yerusalem dan Yudea mengalami banyak kesulitan setelah kematian Yesus. Tidak lama setelah sidang Kristen dibentuk, mereka mulai dianiaya dengan parah. ( Kis. 8:1 ) Lalu, sekitar 20 tahun kemudian, orang Kristen menghadapi masalah ekonomi yang serius, mungkin karena kelaparan yang baru saja terjadi. ( Kis. 11:​27-30 ) Tapi sekitar tahun 61 M, Rasul Paulus dibimbing oleh Yehuwa untuk menulis surat kepada mereka. Waktu itu, bisa dikatakan mereka menikmati masa damai, karena penganiayaan yang terjadi saat itu tidak seberat yang nantinya akan mereka alami. Mengapa surat Paulus sangat tepat waktu?"],["p","2 Surat untuk orang Ibrani tepat waktu karena masa damai yang mereka nikmati itu hanya sementara. Tidak lama lagi, mereka akan mengalami kesengsaraan karena Yerusalem akan dihancurkan seperti yang Yesus nubuatkan. ( Luk. 21:20 ) Memang, Paulus dan orang Kristen di Yudea tidak tahu kapan persisnya itu akan terjadi. Tapi, nasihat yang Paulus berikan dalam suratnya bisa membantu mereka mempersiapkan diri. Mereka bisa menggunakan waktu yang tersisa untuk berupaya memiliki iman yang kuat dan ketekunan.— Ibr. 10:25; 12:​1, 2 ."]]},"r119":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 8:7-18","isi":[[7,"Kemudian Dia membawa saya ke pintu masuk halaman, dan saya melihat ada lubang di tembok."],[8,"Lalu Dia berkata, ”Putra manusia, tolong jebol tembok itu.” Jadi saya menjebol tembok itu dan saya melihat jalan masuk."],[9,"Dia berkata, ”Masuk dan lihatlah hal-hal jahat dan memuakkan yang mereka lakukan di sini.”"],[10,"Jadi saya masuk dan melihat berbagai gambar binatang merayap, binatang yang memuakkan, dan semua berhala menjijikkan milik orang Israel. Semua itu terpahat di sekeliling tembok."],[11,"Ada 70 pemimpin orang Israel yang berdiri di depannya, termasuk Yaazania anak Syafan. Mereka masing-masing memegang wadah dupa, dan asap dupa yang wangi mengepul ke atas. "],[12,"Lalu Dia berkata, ”Putra manusia, apa kamu lihat apa yang dilakukan para pemimpin orang Israel dalam kegelapan, di ruang dalam tempat mereka masing-masing menaruh berhala mereka? Mereka berkata, ’Yehuwa tidak melihat kita. Yehuwa telah meninggalkan negeri ini.’” "],[13,"Selanjutnya Dia berkata, ”Kamu masih akan melihat perbuatan lain yang lebih memuakkan lagi.”"],[14,"Maka Dia membawa saya ke pintu masuk gerbang utara rumah Yehuwa. Di sana, saya melihat wanita-wanita sedang duduk menangisi Dewa Tamuz."],[15,"Selanjutnya Dia berkata, ”Apa kamu melihatnya, putra manusia? Kamu masih akan melihat hal-hal lain yang jauh lebih memuakkan daripada ini.” "],[16,"Maka Dia membawa saya ke halaman dalam rumah Yehuwa. Di pintu masuk bait Yehuwa, di antara beranda dan mezbah, ada kira-kira 25 pria yang membelakangi bait Yehuwa dan mukanya menghadap ke timur. Mereka sujud ke arah matahari di timur. "],[17,"Selanjutnya Dia berkata, ”Putra manusia, apa kamu lihat itu? Orang Yehuda melakukan hal-hal memuakkan itu, memenuhi negeri ini dengan kekerasan dan terus menyakiti hati-Ku. Apa hal itu sepele? Mereka menyodorkan hal yang menjijikkan ke muka-Ku."],[18,"Jadi Aku akan bertindak dengan penuh kemarahan. Mata-Ku tidak akan kasihan, dan Aku tidak akan iba hati. Biarpun mereka menjerit-jerit, Aku tidak akan mendengarkan mereka.” "]]},"r120":{"j":"p","jd":"Pikirkan Minat Mereka","sub":"lmd pelajaran 1 nomor 4","isi":[["p","Yoh. 4:​6-9"],["p","PELAJARAN 1"],["p","Prinsip: ”Orang yang punya kasih . . . tidak mementingkan diri.”— 1 Kor. 13:​4, 5 ."]]},"r121":{"j":"p","jd":"Terus Terang","sub":"lmd pelajaran 12 nomor 3","isi":[["p","Mrk. 10:​17-22"],["p","PELAJARAN 12"],["p","Prinsip: ”Minyak dan dupa membuat hati senang; begitu juga persahabatan manis yang terjalin karena nasihat yang tulus.”— Ams. 27:9 ."]]},"r122":{"j":"a","jd":"Ulangan","sub":"Ulangan 32:29","isi":[[29,"Seandainya mereka bijaksana, mereka akan renungkan semua ini,  Mereka akan pikirkan akibatnya. "]]},"r123":{"j":"a","jd":"Yesaya","sub":"Yesaya 59:2","isi":[[2,"Kesalahan kalianlah yang memisahkan kalian dari Allah.  Dosa kalian membuat Dia membuang muka, Dan Dia tidak mau mendengar kalian. "]]},"r124":{"j":"a","jd":"Amsal","sub":"Amsal 27:11","isi":[[11,"Anakku, jadilah bijaksana dan buatlah hatiku senang,  Supaya aku bisa menjawab dia yang menghinaku. +"]]},"r125":{"j":"a","jd":"Surat untuk Sidang Jemaat di Filipi","sub":"Surat untuk Sidang Jemaat di Filipi 4:7","isi":[[7,"sehingga kedamaian dari Allah, yang bisa mengalahkan pemikiran apa pun, akan menjaga hati dan pikiran kalian melalui Kristus Yesus."]]},"r126":{"j":"a","jd":"Mazmur","sub":"Mazmur 38:3-8","isi":[[3,"Seluruh tubuhku sakit karena kemarahan-Mu. Tidak ada damai dalam diriku karena dosaku. "],[4,"Kesalahan-kesalahanku membanjiri aku, + Seperti beban berat yang tak sanggup kutanggung."],[5,"Luka-lukaku bernanah dan berbau busuk Karena kebodohanku."],[6,"Aku stres dan sangat tertekan; Aku berjalan dengan sedih sepanjang hari."],[7,"Ada panas yang membakar dalam diriku;  Seluruh tubuhku sakit. "],[8,"Aku mati rasa dan benar-benar remuk; Derita hatiku membuatku menjerit. "]]},"r127":{"j":"p","jd":"Zaman Raja-Raja Sampai Yerusalem Dibangun Kembali","sub":"wcg pengantar bagian 2,","isi":[["p","BAGIAN 2"],["p","Bagian ini menceritakan hal-hal yang terjadi dalam jangka waktu sekitar 600 tahun. Kita akan mulai dengan kisah Yonatan putra Raja Saul dan kisah Daud, raja Israel pertama yang setia. Lalu, kita akan menelusuri berbagai peristiwa sampai waktunya umat Allah dibebaskan dari penawanan di Babilon dan membangun kembali Yerusalem. Kita akan dikuatkan oleh teladan Abigail, Natan, Elia, Daniel, Ester, Nehemia, dan yang lainnya. Mereka tetap berani dan tabah meskipun situasinya sulit. Misalnya, ada yang memerintah atas umat Yehuwa yang suka memberontak, berjuang untuk tetap setia saat pemimpin mereka menyimpang dari Yehuwa, dan memperingatkan umat Allah yang mulai tenggelam dalam kemurtadan dan kejahatan."]]},"r128":{"j":"p","jd":"Garis Waktu Bagian 2","sub":"garis waktu","isi":[["p","Zaman Raja-Raja Sampai Yerusalem Dibangun Kembali"],["h","Kerajaan Israel Belum Terbagi"],["p","NAMA"],["p","TAHUN"],["p","Samuel"],["p","1180*-1080* SM"],["p","Yonatan"],["p","1138*-1078* SM"],["p","Daud"],["p","1107-​1037 SM"],["p","Abigail, Natan a"],["p","1100*-1000* SM"],["p","Mefibosyet"],["p","1083*-1000* SM"],["p","*Kira-kira."],["h","Kerajaan Israel Sudah Terbagi"],["p","NAMA"],["p","TAHUN"],["p","Yehoyada"],["p","1005*-875* SM"],["p","Asa"],["p","1000*-937 SM"],["p","Elia, Janda di Zarefat b"],["p","970*-900* SM"],["p","Elisa"],["p","950*-850* SM"],["p","Gadis Kecil Israel"],["p","925*-825* SM"],["p","Hizkia"],["p","771-716 SM"],["p","Manasye"],["p","728-661 SM"],["p","Yosia"],["p","667-628 SM"],["p","*Kira-kira."],["h","Penawanan di Babilon"],["p","NAMA"],["p","TAHUN"],["p","Daniel, Hanania, Misyael, Azaria c"],["p","635*-535* SM"],["p","*Kira-kira."],["h","Setelah Masa Penawanan"],["p","NAMA"],["p","TAHUN"],["p","Ester"],["p","515*-415* SM"],["p","Nehemia"],["p","485*-385* SM"],["p","*Kira-kira."],["h","Peristiwa"],["p","1600 d SM"],["p","KUASA DUNIA: Mesir"],["p","1027 SM"],["p","Bait Salomo selesai dibangun"],["p","997 SM"],["p","Israel terbagi menjadi dua kerajaan"],["p","Setelah 874 e SM"],["p","KUASA DUNIA: Asiria"],["p","740 SM"],["p","Asiria mengalahkan kerajaan sepuluh suku"],["p","625 SM"],["p","KUASA DUNIA: Babilon"],["p","607 SM"],["p","Nebukhadnezar menghancurkan Yerusalem"],["p","539 SM"],["p","KUASA DUNIA: Media-Persia"],["p","537 SM"],["p","Orang Yahudi dibebaskan dari Babilon"],["p","515 SM"],["p","Bait Yerusalem selesai dibangun"],["p","455 SM"],["p","Tembok Yerusalem selesai dibangun"],["p","a b c Masa hidup mereka digabung menjadi satu garis."],["p","d e Kira-kira."]]},"r129":{"j":"p","jd":"Dia Butuh Keberanian untuk Tetap Setia","sub":"bab 22","isi":[["p","22 YONATAN"],["p","DUA pria bersenjata memanjat sebuah tebing yang terjal dengan sigap. Mereka akan menyerang sekelompok pasukan Filistin. Yang memimpin serangan itu adalah Yonatan, anak dari raja pertama Israel, yaitu Saul. Di belakang Yonatan, ada pembawa senjatanya, yang semangatnya terpacu setelah Yonatan berkata, ”Bagi Yehuwa, tidak masalah untuk menyelamatkan melalui banyak orang atau sedikit orang.” Kata-kata itu segera menjadi kenyataan. Yehuwa membantu 2 pria yang berani itu mengalahkan sekitar 20 prajurit! Tapi, ini hanyalah awal dari kemenangan besar umat Allah."],["p","Dari cerita itu saja, keberanian Yonatan sudah terlihat jelas. Tapi, dia juga menunjukkan sifat itu dalam banyak peristiwa lain sepanjang hidupnya. Yonatan juga orang yang sangat setia, dan sering kali dibutuhkan keberanian untuk bisa setia. Misalnya, Yonatan setia kepada ayahnya, Saul. Tapi, setelah Saul tidak lagi menaati Yehuwa, Yonatan memilih untuk lebih setia kepada Yehuwa daripada kepada ayahnya. Itu pasti butuh keberanian."],["p","Puluhan tahun kemudian, waktu Yonatan mungkin berusia hampir 50 tahun, dia bersahabat dengan Daud, yang umurnya sekitar 30 tahun lebih muda. Daud baru saja membunuh Goliat, seorang raksasa Filistin. Saul dan semua orang lainnya pasti kagum dan memuji Daud. Nah, apakah Yonatan iri kepada Daud? Sama sekali tidak. Malah, dia memberikan perlengkapan perang miliknya kepada Daud, termasuk busurnya sendiri. Busur itu adalah hadiah yang sangat istimewa, karena kelihatannya Yonatan adalah pemanah yang ahli. Meskipun Yonatan jauh lebih tua daripada Daud, mereka berjanji untuk terus bersahabat, dan mereka tidak pernah mengingkari janji itu."],["p","Yonatan harus lebih setia kepada Allahnya daripada kepada ayahnya sendiri"],["p","Awalnya, Saul juga menyayangi Daud. Tapi tidak lama kemudian, rasa sayangnya pudar serta berubah menjadi rasa iri dan benci. Dia berharap Yonatan juga membenci Daud, apalagi karena Yehuwa sudah memilih Daud, bukan Yonatan, untuk menjadi raja Israel berikutnya. Tapi, Yonatan tetap setia kepada Daud. Waktu Saul berkata bahwa dia ingin membunuh Daud, Yonatan membela sahabatnya itu. Yonatan pasti butuh banyak keberanian. Kenapa? Karena walaupun Saul sudah berumur, dia masih pejuang yang kuat. Suatu kali, waktu Yonatan berupaya membela Daud, Saul melemparkan tombak ke arah Yonatan, anaknya sendiri! Tombak itu meleset dan tidak melukai Yonatan. Tapi, hati Yonatan sangat terluka. Sebagai teman yang setia, dia menemui Daud dan memberitahunya tentang rencana jahat Saul untuk membunuhnya. Dia juga memercayakan keluarganya kepada Daud kalau-kalau terjadi sesuatu yang buruk kepadanya."],["p","Daud pun terpaksa menjadi buronan. Dia bersembunyi dan melarikan diri dari satu tempat ke tempat lainnya. Saul bahkan mengerahkan pasukannya untuk mengejar Daud. Apakah Yonatan ikut dalam pasukan itu? Tidak ada catatan di Alkitab yang menunjukkan hal itu, dan kelihatannya itu tidak mungkin terjadi. Sekali waktu, Yonatan tahu di mana Daud bersembunyi, dan dia menemui sahabatnya itu. Untuk apa? Alkitab mencatat bahwa Yonatan ”membantu [Daud] memperkuat keyakinannya kepada Yehuwa”. Sebelum berpisah, Yonatan memberi tahu Daud, ”Jangan takut, Saul ayahku tidak akan menemukan kamu. Kamu akan menjadi raja Israel, dan aku akan menjadi orang kedua setelah kamu.” Ternyata, itu terakhir kalinya mereka bertemu."],["p","Belakangan, Yonatan dengan setia berperang bersama ayahnya melawan musuh yang sesungguhnya, yaitu pasukan Filistin. Tapi saat itu, Saul sudah menjadi murtad dan jahat. Dia bahkan pergi kepada pemanggil arwah. Tidak heran Yehuwa meninggalkan Saul. Di pertempuran itu, Saul akhirnya terluka lalu bunuh diri. Tiga anaknya, termasuk Yonatan, juga gugur dalam pertempuran itu."],["p","Daud sangat terpukul! Dia menggubah sebuah lagu perkabungan untuk mengungkapkan rasa sedihnya dan betapa sayangnya dia kepada Yonatan. Lagu itu berjudul ”Busur”, bisa jadi karena dia teringat akan hadiah dari Yonatan bertahun-tahun sebelumnya. Daud bernyanyi, ”Aku sangat kehilangan kamu, Yonatan saudaraku. Aku sayang sekali kepadamu.” Daud juga menepati janjinya kepada sahabatnya itu. Setelah menjadi raja, Daud mencari tahu apakah ada keluarga Yonatan yang masih hidup. Ternyata, ada satu anak Yonatan bernama Mefibosyet, yang kedua kakinya cacat. Daud mengajak Mefibosyet untuk tinggal dekat dengannya di Yerusalem dan mengurus kebutuhannya sejak saat itu."],["h","Baca kisahnya di:"],["p","1 Samuel 13:​2, 19-23; 14:​1-15; 16:21; 18:​1-9; 19:​4-6; 20:​1-42; 23:​16-18; 28:​6-8; 31:​1-6"],["p","2 Samuel 1:​17-27; 9:​1-7"],["h","Untuk dibahas:"],["p","Bagaimana Yonatan bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Siapa bangsa Filistin yang disebutkan dalam Alkitab? ( w95 1/2 31 )"],["p","2. Bagaimana kata ”pim” di 1 Samuel 13:21 ikut membuktikan bahwa Alkitab itu akurat? ( w05 15/3 29 ) Gambar A"],["p","Gambar A : Batu pim, yang digunakan untuk mengukur berat"],["p","3. Kenapa lintasan sempit di Mikhmash mungkin sulit diseberangi? Apa yang mungkin membantu Yonatan menyeberanginya? ( it ”Mikhmas[h]” ¶4 ) Gambar B"],["p","Todd Bolen/BiblePlaces.com"],["p","Gambar B: Kemungkinan, inilah lintasan sempit yang diseberangi oleh Yonatan di Mikhmash"],["p","Gambar B : Kemungkinan, inilah lintasan sempit yang diseberangi Yonatan di Mikhmash"],["p","Todd Bolen/BiblePlaces.com"],["p","4. Bagaimana Daud menepati janjinya untuk mengurus keluarga Yonatan? ( it ”Mefibosyet” No. 2 ¶1 )"],["h","Pikirkan Pelajarannya"],["p","Yonatan lebih setia kepada Yehuwa daripada kepada Saul. Bagaimana kita mungkin menghadapi situasi yang mirip? Gambar C"],["p","Gambar C"],["p","Dari kisah Yonatan dan Daud, apa yang Saudara pelajari tentang . . ."],["p","persahabatan?"],["p","kerendahan hati?"],["p","kesetiaan?"],["p","Dengan cara apa lagi Saudara bisa meniru keberanian Yonatan?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Apa yang mau saya tanyakan kepada Yonatan setelah dia dibangkitkan?"],["h","Cari Tahu Lebih Banyak"],["p","Kenapa Yonatan dan Daud bisa sangat akrab? Bagaimana kita bisa punya persahabatan seperti mereka?"],["p","”Teruslah Sayangi Satu Sama Lain” ( w21.01 20-25)"],["p","Bantu anak Saudara belajar dari kehidupan Yonatan."],["p","”Yonatan” (Kartu tokoh Alkitab di jw.org)"]]},"r130":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 9:4","isi":[[4,"Yehuwa berkata kepadanya, ”Berjalanlah ke seluruh kota, seluruh Yerusalem, dan beri tanda pada dahi orang-orang yang mengeluh dan merintih karena semua hal memuakkan yang dilakukan di kota itu.” "]]},"r131":{"j":"p","jd":"”Beri Tanda pada Dahi”","sub":"rr 173 ¶6","isi":[["p","1-3. (a) Mengapa Yehezkiel terkejut, dan apa yang dia pahami tentang kehancuran Yerusalem? (b) Pertanyaan apa saja yang akan kita bahas?"],["p","YEHEZKIEL terkejut! Dia baru saja diberi penglihatan tentang hal-hal menjijikkan yang dilakukan orang-orang Yahudi yang murtad di bait Yerusalem. a Para pemberontak itu mencemari pusat ibadah yang murni di Israel. Tapi, bukan hanya bait yang tercemar. Seluruh negeri Yehuda penuh dengan kekerasan dan sudah tidak ada harapan lagi. Yehuwa pun sakit hati melihat perbuatan umat pilihan-Nya. Dia memberi tahu Yehezkiel, ”Aku akan bertindak dengan penuh kemarahan.”​— Yeh. 8:17, 18 ."],["p","2 Bayangkan kesedihan Yehezkiel saat mendengar bahwa Yehuwa marah dan akan menghancurkan Yerusalem dan bait yang dulunya suci itu. Nabi ini pasti berpikir, ’Bagaimana dengan orang-orang yang setia di kota itu? Apakah mereka akan diselamatkan? Jika ya, bagaimana caranya?’ Tapi, dia tidak perlu terus bertanya-tanya. Tidak lama setelah dia mendengar tentang penghukuman itu, ada suara keras yang memanggil para pelaksana penghukuman Allah. ( Yeh. 9:1 ) Apa yang Yehezkiel lihat selanjutnya pasti membuat dia lega, karena penglihatan itu membuatnya paham bahwa tidak semua orang akan dibinasakan. Orang-orang yang setia akan selamat!"]]},"r132":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 9:5","isi":[[5,"Dan Dia berkata kepada yang lainnya, ”Ikuti dia ke seluruh kota itu dan seranglah orang-orang. Mata kalian tidak boleh merasa kasihan, dan jangan iba hati. "]]},"r133":{"j":"p","jd":"Pertanyaan Pembaca","sub":"w25.08 31 ¶1-2,","isi":[["p","Yesus mengatakan, ”Kabar baik tentang Kerajaan ini akan diberitakan di seluruh bumi, sebagai kesaksian bagi semua bangsa, kemudian akhir itu akan datang.” ( Mat. 24:14 ) Kata Yunani yang diterjemahkan sebagai ”akhir” di ayat ini, juga ayat 6 dan 13 , adalah telos. Kata itu memaksudkan akhir dari dunia Setan di Armagedon. ( Why. 16:​14, 16 ) Jadi, pekerjaan memberitakan kabar baik akan berakhir tidak lama sebelum Armagedon terjadi. Ini adalah pemahaman yang disesuaikan."],["p","Sebelumnya, kita berpikir bahwa kita akan berhenti memberitakan kabar baik saat kesengsaraan besar dimulai, yaitu saat Babilon Besar diserang. ( Why. 17:​3, 5, 15, 16 ) Kita juga berpikir bahwa sewaktu kesengsaraan besar dimulai, ”tahun kebaikan Yehuwa” berakhir. ( Yes. 61:2 ) Maksudnya, Yehuwa sudah menutup kesempatan bagi orang-orang untuk menerima kabar baik. Selain itu, kita dulu berpikir bahwa orang yang selamat melewati kesengsaraan besar sudah membuktikan kesetiaan mereka kepada Yehuwa sebelum kesengsaraan besar itu dimulai. Kita membandingkan mereka dengan orang-orang Yahudi yang selamat saat Yerusalem dihancurkan pada 607 SM. Orang-orang ini sudah ditandai untuk diselamatkan karena mereka sudah menyembah Yehuwa dan membenci kejahatan. ( Yeh. 5:11; 9:4 ) Tapi, perbandingan itu tidak sesuai dengan kata-kata Yesus di Matius 24:14 . Di ayat itu, Yesus menunjukkan bahwa orang-orang mungkin masih punya kesempatan untuk menerima kabar baik tidak lama sebelum Armagedon terjadi."]]},"r134":{"j":"p","jd":"Pertanyaan Pembaca","sub":"6","isi":[["p","Orang-orang yang berpihak kepada Yehuwa setelah diserangnya Babilon Besar punya kesempatan untuk mendukung orang-orang terurap yang masih ada di bumi. ( Mat. 25:​34-36, 40 ) Tindakan mereka terhadap saudara-saudara Kristus itu akan menentukan apakah mereka akan dihakimi sebagai domba. Tapi, kesempatan itu akan berakhir tidak lama sebelum Armagedon, sewaktu orang-orang terurap yang masih ada di bumi naik ke surga."]]},"r135":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 9:9","isi":[[9,"Maka Dia berkata kepada saya, ”Kesalahan orang Israel dan orang Yehuda sangat, sangat besar. Negeri ini penuh pertumpahan darah dan kota itu penuh kebejatan. Mereka berkata, ’Yehuwa telah meninggalkan negeri ini. Yehuwa tidak melihat.’ "]]},"r136":{"j":"p","jd":"KRONOLOGI","sub":"it ”Kronologi” ¶104","isi":[["p","Sejak terbaginya kerajaan pada tahun 997 SM sampai kejatuhan Yerusalem pada tahun 607 SM ada 390 tahun. Meskipun memang benar bahwa Samaria, ibu kota kerajaan utara, sudah ditaklukkan Asiria pada tahun 740 SM, pada tahun keenam masa pemerintahan Hizkia ( 2Raj 18:9, 10 ), beberapa di antara penduduknya mungkin melarikan diri ke kerajaan selatan sebelum penyerangan Asiria. (Perhatikan juga keadaan di Yehuda setelah terbaginya kerajaan seperti yang diuraikan di 2Taw 10:16, 17 .) Namun, yang lebih penting lagi adalah fakta bahwa Allah Yehuwa senantiasa mengingat orang Israel dari kerajaan utara yang sudah terbuang karena dalam berita para nabi-Nya, Ia selalu menyebutkan mereka bahkan lama setelah kejatuhan Samaria. Hal itu memperlihatkan bahwa kepentingan mereka masih diwakili oleh ibu kota Yerusalem dan kejatuhan kota itu pada tahun 607 SM adalah pernyataan penghukuman Yehuwa bukan saja atas Yehuda melainkan atas bangsa Israel secara keseluruhan. ( Yer 3:11-22; 11:10-12, 17; Yeh 9:9, 10 ) Sewaktu kota Yerusalem jatuh, runtuhlah harapan bangsa itu secara keseluruhan (kecuali beberapa yang tetap berpaut pada iman yang sejati).— Yeh 37:11-14, 21, 22 ."]]},"r137":{"j":"a","jd":"Yehezkiel","sub":"Yehezkiel 9:1-11","isi":[[1,"9 Lalu Dia berseru dengan suara keras, ”Panggil orang-orang yang akan menghukum kota ini. Masing-masing harus membawa senjata untuk menghancurkan!”"],[2,"Saya melihat enam pria datang dari arah gerbang atas yang menghadap utara, masing-masing membawa senjata pemukul. Ada juga satu pria memakai baju linen, dan di pinggangnya ada tempat alat tulis sekretaris. Mereka masuk dan berdiri di samping mezbah tembaga. "],[3,"Lalu kemuliaan Allah Israel terangkat dari tempatnya di atas kerub-kerub, dan pindah ke pintu bait. Kemudian, Dia berseru kepada pria yang memakai baju linen, yang di pinggangnya ada tempat alat tulis sekretaris."],[4,"Yehuwa berkata kepadanya, ”Berjalanlah ke seluruh kota, seluruh Yerusalem, dan beri tanda pada dahi orang-orang yang mengeluh dan merintih karena semua hal memuakkan yang dilakukan di kota itu.” "],[5,"Dan Dia berkata kepada yang lainnya, ”Ikuti dia ke seluruh kota itu dan seranglah orang-orang. Mata kalian tidak boleh merasa kasihan, dan jangan iba hati. "],[6,"Bunuhlah semua pria tua, pemuda, gadis, anak kecil, dan wanita, sampai semuanya binasa. Tapi jangan apa-apakan orang yang ada tandanya. Mulailah dari tempat suci-Ku.” Maka mereka mulai dengan pria-pria tua yang ada di depan bait. "],[7,"Lalu Dia berkata kepada mereka, ”Cemari bait itu dan penuhi halamannya dengan mayat-mayat. Pergilah!” Mereka pun pergi dan membunuh orang-orang di kota."],[8,"Sewaktu mereka membunuh orang-orang itu, dan saya dibiarkan hidup, saya pun sujud dan berseru, ”Aduh, Tuan Yang Mahatinggi Yehuwa! Apa Engkau akan membinasakan semua orang Israel yang tersisa saat Engkau menumpahkan kemurkaan-Mu ke atas Yerusalem?” "],[9,"Maka Dia berkata kepada saya, ”Kesalahan orang Israel dan orang Yehuda sangat, sangat besar. Negeri ini penuh pertumpahan darah dan kota itu penuh kebejatan. Mereka berkata, ’Yehuwa telah meninggalkan negeri ini. Yehuwa tidak melihat.’ "],[10,"Tapi mata-Ku tidak akan kasihan, dan Aku tidak akan iba hati. Aku akan membuat mereka merasakan akibat tingkah laku mereka.”"],[11,"Lalu saya melihat pria berbaju linen itu, yang di pinggangnya ada tempat alat tulis, kembali dan melapor, ”Aku sudah melakukan tepat seperti yang Engkau perintahkan.”"]]},"r138":{"j":"p","jd":"Baik Hati","sub":"lmd pelajaran 3 nomor 5","isi":[["p","Yoh. 9:​1-7"],["p","PELAJARAN 3"],["p","Prinsip: ”Orang yang punya kasih itu . . . baik hati.”— 1 Kor. 13:4 ."]]},"r139":{"j":"p","jd":"Peduli","sub":"lmd pelajaran 9 nomor 5","isi":[["p","Mrk. 6:​30-34"],["p","PELAJARAN 9"],["p","Prinsip: ”Bergembiralah bersama orang yang bergembira, dan menangislah bersama orang yang menangis.”— Rm. 12:15 ."]]},"r140":{"j":"p","jd":"Dia Melawan Raksasa","sub":"wcg bab 23","isi":[["p","23 DAUD"],["p","DAUD berdiri di dataran Lembah Elah dan melayangkan pandangannya ke sisi seberang lembah itu. Di situ, ada seorang pria yang sangat kuat bernama Goliat, yang tingginya hampir tiga meter! Pembawa perisai di dekat Goliat mungkin terlihat sangat kecil dibanding dia. Kebanyakan orang pasti merasa takut dan tidak berdaya waktu melihat Goliat. Tapi, Daud berbeda. Ada sesuatu yang membuatnya berani."],["p","Daud sudah dilantik oleh Nabi Samuel untuk menjadi raja Israel berikutnya. Sejak itu, kuasa kudus Yehuwa bekerja dalam diri Daud dengan luar biasa. Dia dikenal sebagai ”pejuang hebat dan berani”, meski dia masih terlalu muda untuk menjadi prajurit. Nah sekarang, dia ada di medan perang karena ayahnya, yang bernama Isai, meminta dia pergi untuk mencari tahu keadaan kakak-kakaknya yang ikut berperang. Waktu itu, Daud kelihatannya masih berumur belasan tahun."],["p","Sesampainya di Lembah Elah, Daud melihat bahwa pasukan Israel dan pasukan Filistin berhadapan di kedua sisi lembah itu. Tapi, mereka belum saling menyerang. Orang Israel tidak berani melawan Goliat, yang sudah menantang mereka selama berminggu-minggu. Saat Daud ada di sana, jagoan Filistin itu lagi-lagi berteriak menantang dan menghina orang Israel. Daud pun menjadi sangat marah. Berani-beraninya penyembah berhala itu menghina Allah Yehuwa! Untuk menyemangati para prajurit Israel, Daud bertanya kepada mereka tentang hadiah apa yang akan Raja Saul berikan kepada orang yang mengalahkan Goliat. Tapi Eliab, kakak Daud, jadi salah sangka dan memarahi Daud. Meski begitu, Daud terus menyemangati para prajurit Israel untuk melawan raksasa itu."],["p","Kata-kata Daud dilaporkan kepada Raja Saul. Daud pun dipanggil untuk menghadapnya. Daud berupaya meyakinkan sang raja dengan mengatakan, ”Jangan sampai seorang pun takut karena [Goliat].” Kemudian, dia menawarkan diri untuk ”pergi melawan orang Filistin itu” sendirian. Awalnya, Saul tidak mengizinkannya, karena dia yakin Daud akan tewas. Tapi, Daud menjelaskan bahwa Yehuwa sudah membantu dia melakukan banyak hal luar biasa, seperti membunuh singa dan beruang yang menyerang domba-domba ayahnya. Akhirnya, Saul berubah pikiran dan menyuruh Daud memakai perlengkapan perang dan membawa pedang milik Raja. Tapi, Daud tidak terbiasa dengan perlengkapan seperti itu. Jadi, dia melepaskan semuanya dan mengambil senjatanya sendiri, yaitu tongkat gembala dan umban, sebuah tali yang dipakai untuk melempar batu kecil."],["p","Daud pun turun ke dataran lembah dan berhenti di sebuah sungai untuk mengambil lima batu yang licin. Lalu, dia berjalan ke arah raksasa itu. Begitu Goliat melihat bahwa lawannya adalah anak muda, dan anak itu mau melawannya ”dengan tongkat”, dia mengejek Daud dengan suara yang menggelegar. Goliat mungkin tidak melihat umban Daud, yang bisa menjadi senjata mematikan di tangan orang yang terampil menggunakannya. Lalu, jagoan Filistin itu ”menyumpahi Daud demi allah-allahnya” dan dengan sombong mengatakan bahwa dia akan memberikan mayat Daud kepada burung dan binatang liar."],["p","Demi membela nama Yehuwa, Daud yang masih muda berani melawan raksasa"],["p","Daud menjawab, ”Kamu melawan saya dengan pedang, tombak, dan lembing, tapi saya melawan kamu dengan nama Yehuwa yang berbala tentara, Allah barisan Israel yang kamu tantang.” Daud tidak membandingkan dirinya dengan Goliat. Tapi, dia membandingkan Goliat dengan Allah Yehuwa! Itulah yang membuat dia sangat berani. Dia yakin dia bisa menumbangkan raksasa itu dan membuat orang Filistin kalah telak."],["p","Daud pun berlari ke arah musuhnya. Dia mengambil sebuah batu dari kantongnya, menaruhnya pada umban, dan dengan cepat memutar-mutar batu itu dengan tali umbannya. Kalau saat itu Goliat baru melihat umbannya, sudah terlambat bagi dia untuk menghindar. Daud melontarkan batunya, dan batu itu melesat ke arah Goliat dan menancap di dahinya! Raksasa itu pun ”jatuh dengan muka ke tanah”. Daud langsung berlari mendekati dia, mengambil pedangnya, dan memenggal kepalanya. Melihat itu, pasukan Israel menjadi berani. Mereka mulai berteriak dan menyerang pasukan Filistin. Hari itu, umat Allah mendapat kemenangan besar. Keberanian Daud yang masih muda berhasil mengobarkan semangat pasukan Israel dan terus menyemangati banyak orang sampai sekarang."],["h","Baca kisahnya di:"],["p","1 Samuel 16:​13, 18, 19; 17:​1-54"],["h","Untuk dibahas:"],["p","Bagaimana Daud yang masih muda bersikap berani?"],["h","Gali Lebih Dalam"],["p","1. Siapa saja leluhur Daud yang juga bersikap berani? ( Mat. 1:​5, 6; Luk. 3:​31-38 ; w12 1/10 24 ¶3 )"],["p","2. Bukti apa saja yang menunjukkan bahwa peristiwa ini adalah kisah nyata? ( wp16.5 13 ) Gambar A"],["p","Collection of the of Israel Antiquities Authority. Photo © The Israel Museum, by Meidad Suchowolski"],["p","Gambar A : Potongan batu bertuliskan ”Keluarga Kerajaan Daud”, yang berasal dari sekitar 2.800 tahun lalu"],["p","3. Sebagai gembala, seperti apa kehidupan Daud? ( w11 1/9 27 ¶1–28 ¶1 ) Gambar B"],["p","Todd Bolen/BiblePlaces.com"],["p","Gambar B"],["p","4. Kenapa bisa dikatakan bahwa Daud sering dianggap remeh? ( w21.03 3 ¶6 ; it ”Eliab” No. 4 ¶1 )"],["h","Pikirkan Pelajarannya"],["p","Bagaimana teladan Daud bisa membantu Saudara melawan . . ."],["p","rasa takut? Gambar C"],["p","Gambar C"],["p","keinginan untuk berbuat dosa?"],["p","Kalau kita berani, apa pengaruhnya terhadap orang lain? ( 1 Sam. 17:​50-53 )"],["p","Dengan cara apa lagi Saudara bisa meniru keberanian Daud dalam kisah ini?"],["h","Renungkan Lebih Dalam"],["p","Dari kisah ini, apa yang saya pelajari tentang Yehuwa?"],["p","Apa hubungan kisah ini dengan kehendak Yehuwa untuk mewujudkan Firdaus?"],["p","Setelah Daud dibangkitkan, apa yang mau saya tanyakan kepadanya tentang kisah ini?"],["h","Cari Tahu Lebih Banyak"],["p","Dari lagu ini, cari tahu kenapa Daud bisa sangat berani."],["p","Daud—Teladan untuk Anak-Anak (2:35)"],["p","Seperti Daud, apa yang bisa dilakukan para saudara kalau mereka mau direspek?"],["p","”Saudara-Saudara Muda—Bagaimana Agar Kalian Direspek oleh Orang Lain?” ( w21.03 2-5 ¶1-11)"]]}}};

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function barisLagu(b, kelasTambahan){
  const peluru = b.peluru === false ? "" : "";
  const menit = b.menit ? `<span class="durasi">&nbsp;(${esc(b.menit)} men.)</span>` : "";
  const nilai = b.doa !== undefined
    ? `<div class="label">Doa${b.doakah === false ? "" : ":"}</div><div class="nilai">${esc(b.doa)}</div>`
    : (b.nilai !== undefined && b.nilai !== "" ? `<div class="label"></div><div class="nilai">${esc(b.nilai)}</div>` : "");

  const cocokLagu = /^Nyanyian\s+(\d+)$/.exec(String(b.teks || "").trim());
  const adaLagu = cocokLagu && typeof LAGU !== "undefined" && LAGU[cocokLagu[1]];
  const teksLagu = adaLagu
    ? `<span class="tautan-lagu" role="button" tabindex="0" aria-expanded="false"`
      + ` data-lagu="${cocokLagu[1]}" title="Lihat lirik nyanyian">${esc(b.teks)}</span>${menit}`
    : `${esc(b.teks)}${menit}`;
  const spoilerLagu = adaLagu
    ? `<div class="tema lagu-sp" data-lagu="${cocokLagu[1]}" hidden></div>`
    : "";

  return `<div class="baris lagu ${kelasTambahan || ""}">
    <div class="waktu">${esc(b.waktu)}</div>
    <div class="isi"><span class="peluru">${peluru}</span><span class="teks">${teksLagu}</span></div>
    <div></div>
    ${nilai}
  </div>${spoilerLagu}`;
}

function adaTema(w, no){
  const p = WOL.pekan[w] && WOL.pekan[w].bagian[no];
  return p && p.isi && p.isi.length ? p : null;
}

function kolomNama(w, no, awal, duaSlot, peran, semi){
  const pisah = String(awal || "").split("/").map((t) => t.trim());
  const jml = duaSlot ? 2 : 1;
  let out = "";
  for (let i = 0; i < jml; i++){
    const simpan = namaTersimpan(w, no, "s" + i);
    const isi = (simpan != null) ? simpan : (pisah[i] || "");
    const label = duaSlot ? (peran && peran[i] ? peran[i] : (i ? "Asisten" : "Siswa")) : "Nama";
    const lihat = tampilNama(isi, !!semi);
    if (i) out += `<span class="pn-pisah${isi ? "" : " pisah-kosong"}">/</span>`;
    out += `<span class="pilih-nama" role="button" tabindex="0" aria-expanded="false"`
      + ` data-w="${esc(w)}" data-no="${esc(no)}" data-slot="s${i}" data-nilai="${esc(isi)}"`
      + ` data-semi="${semi ? "1" : "0"}"`
      + ` title="${esc(label)} — klik untuk pilih nama">`
      + `<span class="pn-teks${isi ? "" : " pn-kosong"}">${isi ? esc(lihat) : "&mdash;"}</span>`
      + `<span class="pn-caret" aria-hidden="true">&#9662;</span></span>`;
  }
  return out;
}

function barisBagian(b, kelas, w){
  const sub = b.sub ? ` <span class="sub">${esc(b.sub)}</span>` : "";
  const tanpaSiswa = b.siswa ? "" : "tanpa-siswa";
  const no = String(parseInt(b.nomor, 10));
  const tema = adaTema(w, no);
  const tombol = tema
    ? `<span class="tema-tombol" role="button" tabindex="0" data-n="${no}" aria-expanded="false" title="Tampilkan tema"></span>`
    : "";
  const pls = !!(tema && /pelajaran alkitab sidang/i.test(tema.jd));
  /* Khotbah di BERSEMANGATLAH DALAM PELAYANAN: hanya Siswa, tanpa asisten */
  const khotbah = (kelas === "pelayanan") && /^khotbah\b/i.test(String(b.teks || "").trim());
  const duaSlot = !khotbah && (pls || !!(b.siswa && b.siswa.indexOf("/") >= 0));
  const peran = pls ? ["Pemandu", "Pembaca"] : ["Siswa", "Asisten"];
  /* nama semi-lengkap HANYA untuk slot siswa/asisten; Pemandu, Pembaca,
     Pembahasan, Doa, Ketua, Pelajaran Alkitab Sidang tetap inisial */
  const semiNama = !!(b.siswa && /siswa/i.test(b.siswa));
  const labelSiswa = khotbah ? "Siswa:" : b.siswa;
  const kanan = (b.siswa ? `<div class="tengah">${esc(labelSiswa)}</div>` : "")
    + `<div class="label"></div>`
    + `<div class="nilai${duaSlot ? " dua" : ""}${(pls && !khotbah) ? " rapat" : ""}">${b.nilai ? kolomNama(w, no, b.nilai, duaSlot, peran, semiNama) : ""}</div>`;

  return `<div class="baris ${kelas} ${tanpaSiswa}">
    <div class="waktu">${esc(b.waktu)}</div>
    <div class="isi"><span class="teks bagian">${esc(b.nomor)} ${esc(b.teks)} <span class="durasi11">(${esc(b.menit)} men.)</span>${sub}${tombol}</span></div>
    ${kanan}
  </div>${tema ? `<div class="tema" data-w="${w}" data-tema="${no}" hidden></div>` : ""}`;
}

const KELAS_SEKSI = { abu:"harta", emas:"pelayanan", marun:"kehidupan" };

function renderPekan(d, index){
  let isi = "";
  let warnaAktif = null;

  d.baris.forEach((b, i) => {
    if (b.jenis === "seksi"){
      const ruang = b.ruang ? `<div class="ruang">${esc(b.ruang)}</div>` : "";
      const kelasJarak = (warnaAktif === null) ? "pertama" : "";
      isi += `<div class="seksi ${b.warna} ${kelasJarak}"><div class="bar-bagian ${b.warna}">${esc(b.judul)}</div>${ruang}</div>`;
      warnaAktif = KELAS_SEKSI[b.warna];
      return;
    }
    if (b.jenis === "lagu"){
      const kelas = warnaAktif === "kehidupan" ? "kehidupan" : "";
      const akhir = (i === d.baris.length - 2) ? " terakhir" : "";
      isi += barisLagu(b, kelas + akhir);
      return;
    }
    if (b.jenis === "bagian"){
      const terakhir = i === d.baris.length - 1;
      isi += barisBagian(b, warnaAktif || "harta", "w" + (index + 1));
      return;
    }
  });

  const catatan = d.catatan ? ` <span class="catatan">${esc(d.catatan)}</span>` : "";

  return `<section class="halaman" id="pekan-${esc(d.kunci)}">
    <div class="kepala">
      <div class="sidang">${esc(SIDANG)}</div>
      <h1 class="judul">${esc(JUDUL)}</h1>
    </div>
    <div class="garis"></div>

    <div class="baris-atas">
      <div class="pekan">${esc(d.tanggal)} | ${esc(d.kitab)}${catatan}</div>
      <div class="label">Ketua:</div>
      <div class="nilai">${esc(d.ketua)}</div>
    </div>

    ${isi}
  </section>`;
}

let pekanAktif = 0;

function tandaAktif(){
  document.querySelectorAll(".tab-pekan").forEach((b) => {
    const on = Number(b.dataset.i) === pekanAktif;
    b.classList.toggle("aktif", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
}

function skalaHalaman(){
  const lebar = document.documentElement.clientWidth;
  let s = Math.min(1, (lebar - 12) / 816);   // 612pt = 816px
  if (s > 0.98) s = 1;
  document.querySelectorAll(".halaman").forEach((h) => {
    h.style.zoom = s < 1 ? s : "";
    h.style.marginLeft = s < 1 ? "8px" : "";
  });
}

function tampilkanPekan(i, gulir){
  pekanAktif = i;
  document.getElementById("halaman").innerHTML = renderPekan(JADWAL[i], i);
  tandaAktif();
  skalaHalaman();
  if (gulir !== false) window.scrollTo({ top: 0 });
  history.replaceState(null, "", "#" + JADWAL[i].kunci);
}

/* ================= mode admin (PIN 6 angka) ================= */
function modeAdmin(){
  try { return localStorage.getItem("jhtp-admin") === "1"; } catch (e) { return false; }
}
function setAdmin(nilai){
  try {
    if (nilai) localStorage.setItem("jhtp-admin", "1");
    else localStorage.removeItem("jhtp-admin");
  } catch (e) {}
  perbaruiTombol();
}
const PIN_BAWAAN = "000000";
function pinTersimpan(){
  try {
    const v = localStorage.getItem("jhtp-pin");
    if (v && v !== "246810") return v;      // PIN yang sudah diganti sendiri
    return PIN_BAWAAN;
  } catch (e) { return PIN_BAWAAN; }
}
function simpanPin(pin){
  try { localStorage.setItem("jhtp-pin", pin); } catch (e) {}
}
function perbaruiTombol(){
  const wadah = document.getElementById("tombolKanan");
  if (!wadah) return;
  if (modeAdmin()){
    wadah.innerHTML =
      `<button type="button" class="btn-daftar" id="btnHadirin" title="Daftar penyiar & data tugas">Hadirin</button>`
      + `<button type="button" class="btn-daftar" id="btnDaftar" title="Kelola daftar nama">&#9998; Daftar nama</button>`
      + `<button type="button" class="btn-daftar" id="btnTugas" title="Isi otomatis slot siswa/asisten yang masih kosong">&#8635; Bagi tugas</button>`
      + `<button type="button" class="btn-daftar btn-keluar" id="btnKeluar" title="Keluar dari mode admin">Keluar</button>`;

/* ---------- data tugas per penyiar (untuk tampilan hadirin) ---------- */
const JEDA_PEKAN = 8;   // setelah dapat tugas, tunggu 8 pekan (dihitung per pekan, bukan per bulan)

function dataHadirin(){
  const peta = new Map();
  daftarSiswa().forEach((o) => peta.set(normNama(o.n), { o: o, tugas: 0, terakhir: null, pekan: [] }));
  JADWAL.forEach((d, wi) => {
    d.baris.forEach((b) => {
      if (!b.nomor || !b.siswa || !/siswa/i.test(b.siswa)) return;
      const jml = String(b.nilai || "").indexOf("/") >= 0 ? 2 : 1;
      for (let i = 0; i < jml; i++){
        const simpan = namaTersimpan("w" + (wi + 1), String(parseInt(b.nomor, 10)), "s" + i);
        const v = simpan != null ? simpan : (String(b.nilai || "").split("/")[i] || "").trim();
        if (!v) continue;
        const org = cariOrang(v);
        const kunciNama = normNama(org ? org.n : v);
        if (!peta.has(kunciNama)){
          peta.set(kunciNama, {
            o: org || { n: String(v).trim(), i: "", g: "", r: 1, liar: true },
            tugas: 0, terakhir: null, pekan: []
          });
        }
        const k = kunciNama;
        const it = peta.get(k);
        it.tugas += 1;
        it.pekan.push(wi);
        if (it.terakhir === null || wi > it.terakhir) it.terakhir = wi;
      }
    });
  });
  return Array.from(peta.values());
}
